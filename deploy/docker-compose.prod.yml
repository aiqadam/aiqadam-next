name: aiqadam-next-prod

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: aiqadam-next-prod-web:latest
    container_name: aiqadam-next-prod-web-1
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: "3120"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3120/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
