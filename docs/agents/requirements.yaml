# AI Qadam Next — Requirements Registry
#
# Canonical schema (do not invent a different one):
#   - id: REQ-NNN                 # sequential, never reused, never renumbered
#     title: <short summary>
#     owner: <AGENT_ID>           # role expected to implement it — FRONTEND-DEV or CONTENT-BA
#     status: pending|in_progress|done|blocked
#     description: >
#       <specific, cites real file paths where relevant>
#     acceptance_criteria:
#       - <measurable criterion>
#     depends_on: [REQ-NNN, ...]  # empty list if none
#
# Written by REQ-ANALYST (drafting), gated by REQ-VALIDATOR (WF-01), consumed by
# ORCH to select work for WF-02. Status is flipped pending -> in_progress by ORCH at
# WF-02 Step 00, and in_progress -> done by DOC-UPDATER at WF-02 Step 6 — see
# docs/agents/workflows/WF-02_requirement_implementation.md.
#
# Append new entries; never reorder, renumber, or rewrite an existing entry's id.

requirements:
  - id: REQ-001a
    title: Add next-intl + app/[locale] routing skeleton and working Nav locale switcher
    owner: FRONTEND-DEV
    status: done
    description: >
      GitHub issue #2 ("Translate to UZ" / "Add localization") requires Uzbek
      localization of the AI Qadam landing site. This requirement is the first
      of two: it proves the i18n MECHANISM end-to-end (dependency, routing,
      middleware, a working switcher) using only src/app/layout.tsx's strings as
      the seed catalog. REQ-001b (depends_on this requirement) extracts the
      remaining 12 landing components' copy once the mechanism is proven working.
      Translation quality is out of scope for both (that is REQ-002).

      Chosen approach: adopt `next-intl` as the i18n library. Rationale: Next.js
      16's own App Router internationalization guide
      (node_modules/next/dist/docs/01-app/02-guides/internationalization.md,
      "Resources" section) lists next-intl first among an unordered list of
      libraries for this exact routing shape — the doc itself does not rank or
      rate any library in that list. REQ-ANALYST's own assessment, not derived
      from the doc, is that next-intl is a well-maintained, widely-adopted choice
      with native support for the `app/[locale]/` segment routing pattern the
      same doc specifies (locale resolved via middleware/proxy, forwarded as a
      route param into every layout and page), plus a `useLocale`/`Link` pairing
      that makes a locale switcher a few lines of client code instead of a
      hand-rolled cookie/redirect scheme. The task instructions direct evaluating
      next-intl or an equivalent maintained library over inventing a custom
      routing scheme; no other library in the doc's list offers comparable
      App Router-native routing support, so no further evaluation is needed.

      Design-system fit: the Nav.tsx switcher reuses the `.nav`/`.nav-in`/`.lang`
      classes already defined in src/app/globals.css (lines 36-51), which is
      this project's own bespoke, pre-existing CSS variable set (--bg/--fg/
      --primary and friends as raw hex/oklab, defined in the :root block at the
      top of that same file) — a DIFFERENT set from the documented OKLCH design
      system under docs/Design system for AI agents/tokens/ (--background/
      --foreground/--primary). Decision: the switcher stays on the existing
      globals.css classes as-is (option a from rework guidance), not migrated
      onto the documented design-system tokens (option b). Reason: Nav.tsx and
      the entire landing page already run on globals.css's bespoke variables
      site-wide; migrating just the switcher onto a different token system while
      everything around it stays on globals.css would fragment one component's
      styling from its own parent markup for no functional gain, and no other
      part of this requirement needs the documented tokens. A full token
      migration, if ever wanted, is a separate, larger requirement of its own.

      Scope of work:
      - Add `next-intl` as a dependency.
      - Restructure routing so `src/app/page.tsx` and `src/app/layout.tsx` move
        under `src/app/[locale]/`, with locale resolution proxy/middleware per
        next-intl's App Router setup, `ru` as the default locale and `uz` as the
        second locale (locales: ["ru", "uz"], defaultLocale: "ru").
      - Create message catalogs `messages/ru.json` and `messages/uz.json`,
        seeded ONLY with the hardcoded strings currently in src/app/layout.tsx:
        `title`, `description`, the OpenGraph title/description/locale field
        (`ru_RU`), and the Twitter card title/description. For `messages/uz.json`,
        populate every key with the Russian source string duplicated verbatim as
        a placeholder — this requirement's acceptance criteria are about the
        mechanism working end-to-end, not translation content. REQ-001b adds the
        remaining components' keys to both catalogs; REQ-002 (depends_on
        REQ-001a and REQ-001b) replaces every uz placeholder with real Uzbek copy.
      - Replace the static language switcher already present in
        src/components/landing/Nav.tsx (the `<div className="lang">` block with
        RU/UZ/EN spans, currently marked `title="Прототип: переключатель языка"`
        i.e. "Prototype: language switcher" — it renders locale labels but has no
        click handlers or hrefs) with a working switcher between `ru` and `uz`
        only (drop the non-functional `EN` option — no English locale is in
        scope) that navigates via next-intl's locale-aware `Link`/routing helpers
        and reuses only the existing `.lang`/`.lang a`/`.lang .on` classes
        already defined in src/app/globals.css (lines 48-51) — no new colors,
        spacing values, or component patterns.
      - `src/app/[locale]/layout.tsx` sets `<html lang={locale}>` dynamically
        (`ru` or `uz`) and localizes the metadata title/description/OpenGraph
        locale field (`ru_RU` / `uz_UZ`) from the active locale's message
        catalog (as seeded above), replacing the hardcoded Russian-only values.
      - Root `/` redirects to `/ru` (the default locale) per next-intl's
        recommended proxy/middleware config.
    acceptance_criteria:
      - "Visiting /uz renders the page with <html lang=\"uz\">, and visiting /ru (or /) renders <html lang=\"ru\">, verified by inspecting the rendered HTML output of `npm run build && npm run start` for both paths."
      - "Clicking the Nav.tsx locale switcher's UZ control while on any /ru/* page navigates to the equivalent /uz/* page (same section anchors preserved), and clicking RU while on /uz/* navigates back to /ru/*, verified by manual click-through per TEST-DESIGNER's spec."
      - "next-intl appears as a dependency in package.json, and `npm run build` completes with no type or routing errors after the src/app -> src/app/[locale] restructuring, with middleware/proxy config present per next-intl's setup."
      - "messages/ru.json and messages/uz.json exist, each containing exactly the keys sourced from src/app/layout.tsx (title, description, OpenGraph title/description/locale, Twitter title/description), with every messages/uz.json value present and non-empty (verified by a diff/script comparing the two catalogs' key sets), even where the uz value is a placeholder duplicate of the ru value."
      - "The Nav.tsx switcher control offers exactly two options, RU and UZ (the prior non-functional EN option is removed), using only the existing `.lang`/`.lang a`/`.lang .on` classes defined in src/app/globals.css lines 48-51 — no new hex colors or spacing values introduced (grep for raw hex/px literals in the changed CSS confirms none)."
    depends_on: []

  - id: REQ-001b
    title: Extract landing-component copy into next-intl message catalogs
    owner: FRONTEND-DEV
    status: done
    description: >
      Depends on REQ-001a, which lands the next-intl dependency, the
      app/[locale] routing/middleware skeleton, the working Nav.tsx locale
      switcher, and messages/ru.json + messages/uz.json seeded from only
      src/app/layout.tsx's strings. This requirement extracts the remaining
      hardcoded copy from all 12 landing components under
      src/components/landing/ (Band, Creed, Doors, Events, Footer, Hero,
      MapSection, Metrics, Nav, Partners, Streams, Team) into the same two
      catalogs, and updates each component to read its copy from the catalog via
      next-intl's hooks (`useTranslations` in client components, `getTranslations`
      in server components, as appropriate per each component's existing
      client/server status) instead of inline strings. As with REQ-001a's seed
      keys, every new messages/uz.json value added here is populated with the
      Russian source string duplicated verbatim as a placeholder — translation
      content is out of scope for this requirement; REQ-002 (depends_on this
      requirement and REQ-001a) replaces every uz placeholder, from both
      requirements' keys, with real Uzbek copy.
    acceptance_criteria:
      - "Every hardcoded user-facing string in the 12 landing components (Band, Creed, Doors, Events, Footer, Hero, MapSection, Metrics, Nav, Partners, Streams, Team, all under src/components/landing/) is replaced with a next-intl translation call (`useTranslations`/`getTranslations`), verified by grepping each component file for remaining literal Cyrillic text — none should remain outside of messages/ru.json and messages/uz.json."
      - "messages/ru.json and messages/uz.json each contain a key for every string extracted from the 12 components, in addition to the REQ-001a keys already present, with matching key sets between the two catalogs (verified by a diff/script comparing key sets)."
      - "Every messages/uz.json key added by this requirement has a non-empty value (a placeholder duplicate of the ru value is acceptable per this requirement's scope), verified by the same key-set diff plus a non-empty-value check."
      - "`npm run build` completes with no type or routing errors after all 12 components are wired to next-intl hooks."
      - "Visiting /ru and /uz both render all 12 landing sections with no missing-translation-key runtime errors or fallback warnings in the build/start output."
    depends_on: [REQ-001a]

  - id: REQ-002
    title: Write Uzbek (Latin-script) translations for all landing page copy
    owner: CONTENT-BA
    status: done
    description: >
      Depends on REQ-001a and REQ-001b, which together establish the
      messages/ru.json and messages/uz.json catalogs (REQ-001a seeds keys from
      src/app/layout.tsx; REQ-001b adds keys from all 12 landing components)
      with placeholder Russian-duplicated values under every uz key. This
      requirement replaces every placeholder in messages/uz.json with an actual
      Uzbek (O'zbek, Latin script — the modern standard orthography, not
      Cyrillic Uzbek) translation, following docs/guides/content_ba_guide.md's
      voice/casing/vocabulary rules (functional operator-facing tone, no
      exclamation marks or slogans, sentence case for buttons/menu items, Title
      Case for section/page titles mapping to a domain noun, UPPERCASE MONO for
      status labels) applied to Uzbek rather than Russian prose. Scope covers
      every string sourced from src/app/layout.tsx (title, description,
      OpenGraph/Twitter metadata) and all 12 landing components under
      src/components/landing/ (Doors, Events, Hero, Partners, MapSection, Nav,
      Streams, Creed, Footer, Metrics, Band, Team) as carried into
      messages/uz.json by REQ-001a and REQ-001b.

      Domain vocabulary decision (the content_ba_guide.md / design system readme
      do not currently state this for non-English locales, so it is decided
      explicitly here): the design system's domain vocabulary terms — Event,
      Chapter, Talk, Speaker, CFP, Agenda, Check-in, Going, Watching — STAY IN
      ENGLISH VERBATIM in the Uzbek copy, exactly as they already do in the
      Russian copy per content_ba_guide.md §4 ("use verbatim, don't invent
      synonyms"). Rationale: these are established cross-locale product/brand
      terms shared across all AI Qadam surfaces (brand.aiqadam.org's design
      system is itself English-vocabulary for these terms regardless of body
      copy language), not general vocabulary — inventing Uzbek equivalents would
      break consistency with the Russian site, the design system's own
      component/prop naming, and any future EN surface, and the guide's
      "verbatim" instruction for Russian is adopted unchanged for Uzbek rather
      than reinterpreted per locale. Surrounding sentence structure, headings,
      and connecting prose around these terms are still fully translated into
      Uzbek — only the specific vocabulary tokens listed above remain untranslated.
    acceptance_criteria:
      - "Every string key in messages/uz.json has a non-empty value that is not byte-for-byte identical to the corresponding messages/ru.json value (verified by a diff/script comparing values per key — a leftover placeholder duplicate fails this check), except where a key's value consists solely of an untranslatable literal — event/date codes, country/role/brand names, URLs, numeric values, or proper product names (including the content_ba_guide.md §4 domain-vocabulary terms Event, Chapter, Talk, Speaker, CFP, Agenda, Check-in, Going, Watching) — which are permitted to match verbatim per this requirement's domain-vocabulary decision."
      - "No Cyrillic characters appear anywhere in messages/uz.json's values (verified by a script checking for Unicode Cyrillic code points, U+0400 to U+04FF) — the translation is Latin-script Uzbek throughout, with the sole exception of the verbatim English domain-vocabulary tokens which contain no Cyrillic by definition."
      - "The status-label keys — Streams.tsx's stream{N}Status keys and MapSection.tsx's chapter{N}Status keys — hold plain lowercase Latin-script Uzbek (or the verbatim English domain term) values in messages/uz.json, matching the lowercase convention already used for these keys in messages/ru.json; uppercase display comes purely from src/app/globals.css line 152's unconditional \"text-transform:uppercase\" rule on the .status class, not from the JSON values themselves, consistent with content_ba_guide.md §4's casing rule."
      - "No exclamation marks, slogans, or emoji appear in any messages/uz.json value (grepped), matching the tone rule in content_ba_guide.md §3."
    depends_on: [REQ-001a, REQ-001b]

  - id: REQ-003
    title: Add English (en) locale to routing and seed messages/en.json
    owner: FRONTEND-DEV
    status: done
    description: >
      GitHub issue #3 ("translate to en") asks for an English version of the
      site. REQ-001a explicitly scoped English out when it built the ru/uz i18n
      mechanism ("no English locale is in scope") — this requirement is
      additive, not a fix or redo of REQ-001a: it realizes a locale REQ-001a
      deliberately deferred, matching the design system readme's brand voice
      principle #6 ("Multilingual by default — Russian, Uzbek, Kazakh, Kyrgyz,
      Tajik, English — equal weight," docs/guides/content_ba_guide.md §2).

      Verified current state (2026-08-28, re-checked against this run's own
      dispatch summary rather than trusted as-is): src/i18n/routing.ts defines
      `locales: ["ru", "uz"]`, `defaultLocale: "ru"`. messages/ru.json and
      messages/uz.json each hold exactly 177 leaf keys with matching key sets
      (verified by script). The locale switcher is no longer the inline
      `<div className="lang">` block described in REQ-001a's own text — it has
      since been extracted into src/components/landing/LocaleSwitcher.tsx,
      which renders one link per entry in `routing.locales` generically (no
      hardcoded ru/uz list, no per-locale JSX branches). Consequence: adding
      `"en"` to `routing.locales` is sufficient by itself to produce a working
      three-way ru/uz/en switcher control — LocaleSwitcher.tsx requires no code
      change for this requirement. This is a genuine change from REQ-001a's
      framing (written when the switcher was still inline JSX needing an
      explicit RU/UZ-only edit) and is stated here explicitly rather than
      silently carried over.

      defaultLocale decision: stays `"ru"`. No source (GitHub issue #3, the
      design system readme's voice principle #6, or any decisions/ record)
      states a reason to change the default locale — issue #3 only asks for an
      English version to exist, not for English to become the entry point.
      Adding a locale is not grounds to silently change default-locale
      behavior per this run's own dispatch instruction.

      Scope of work:
      - Add `"en"` to the `locales` array in src/i18n/routing.ts, after `"uz"`
        (`locales: ["ru", "uz", "en"]`), keeping `defaultLocale: "ru"` unchanged.
      - Create messages/en.json containing every key currently present in
        messages/ru.json (same 177-key structure/nesting), with every value set
        to the Russian source string duplicated verbatim as a placeholder —
        translation content is out of scope for this requirement. REQ-004
        (depends_on this requirement) replaces every en placeholder with real
        English copy.
      - Confirm src/i18n/request.ts needs no change: it already resolves
        messages via `(await import(\`../../messages/${locale}.json\`))` and
        falls back to `routing.defaultLocale` for any unrecognized locale, so
        it works for a third locale without modification — verify this by
        reading the file, don't just assume it from this description.
      - Confirm src/components/landing/LocaleSwitcher.tsx needs no change per
        the verified-state note above; if manual verification during
        implementation finds it does require a change (e.g. a hardcoded
        two-locale assumption this description missed), make the minimal fix
        and state what was found and why in the handoff's result — don't
        silently diverge from this description without recording it.
      - `src/app/[locale]/layout.tsx` (or wherever REQ-001a's dynamic
        `<html lang={locale}>`/metadata logic now lives after REQ-001b's
        extraction) must handle `en` the same way it already handles `ru`/`uz`
        — verify by reading the current file rather than assuming REQ-001a's
        original description still matches it exactly, since LocaleSwitcher.tsx
        already diverged from that description once.
    acceptance_criteria:
      - "src/i18n/routing.ts's `locales` array is exactly `[\"ru\", \"uz\", \"en\"]` and `defaultLocale` remains `\"ru\"`, verified by reading the file after the change."
      - "messages/en.json exists with a key set identical to messages/ru.json's (same 177 leaf keys, same nesting), every value non-empty, verified by a diff/script comparing the two catalogs' key sets — matching this run's own verification method for messages/ru.json vs messages/uz.json."
      - "Visiting /en renders the page with `<html lang=\"en\">`, and /ru and /uz continue to render `<html lang=\"ru\">`/`<html lang=\"uz\">` respectively (no regression), verified by inspecting the rendered HTML output of `npm run build && npm run start` for all three paths."
      - "The LocaleSwitcher.tsx control renders three options (RU, UZ, EN); clicking EN from any /ru/* or /uz/* page navigates to the equivalent /en/* page with the same section anchors preserved, and clicking RU/UZ from /en/* navigates back correctly, verified by manual click-through per TEST-DESIGNER's spec."
      - "`npm run build` completes with no type or routing errors after the change."
      - "Visiting /en renders all landing sections with no missing-translation-key runtime errors or fallback warnings in the build/start output (placeholder English-as-Russian-duplicate values are acceptable content-wise at this stage, but must not be missing keys)."
    depends_on: [REQ-001a, REQ-001b]

  - id: REQ-004
    title: Write real English translations for all landing page copy
    owner: CONTENT-BA
    status: done
    description: >
      Depends on REQ-003, which adds `"en"` to src/i18n/routing.ts and seeds
      messages/en.json with every messages/ru.json key populated with a
      Russian-duplicated placeholder value. This requirement replaces every
      placeholder in messages/en.json with actual English copy, following
      docs/guides/content_ba_guide.md's voice/casing/vocabulary rules (§2's
      seven voice principles — functional operator-facing tone, no exclamation
      marks or slogans, §4's casing: sentence case for buttons/menu items,
      Title Case for section/page titles mapping to a domain noun, UPPERCASE
      MONO for status labels) applied directly, since English is the guide's
      own drafting language already (§4: "draft with Russian and English both
      in mind"). Scope covers every string sourced from src/app/layout.tsx
      (title, description, OpenGraph/Twitter metadata) and all 12 landing
      components under src/components/landing/ (Band, Creed, Doors, Events,
      Footer, Hero, MapSection, Metrics, Nav, Partners, Streams, Team) as
      carried into messages/en.json by REQ-003.

      Domain vocabulary decision (REQ-002's decision covered Uzbek; this is a
      genuinely new question REQ-002's precedent does not settle, because for
      the first time the target locale itself IS English): content_ba_guide.md
      §4 lists Event, Chapter, Talk, Speaker, CFP, Agenda, Check-in, Going,
      Watching as domain vocabulary to "use verbatim, don't invent synonyms" —
      a rule written for translating INTO a non-English locale while keeping
      these terms in their original English form. For messages/en.json, these
      terms are simply the correct English words in-language, not a
      verbatim-preserved foreign insertion — there is no separate "translation"
      step for them distinct from writing the surrounding English sentence.
      Decision: use the exact same casing/form already established in
      content_ba_guide.md §4 and in messages/ru.json/messages/uz.json's
      verbatim usage (Event, Chapter, Talk, Speaker, CFP, Agenda, Check-in,
      Going, Watching) — do not substitute synonyms (e.g. not "Session" for
      "Talk," not "Registration" for "Check-in") even though English drafting
      offers more synonym options than translation into another language does.
      This keeps the vocabulary identical across all three locales' source
      concepts, preserving the design system's own component/prop naming
      consistency (the same rationale REQ-002 used for Uzbek, restated here for
      English specifically since the "verbatim" framing no longer literally
      applies once the base language is English).
    acceptance_criteria:
      - "Every string key in messages/en.json has a non-empty value that is not byte-for-byte identical to the corresponding messages/ru.json value (verified by a diff/script comparing values per key — a leftover placeholder duplicate fails this check), except where a key's value consists solely of an untranslatable literal — event/date codes, country/role/brand names, URLs, numeric values, or proper product names — which are permitted to match verbatim."
      - "No Cyrillic characters appear anywhere in messages/en.json's values (verified by a script checking for Unicode Cyrillic code points, U+0400 to U+04FF)."
      - "The domain vocabulary terms (Event, Chapter, Talk, Speaker, CFP, Agenda, Check-in, Going, Watching) appear in messages/en.json using exactly the casing/form stated in this requirement's domain-vocabulary decision, with no synonym substitutions, verified by checking each occurrence against content_ba_guide.md §4's list."
      - "The status-label keys — Streams.tsx's stream{N}Status keys and MapSection.tsx's chapter{N}Status keys — hold plain lowercase English values in messages/en.json (e.g. \"upcoming\", \"live\", \"past\"), matching the lowercase convention already used for these keys in messages/ru.json and messages/uz.json; uppercase display comes from src/app/globals.css's `.status` class `text-transform:uppercase` rule, not from the JSON values themselves, consistent with content_ba_guide.md §4's casing rule."
      - "No exclamation marks, slogans, or emoji appear in any messages/en.json value (grepped), matching the tone rule in content_ba_guide.md §3."
    depends_on: [REQ-003]

  - id: REQ-005
    title: Add Kazakh (kk) locale to routing and seed messages/kk.json
    owner: FRONTEND-DEV
    status: done
    description: >
      GitHub issue #4 ("Add KZ translation") asks for a Kazakh version of the
      site. This is structurally identical to GitHub issue #3 ("translate to
      en"), resolved by REQ-003 (routing/mechanism) + REQ-004 (real
      translations) — this requirement mirrors REQ-003's split exactly, for
      Kazakh. The design system readme's brand voice principle #6
      (docs/guides/content_ba_guide.md §2) already commits to "Multilingual by
      default — Russian, Uzbek, Kazakh, Kyrgyz, Tajik, English — equal weight,"
      so Kazakh is a locale this project already committed to, not new scope.

      Locale code decision: use ISO 639-1 code `"kk"` for Kazakh. This is the
      standard ISO code for Kazakh (distinct from `"kz"`, which is not a
      language code — `KZ` is the ISO 3166-1 country code for Kazakhstan, used
      only in region-tagged locale variants like OpenGraph's `kk_KZ`, never as
      the locale segment itself). `"kk"` matches how this project already uses
      ISO 639-1 codes for `ru`/`uz`/`en`, and next-intl/Next.js both expect ISO
      language codes as route segments.

      Verified current state (2026-08-28, re-checked directly against the live
      files, not trusted from any prior handoff summary): src/i18n/routing.ts
      defines `locales: ["ru", "uz", "en"]`, `defaultLocale: "ru"`. No `"kk"`
      locale exists anywhere in the codebase (confirmed by grep). messages/
      ru.json, messages/uz.json, and messages/en.json each hold exactly 177
      leaf keys with matching key sets (re-verified by script — REQ-004's
      177-key count has NOT grown since its close). src/i18n/request.ts
      resolves messages via `(await import(\`../../messages/${locale}.json\`))`
      with a `hasLocale`/`routing.defaultLocale` fallback — fully generic,
      confirmed by reading the file; it needs no change to support a fourth
      locale. src/components/landing/LocaleSwitcher.tsx maps over
      `routing.locales` generically (no hardcoded locale list, no per-locale
      branches) — confirmed by reading the file; it needs no change.
      src/app/[locale]/layout.tsx sets `<html lang={locale}>` dynamically from
      the route param and reads OpenGraph's `locale` field from the message
      catalog's own `Metadata.ogLocale` key (not hardcoded per-locale JSX) —
      confirmed by reading the file; it needs no change. All three of
      request.ts, LocaleSwitcher.tsx, and layout.tsx are locale-count-agnostic
      by construction, matching what REQ-003 found for the ru/uz -> ru/uz/en
      step and carrying forward unchanged for uz/en -> kk.

      defaultLocale decision: stays `"ru"`. No source (GitHub issue #4, the
      design system readme's voice principle #6, or any docs/agents/decisions/
      record) states a reason to change the default locale — issue #4 only
      asks for a Kazakh version to exist, not for Kazakh to become the entry
      point. Adding a locale is not grounds to silently change default-locale
      behavior, matching REQ-003's own explicit statement of this same point.

      Scope of work:
      - Add `"kk"` to the `locales` array in src/i18n/routing.ts, after `"en"`
        (`locales: ["ru", "uz", "en", "kk"]`), keeping `defaultLocale: "ru"`
        unchanged.
      - Create messages/kk.json containing every key currently present in
        messages/ru.json (same 177-key structure/nesting), with every value
        set to the Russian source string duplicated verbatim as a placeholder
        — translation content, including the `Metadata.ogLocale` value (seeded
        as the placeholder `"ru_RU"`), is out of scope for this requirement.
        REQ-006 (depends_on this requirement) replaces every kk placeholder,
        including setting `Metadata.ogLocale` to `"kk_KZ"`, with real Kazakh
        copy.
      - No change expected to src/i18n/request.ts, src/components/landing/
        LocaleSwitcher.tsx, or src/app/[locale]/layout.tsx per the
        verified-current-state note above. If manual verification during
        implementation finds any of the three does require a change (a
        locale-count assumption this description missed), make the minimal
        fix and state what was found and why in the handoff's result — don't
        silently diverge from this description without recording it.
    acceptance_criteria:
      - "src/i18n/routing.ts's `locales` array is exactly `[\"ru\", \"uz\", \"en\", \"kk\"]` and `defaultLocale` remains `\"ru\"`, verified by reading the file after the change."
      - "messages/kk.json exists with a key set identical to messages/ru.json's (same 177 leaf keys, same nesting), every value non-empty, verified by a diff/script comparing the two catalogs' key sets — matching this project's own verification method used for messages/uz.json and messages/en.json."
      - "Visiting /kk renders the page with `<html lang=\"kk\">`, and /ru, /uz, /en continue to render their respective `<html lang>` values with no regression, verified by inspecting the rendered HTML output of `npm run build && npm run start` for all four paths."
      - "The LocaleSwitcher.tsx control renders four options (RU, UZ, EN, KK); clicking KK from any other locale's page navigates to the equivalent /kk/* page with the same section anchors preserved, and clicking any other locale from /kk/* navigates back correctly, verified by manual click-through per TEST-DESIGNER's spec."
      - "`npm run build` completes with no type or routing errors after the change."
      - "Visiting /kk renders all landing sections with no missing-translation-key runtime errors or fallback warnings in the build/start output (placeholder Kazakh-as-Russian-duplicate values are acceptable content-wise at this stage, but must not be missing keys)."
    depends_on: [REQ-001a, REQ-001b]

  - id: REQ-006
    title: Write real Kazakh (Cyrillic-script) translations for all landing page copy
    owner: CONTENT-BA
    status: done
    description: >
      Depends on REQ-005, which adds `"kk"` to src/i18n/routing.ts and seeds
      messages/kk.json with every messages/ru.json key populated with a
      Russian-duplicated placeholder value (including `Metadata.ogLocale`
      seeded as the placeholder `"ru_RU"`). This requirement replaces every
      placeholder in messages/kk.json with actual Kazakh copy, following
      docs/guides/content_ba_guide.md's voice/casing/vocabulary rules (§2's
      seven voice principles — functional operator-facing tone, no exclamation
      marks or slogans; §4's casing: sentence case for buttons/menu items,
      Title Case for section/page titles mapping to a domain noun, UPPERCASE
      MONO for status labels) applied to Kazakh prose, and sets
      `Metadata.ogLocale` to `"kk_KZ"` (the OpenGraph region-tagged locale
      code, matching the `ru_RU`/`uz_UZ`/`en_US` pattern already established
      by REQ-001a/REQ-002/REQ-004). Scope covers every string sourced from
      src/app/layout.tsx-derived `Metadata` keys and all 12 landing components
      under src/components/landing/ (Band, Creed, Doors, Events, Footer, Hero,
      MapSection, Metrics, Nav, Partners, Streams, Team) as carried into
      messages/kk.json by REQ-005.

      Script decision (stated explicitly, not silently copied from REQ-002's
      Uzbek precedent — this is a genuinely different situation): Kazakh copy
      on this site uses CYRILLIC script, not Latin. Kazakhstan's government has
      an announced transition to a Latin alphabet, but as of this decision
      that transition remains incomplete in actual practice — Cyrillic is
      still the script used in Kazakhstan's day-to-day government documents,
      education, media, and general public literacy, i.e. it is what the
      large majority of the site's actual Kazakh-reading target audience
      currently reads fluently. This differs from REQ-002's Uzbek decision:
      Uzbekistan's Latin script is Uzbekistan's actual current official
      standard orthography, taught in schools since the 1990s and used in
      official contexts today, which is why REQ-002 correctly chose Latin for
      Uzbek. The two locales are not analogous on this point and REQ-002's
      choice is not extended here by default. If Kazakhstan's Latin transition
      later reaches the point where Latin is the dominant script in practice,
      revisit this decision in a new requirement rather than editing this
      one's completed record.

      Domain vocabulary decision (following REQ-002/REQ-004's precedent
      pattern, restated for this locale rather than silently assumed): the
      content_ba_guide.md §4 domain vocabulary terms — Event, Chapter, Talk,
      Speaker, CFP, Agenda, Check-in, Going, Watching — STAY IN ENGLISH
      VERBATIM in the Kazakh copy, exactly as they already do in the Russian,
      Uzbek, and English copy. Rationale: unchanged from REQ-002's reasoning —
      these are established cross-locale product/brand terms shared across all
      AI Qadam surfaces regardless of body-copy language, not general
      vocabulary; inventing Kazakh equivalents would break consistency with
      the other three locales and the design system's own component/prop
      naming. Surrounding sentence structure, headings, and connecting prose
      around these terms are still fully translated into Kazakh — only the
      specific vocabulary tokens listed above remain untranslated.
    acceptance_criteria:
      - "Every string key in messages/kk.json has a non-empty value that is not byte-for-byte identical to the corresponding messages/ru.json value (verified by a diff/script comparing values per key — a leftover placeholder duplicate fails this check), except where a key's value consists solely of an untranslatable literal — event/date codes, country/role/brand names, URLs, numeric values, or proper product names (including the content_ba_guide.md §4 domain-vocabulary terms Event, Chapter, Talk, Speaker, CFP, Agenda, Check-in, Going, Watching) — which are permitted to match verbatim per this requirement's domain-vocabulary decision."
      - "messages/kk.json's `Metadata.ogLocale` value is exactly `\"kk_KZ\"` (not the placeholder `\"ru_RU\"`), verified by reading the key directly."
      - "Every messages/kk.json value uses Cyrillic-script Kazakh (verified by a script checking for the presence of Kazakh-specific Cyrillic-extension code points — Ә, Ғ, Қ, Ң, Ө, Ұ, Ү, Һ, І and their lowercase forms — appearing somewhere across the file, confirming genuine Kazakh rather than a Russian-Cyrillic duplicate left in place), with no Latin-script prose sentences present, the sole exception being the verbatim English domain-vocabulary tokens and untranslatable literals permitted by the first criterion."
      - "The status-label keys — Streams.tsx's stream{N}Status keys and MapSection.tsx's chapter{N}Status keys — hold plain lowercase Cyrillic-script Kazakh (or the verbatim English domain term) values in messages/kk.json, matching the lowercase convention already used for these keys in messages/ru.json/uz.json/en.json; uppercase display comes purely from src/app/globals.css's unconditional `.status` `text-transform:uppercase` rule, not from the JSON values themselves, consistent with content_ba_guide.md §4's casing rule."
      - "No exclamation marks, slogans, or emoji appear in any messages/kk.json value (grepped), matching the tone rule in content_ba_guide.md §3."
    depends_on: [REQ-005]

  - id: REQ-007
    title: Move the Next.js site from the repo root into apps/web and establish the npm workspace root
    owner: FRONTEND-DEV
    status: done
    description: >
      Implements the layout half of docs/agents/decisions/0003-events-bot-subproject.md
      ("Layout: the site moves to apps/web"). This is the FIRST requirement of the
      Events Bot programme: every subsequent requirement REQ-008..REQ-032 depends on it
      transitively, because they all cite apps/web/** or apps/bot/** paths that do not
      exist until this lands.

      Scope is deliberately limited to the FILE MOVE plus the workspace root, so it fits
      one agent turn. Deploy/Docker/CI path updates are REQ-008; the apps/bot skeleton is
      REQ-009. Splitting this way keeps each turn's blast radius to one verifiable
      surface: this one is "the site still builds and serves from its new location".

      Scope of work:
      - Move, with `git mv` so history is preserved, the following root entries into
        apps/web/: src/, messages/, public/, next.config.ts, tsconfig.json,
        eslint.config.mjs, next-env.d.ts, and the existing root package.json
        (which becomes apps/web/package.json, keeping name/scripts/dependencies as-is).
      - Create a NEW root package.json declaring `"private": true` and
        `"workspaces": ["apps/*"]`, with root-level `dev`/`build`/`lint`/`start` scripts
        that delegate to the web workspace (e.g. `npm run build -w apps/web`) so the
        existing CI invocations `npm run lint` / `npm run build` at the repo root keep
        working unchanged. Regenerate package-lock.json at the root via `npm install`
        so the lockfile describes the workspace tree.
      - Leave Dockerfile, deploy/, .github/workflows/ci-cd.yml, README.md, AGENTS.md,
        CLAUDE.md, .gitignore and docs/ at the repo root. Dockerfile and deploy path
        fixes are REQ-008's scope — this requirement must NOT edit them, and it is
        expected and acceptable that `docker build` is broken between REQ-007 and
        REQ-008 landing (they are sequenced and merged in that order).
      - Do not rewrite or renumber REQ-001a..REQ-006. Per decision 0003, their
        descriptions cite pre-migration root-relative paths and stand as historical
        records. PATH MAPPING NOTE, recorded here as decision 0003 directs: any
        root-relative source path cited by REQ-001a..REQ-006 (src/i18n/routing.ts,
        messages/kk.json, src/components/landing/*.tsx, src/app/globals.css, ...) is
        read after this requirement as apps/web/<old path>.
    acceptance_criteria:
      - "apps/web/package.json, apps/web/next.config.ts, apps/web/tsconfig.json, apps/web/eslint.config.mjs, apps/web/src/, apps/web/messages/ and apps/web/public/ all exist, and none of src/, messages/, public/, next.config.ts, tsconfig.json, eslint.config.mjs or next-env.d.ts remains at the repo root (verified by `ls` at the root plus `git status` showing renames, not delete+add)."
      - "The repo-root package.json declares `\"workspaces\": [\"apps/*\"]` and `\"private\": true`, and `npm run build` and `npm run lint` executed FROM THE REPO ROOT both complete with exit code 0 and no type, routing or module-resolution errors — the same two commands .github/workflows/ci-cd.yml's `build` job runs."
      - "`npm run build && npm run start` from the repo root serves all four locales: /ru, /uz, /en and /kk each render with the matching `<html lang>` value and no missing-translation-key errors, and /health returns HTTP 200 — matching the verification REQ-005 used, re-run after the move."
      - "apps/web/messages/ contains exactly the four catalogs ru.json, uz.json, en.json, kk.json with identical key sets (re-verified by the same key-set diff script REQ-005's acceptance criteria used), proving the move lost no catalog content."
      - "`git log --follow apps/web/src/i18n/routing.ts` shows the pre-migration commit history, proving `git mv` was used rather than a delete-and-recreate."
    depends_on: []

  - id: REQ-008
    title: Repoint Dockerfile, deploy compose files and the CI workflow at the apps/web workspace
    owner: FRONTEND-DEV
    status: done
    description: >
      Second half of the monorepo migration begun in REQ-007. REQ-007 moves the site's
      source into apps/web/ and creates the workspace root but deliberately does not
      touch the build/deploy surface; between REQ-007 and this requirement the Docker
      image build is expected to be broken. This requirement repairs it.

      Concrete current state, read from the live files at drafting time (verify before
      changing, per HANDOFF_PROTOCOL.md 1.1 — do not trust this paragraph):
      - Dockerfile (repo root) copies `package.json package-lock.json ./`, runs
        `npm ci`, `COPY . .`, `npm run build`, then in the runtime stage copies
        /app/public, /app/.next, /app/node_modules and /app/package.json. After
        REQ-007, `public/` and `.next/` live under /app/apps/web/, so every one of
        those runtime COPY paths is wrong.
      - deploy/docker-compose.qa.yml and deploy/docker-compose.prod.yml both set
        `build.context: ..` and `dockerfile: Dockerfile`, run `network_mode: host`,
        PORT 3120, and health-check http://127.0.0.1:3120/health.
      - .github/workflows/ci-cd.yml's `build` job runs `npm ci`, `npm run lint`,
        `npm run build` at the repo root and then `docker build -t
        aiqadam-next:ci-<sha> .` — the root scripts REQ-007 adds keep the first three
        working; only the docker build needs this requirement.

      Scope of work: update the Dockerfile's builder and runtime stages so the built
      Next.js app is produced from and copied out of the apps/web workspace (root
      package.json + package-lock.json + apps/web/package.json for `npm ci`, then the
      app's build output and public assets from apps/web). Keep the runtime CMD serving
      on PORT with the same /health contract, so deploy/docker-compose.*.yml need no
      change beyond whatever the verified reality requires. Do not change the deploy
      contract itself — deploy/deploy.sh's `deploy:<sha>` SSH forced-command interface,
      the compose project names, the host networking mode and port 3120 all stay exactly
      as they are; this requirement repoints paths, it does not redesign deployment.

      Post-implementation correction (WF02-REQ-008, 2026-09-06): by the time this run
      started, the Dockerfile's COPY paths had already been repointed at apps/web by an
      out-of-process commit during REQ-007's merge (2c58702, "fix(docker): update
      Dockerfile for apps/web monorepo layout") — so the Dockerfile itself needed no
      further edit here. The gap this run actually closed was narrower: the repo had no
      root `.dockerignore`, so the host's node_modules — which under npm workspaces
      contains a symlink at node_modules/app pointing back into the workspace — leaked
      into the Docker build context and broke that symlink inside the image. This run's
      real fix was adding a root `.dockerignore` (excluding node_modules and other
      build-context noise) so the image builds its own node_modules cleanly instead of
      inheriting the host's. All 4 acceptance criteria below were independently verified
      as satisfied on current HEAD.
    acceptance_criteria:
      - "`docker build -t aiqadam-next:req008 .` from the repo root completes with exit code 0 — the exact command .github/workflows/ci-cd.yml's `build` job runs (with a different tag)."
      - "`docker run --rm -e PORT=3120 -p 3120:3120 aiqadam-next:req008` serves HTTP 200 at http://127.0.0.1:3120/health and renders /ru, /uz, /en and /kk with their matching `<html lang>` values, verified by actual curl output pasted into the verification report — this is the same health contract deploy/docker-compose.qa.yml's healthcheck asserts."
      - "`docker compose -p aiqadam-next-qa -f deploy/docker-compose.qa.yml config` parses without error and still resolves `build.context: ..` plus `dockerfile: Dockerfile` to the repo-root Dockerfile."
      - "deploy/deploy.sh is unchanged (verified by `git diff --stat` showing no modification to that file), preserving the `deploy:<7-40 hex>` SSH forced-command contract and its no-`git clean` hard rule."
    depends_on: [REQ-007]

  - id: REQ-009
    title: Create the apps/bot workspace skeleton on grammY, Drizzle and Vitest
    owner: BACKEND-DEV
    status: done
    description: >
      Creates the empty-but-buildable apps/bot workspace that every later bot
      requirement writes into.

      SCOPE CHANGE, 2026-09-06 — the three technology questions this requirement
      originally had to resolve are now DECIDED, by ORCH, on the project owner's
      explicit delegation of all open technical decisions. This requirement no longer
      writes those decision records; it IMPLEMENTS them. Reversing or re-litigating any
      of the three is forbidden here — a decisions/ record is never overridden by a
      requirement, per core-directives.md's Instruction Precedence:

      (a) TELEGRAM FRAMEWORK — grammY. See
          docs/agents/decisions/0004-telegram-framework-grammy.md. Note that record's
          binding consequence for all later bot work: domain logic (admission state
          machine, capacity, promotion, idempotency) lives in framework-free modules
          that handlers call, NEVER inside grammY handler bodies. REVIEWER treats a
          domain rule embedded in a handler as a finding.

      (b) ORM / MIGRATION TOOL — Drizzle ORM with Drizzle Kit. See
          docs/agents/decisions/0005-orm-drizzle.md. Migrations are committed as
          generated .sql files and reviewed as SQL; a migration dropping or rewriting a
          column holding personal data or attendance history needs SECURITY-REVIEWER
          sign-off under security-invariants.md S13.

      (c) TEST FRAMEWORK — Vitest, at the repo root, covering both workspaces. See
          docs/agents/decisions/0006-test-framework-vitest.md. That record also adds a
          `npm test` step to .github/workflows/ci-cd.yml, which THIS requirement makes,
          since it is the requirement that first makes `npm test` meaningful.

      Scope of work:
      - Create apps/bot/package.json as a workspace member (picked up by the root
        `"workspaces": ["apps/*"]` REQ-007 adds), apps/bot/tsconfig.json,
        apps/bot/eslint config, and apps/bot/src/index.ts that starts a bot process,
        reads its token and database URL from environment variables, and exits
        non-zero with a clear message if either is absent.
      - Add root-level scripts so `npm run lint` and `npm run build` at the repo root
        cover BOTH workspaces, keeping .github/workflows/ci-cd.yml's existing
        invocations correct without editing the workflow.
      - Add the decided dependencies to apps/bot/package.json, each pinned to an exact
        version: `grammy`, `drizzle-orm`, `drizzle-kit`, a Postgres driver, and `vitest`
        (vitest at the root, since it covers both workspaces). Do NOT add grammY plugins
        (conversations, sessions, rate limiting, runner) at this stage — they are added
        by the requirement that first needs each, keeping this requirement's
        no-domain-logic boundary intact.
      - Wire Vitest so `npm test` at the repo root runs and passes with at least one
        real assertion, giving TEST-DESIGNER and TEST-RUNNER a runnable target from
        REQ-010 onward. Note for every later bot requirement, from
        decisions/0006's "fake timers do not reach Postgres" boundary: a time-dependent
        predicate takes the evaluation time as an explicit parameter from the
        application, never SQL now() inside the query, or the property cannot be tested
        at all. REVIEWER, BACKEND-DEV and DATA-DESIGNER all carry this rule in their
        role files.
      - NO domain logic, NO database schema, NO handlers beyond a health/liveness path.
        Those are REQ-010 onward.
      - Secrets: the bot token and database URL are read from the environment only.
        Neither may be committed, defaulted to a literal, or echoed in any log line
        (security-invariants.md S11 — PII and credentials never in plaintext logs).
    acceptance_criteria:
      - "apps/bot/package.json exists as a workspace member and `npm install` at the repo root resolves both apps/web and apps/bot without error; `npm run lint` and `npm run build` from the repo root both exit 0 and cover apps/bot (verified by deliberately introducing a type error in apps/bot/src and confirming `npm run build` then FAILS, then reverting — a build that passes without ever compiling apps/bot is not evidence)."
      - "apps/bot/package.json depends on `grammy`, `drizzle-orm`, `drizzle-kit` and a Postgres driver, and the repo root depends on `vitest` — every one pinned to an exact version (no `^` or `~`), matching decisions/0004, 0005 and 0006. A dependency on `telegraf`, `prisma`/`@prisma/client` or `jest` is a FAIL, as is any grammY plugin added at this stage; separately, no test file may import `node:test` (it is a Node built-in, so it would never appear as a dependency — grep the test files instead)."
      - ".github/workflows/ci-cd.yml runs `npm test` in the build job, and a deliberately failing test makes the workflow fail (verified by pushing a failing assertion on a scratch branch and reading the actual red run, then reverting — a test step that cannot fail the build is not a gate, per core-directives.md)."
      - "`npm test` at the repo root runs Vitest and reports at least one passing assertion against REAL behaviour — the skeleton's environment-variable validation is the intended target. An assertion such as `expect(true).toBe(true)` is a FAIL of this criterion."
      - "Starting apps/bot with the bot-token environment variable unset exits non-zero and prints a message naming the missing variable; starting it with the variable set to a dummy value does NOT print that value anywhere in stdout/stderr (security-invariants.md S11), verified by running both cases and grepping the captured output for the dummy value."
      - "`git grep -n` over apps/bot finds no committed bot token, database password, or connection string literal — every such value comes from `process.env`."
    depends_on: [REQ-007]

  - id: REQ-010
    title: Bot data model and initial migration for Chapter, User and Profile
    owner: DATA-DESIGNER
    status: done
    description: >
      First slice of PRD 14 build-order step 1 ("Skeleton: bot, DB, migrations, config,
      /start, i18n scaffold, chapter assignment"). Step 1 is far larger than one agent
      turn, so it is split across REQ-010..REQ-014; this one is the identity/consent
      core of the schema, deliberately drafted before any handler exists so that the
      computed-not-stored boundary is settled once rather than per-feature.

      Derives from PRD 5 (data model), PRD 10 (privacy) and security-invariants.md
      S1/S11/S13.

      Scope of work — design and migration for exactly three entities, per PRD 5:
      - Chapter: code (uz|kz) - name - timezone - default_lang.
      - User: tg_id (UNIQUE, NULLABLE) - tg_username - lang (ru|en) -
        role (member|organizer|owner) - chapter_id - broadcast_opt_in -
        consent_pd_at - blocked.
      - Profile: user_id (1:1) - first_name - last_name - phone (nullable) -
        email (nullable) - company - position - is_student -
        experience_level (user|builder|advanced|expert) - links{github,linkedin,site}
        (all nullable) - public_bio (nullable) - photo_file_id (nullable) -
        publish_consent (default FALSE).
      Every entity carries a UUID primary key and created/updated timestamps
      (PRD 5 preamble, PRD 1 "UUID keys, no Telegram-only assumptions").

      HARD CONSTRAINTS this design must honour, stated so they cannot evaporate:
      - `tg_id` is NULLABLE and is NEVER a business key (PRD 5 closing rule). It exists
        so an organizer can pre-create a person who has never opened the bot; it links
        on first /start. Every foreign key and every lookup in later requirements
        resolves to User.id, not tg_id.
      - THREE SEPARATE CONSENTS, one home each, never conflated into one boolean
        (security-invariants.md S1): store-my-data = User.consent_pd_at (a timestamp,
        required before any Profile row is written); message-me =
        User.broadcast_opt_in (default false); publish-me = Profile.publish_consent
        (default false).
      - PRD 5's optionality rule: phone, email, all links, public_bio and photo_file_id
        are NULLABLE at the database level. A NOT NULL constraint on any of them is a
        defect, not a hardening.
      This requirement produces the design artefact under docs/agents/design/ AND the
      migration file under apps/bot/. It creates no handlers.
    acceptance_criteria:
      - "The migration creates chapters, users and profiles with UUID primary keys and created/updated timestamp columns on all three; verified by applying the migration to a scratch Postgres database and inspecting the resulting schema (the `\\d+` output pasted into the verification report)."
      - "users.tg_id is nullable AND unique, verified by executing two inserts of users with NULL tg_id (both must succeed, proving nullability does not collide on the unique index) and one duplicate non-null tg_id insert (must fail) against the scratch database — a schema read alone is not sufficient evidence for the null-collision case."
      - "profiles.phone, profiles.email, profiles.public_bio, profiles.photo_file_id and every links column are nullable, verified by inserting a profile row supplying only the PRD 5 required fields (first_name, last_name, company, position, is_student, experience_level) and confirming it succeeds (PRD 5 'if nothing uses it, it is optional')."
      - "Three distinct consent columns exist in their PRD-specified homes — users.consent_pd_at (timestamp), users.broadcast_opt_in (boolean), profiles.publish_consent (boolean) — with broadcast_opt_in and publish_consent both DEFAULT FALSE, verified by inserting a row that supplies neither and reading back false for both (security-invariants.md S1, S14)."
      - "No column exists anywhere in this migration for a PRD 5 computed-never-stored value — specifically no no_show, waitlist_position, seats_taken, registration_open or finished column — verified by grepping the migration file for each of those five names and finding zero matches."
      - "The design artefact under docs/agents/design/ states explicitly that tg_id is never a business key and that every later lookup resolves to User.id (PRD 5)."
    depends_on: [REQ-009]

  - id: REQ-011
    title: Bot data model and migration for Venue, Event, Registration, EventStaff and AuditLog
    owner: DATA-DESIGNER
    status: done
    description: >
      Second schema slice of PRD 14 build-order step 1, separated from REQ-010 because
      designing eight entities plus their constraints in one turn does not fit. REQ-010
      covers identity and consent; this covers the event/attendance core that
      REQ-015..REQ-032 write against.

      Derives from PRD 5, PRD 6 (state machines), PRD 12 (invariants) and
      security-invariants.md S4/S6/S7/S8.

      Entities, per PRD 5:
      - Venue: chapter_id - name - address - lat - lon - yandex_url - google_url -
        capacity - notes (nullable).
      - Event: chapter_id - title - description - format(meetup|fail_stories|workshop|
        hackathon) - venue_id - starts_at - ends_at - registration_closes_at -
        capacity - requires_invite - requires_approval -
        status(draft|published|cancelled) - cover_file_id - agenda[] (NON-TALK items
        only — doors, networking, close; the talk lineup is never duplicated here,
        PRD 5). Each agenda item carries at minimum a TIME and a LABEL, and the shape
        must make a DOORS item identifiable programmatically — REQ-026 reads the doors
        time out of agenda[] for the T-3h reminder, and PRD 5 forbids a separate
        doors_at column, so agenda[] is the only place that information can live. A
        free-text-only agenda that cannot be queried for "the doors item" fails this,
        because it would leave REQ-026 unimplementable without the field PRD 5 forbids.
        Whether that identification is a typed kind/enum, a reserved label, or something
        else is DATA-DESIGNER's call at design time; that it is possible at all is not
        optional.
      - Registration: event_id - user_id - admission(requested|waitlisted|admitted|
        rejected|withdrawn) - checked_in_at - checked_in_by - check_in_method(qr|manual)
        - reconfirmed_at - invited_by_user_id - source - invite_code_id -
        qr_token(UNIQUE, nullable) - no_show_reason - UNIQUE(event_id, user_id).
      - EventStaff: event_id - user_id — check-in rights for that ONE event
        (PRD 3, security-invariants.md S2).
      - AuditLog: actor_user_id - action - entity - entity_id - payload - at.
      All with UUID primary keys and created/updated timestamps. Registration.created_at
      in particular is load-bearing: waitlist position is computed by ranking
      created_at among waitlisted rows (PRD 5), so it must be non-null and indexed for
      that query.

      HARD CONSTRAINTS:
      - PRD 12.1: exactly one Registration per (event_id, user_id) — a real database
        UNIQUE constraint, not application-level checking.
      - PRD 5 computed-never-stored: NO column for no_show, waitlist position, seats
        taken, registration_open or finished. `no_show` is derived as
        (admission='admitted' AND checked_in_at IS NULL AND now > ends_at);
        seats_taken is count(admission='admitted'). Note that no_show_reason IS a
        stored column (PRD 5 lists it on Registration and FR-16 ranks it) — the
        derived boolean no_show is not, and the two must not be conflated.
      - Attendance is NOT an admission state (PRD 6). checked_in_at is a timestamp
        alongside admission, never a sixth enum value.
      - AuditLog.payload must not become a home for plaintext phone or email
        (security-invariants.md S11) — the design states this constraint explicitly for
        the requirements that later write audit rows.
    acceptance_criteria:
      - "The migration creates venues, events, registrations, event_staff and audit_log with UUID primary keys and created/updated timestamps, verified by applying it to a scratch Postgres database and pasting the resulting schema into the verification report."
      - "A UNIQUE constraint on registrations(event_id, user_id) exists and is enforced, verified by inserting the same (event_id, user_id) pair twice against the scratch database and confirming the second insert fails with a unique-violation error (PRD 12.1) — reading the schema is not sufficient; the duplicate insert must actually be attempted."
      - "registrations.qr_token is UNIQUE and nullable, verified by inserting two registrations with NULL qr_token (both succeed) and two with the same non-null token (second fails)."
      - "The registrations.admission enum/check accepts exactly the five PRD 6 values (requested, waitlisted, admitted, rejected, withdrawn) and rejects a sixth — verified by attempting an insert with admission='checked_in' and confirming it fails, proving attendance was not modelled as an admission state (PRD 6)."
      - "No column named no_show, waitlist_position, seats_taken, registration_open or finished exists in any table created by this migration, verified by grepping the migration for each name (PRD 5 computed-never-stored); the stored column no_show_reason is present and is explicitly distinguished from the derived no_show in the design artefact."
      - "An agenda[] item's shape supports identifying a doors item programmatically: storing an event whose agenda holds a doors item PLUS at least one non-doors item (networking, close), a single database query returns the doors item's time and only that item — WITHOUT the application loading the whole agenda and scanning it in TypeScript, which is the free-text outcome this constraint exists to prevent. Verified by exhibiting the actual query and its result. NO doors_at or equivalently-named column may exist on the events table (grep the migration to confirm), per PRD 5 de-duplication."
      - "The design artefact under docs/agents/design/ specifies the exact derivation expressions for no_show, waitlist position and seats_taken, and states that EventStaff grants rights for one event only (security-invariants.md S2) and that AuditLog.payload never carries plaintext phone or email (S11)."
    depends_on: [REQ-010]

  - id: REQ-012
    title: Bot config loading, Postgres connection and migration runner wired into apps/bot startup
    owner: BACKEND-DEV
    status: done
    description: >
      Third slice of PRD 14 build-order step 1. REQ-010 and REQ-011 design the schema
      and produce migration files; this requirement makes them actually runnable and
      connects the bot process to Postgres.

      Scope of work:
      - apps/bot/src config module: reads bot token, database URL, log level and the
        default chapter code from the environment; validates them at startup and exits
        non-zero naming any missing variable. No literal defaults for the token or the
        database URL.
      - Postgres connection pooling sized for PRD 1's stated load (~1000 users, ~10
        events/year, peak 0.06 rps, DB < 50MB, "one Postgres and one bot process are
        sufficient. Do not add infrastructure"). A pool sized for this load is single
        digits, not dozens; oversizing contradicts PRD 11's one-small-server
        constraint.
      - A migration runner command (`npm run migrate -w apps/bot` or the equivalent for
        whichever tool REQ-009's decision record selected) that applies REQ-010's and
        REQ-011's migrations, is idempotent when re-run against an already-migrated
        database, and reports which migrations it applied.
      - A local development docker-compose (under apps/bot/, NOT under deploy/, which
        holds the site's production compose files) bringing up a Postgres instance the
        test suite and the migration runner can target.
      - Structured logging that never logs the connection string, the bot token, or any
        phone/email value (security-invariants.md S11).
    acceptance_criteria:
      - "`npm run migrate -w apps/bot` (or REQ-009's chosen equivalent, named in the verification report) applied against an empty Postgres creates every table from REQ-010 and REQ-011, and running the SAME command a second time against the now-migrated database exits 0 and applies nothing further — verified by capturing both runs' output."
      - "Starting apps/bot with the database URL environment variable unset exits non-zero and names that variable; the captured stdout/stderr from a start WITH a dummy URL containing the string `SECRETPW` does not contain `SECRETPW` anywhere (security-invariants.md S11), verified by grepping the captured output."
      - "The connection pool's configured maximum is a single-digit value and the verification report cites PRD 1's load figures as the justification; a pool max of 20 or more fails this criterion absent a written load argument."
      - "The local Postgres compose file lives under apps/bot/ and deploy/docker-compose.qa.yml and deploy/docker-compose.prod.yml are unchanged (verified by `git diff --stat`), keeping the site's production deploy surface untouched by bot work."
    depends_on: [REQ-009, REQ-011]

  - id: REQ-013
    title: Bot i18n scaffold with RU and EN catalogs and the /lang command
    owner: BACKEND-DEV
    status: done
    description: >
      Fourth slice of PRD 14 build-order step 1 ("i18n scaffold"). PRD 11 requires
      "two languages at launch (RU/EN), more addable without redesign" and PRD 13
      acceptance criterion 13 requires "RU and EN render fully — no untranslated
      strings". PRD 4's "Later" list explicitly defers UZ/KZ INTERFACE locales for the
      bot — so this requirement adds exactly two, and adding a third is out of scope
      here and does not contradict the site's four locales, which are a different
      surface.

      Scope of work:
      - A message catalog mechanism under apps/bot/ holding ru and en catalogs with
        matching key sets, resolved per User.lang (PRD 5: lang(ru|en)), falling back
        to the user's Chapter.default_lang when User.lang is unset, and to ru when
        neither resolves.
      - The `/lang` command from PRD 8, offering ru | en, persisting the choice to
        User.lang, and confirming in the newly selected language.
      - A key-set parity check runnable in CI (the same shape of check REQ-005's
        acceptance criteria used for the site's four catalogs) so a missing translation
        is caught by a command, not by a reader.
      - Every user-facing string added by REQ-014 onward goes through this mechanism.
        This requirement establishes the mechanism and seeds it only with the strings
        the /start and /lang flows themselves need; later requirements add their own
        keys.

      RELATIONSHIP TO decisions/0002 AND THE SITE'S CATALOGS, stated explicitly rather
      than assumed: decisions/0003 cites the POSSIBILITY of sharing the site's
      messages/*.json catalogs with the bot as part of its monorepo rationale. This
      requirement does NOT implement that sharing — the site's catalogs are landing-page
      marketing copy (177 keys of Hero/Creed/Partners prose) with no overlap with bot
      conversational strings, and decisions/0003's layout section creates packages/
      "only when a second consumer exists". Extracting a shared package with zero shared
      keys would be structure without content. If genuine overlap appears later, that is
      its own requirement. decisions/0002 gives CONTENT-BA ownership of message catalog
      COPY; this requirement builds the mechanism only and seeds it with functional
      strings, so any later bot copy pass is CONTENT-BA's, exactly as for the site.
    acceptance_criteria:
      - "apps/bot holds ru and en catalogs whose key sets are identical, verified by a runnable script (committed, and invoked in the verification report) that exits non-zero on any key present in one catalog and absent from the other."
      - "A user whose User.lang is 'en' receives /start and /lang responses in English and a user whose lang is 'ru' receives them in Russian, verified against a live bot instance with two test users; the captured message text for both is pasted into the verification report."
      - "`/lang` offers exactly two options (ru, en) per PRD 11 and PRD 4's deferral of UZ/KZ bot locales; selecting the other language persists to users.lang (verified by reading the row back from Postgres) and the confirmation message itself arrives in the newly selected language."
      - "A user with User.lang NULL whose chapter has default_lang 'en' receives English, verified by constructing exactly that row state and sending /start — a test run where User.lang was already set does not exercise this fallback and is not evidence."
      - "apps/web/messages/*.json are unchanged by this requirement (verified by `git diff --stat`), and no shared i18n package is created — per this requirement's stated decision and decisions/0003's 'only when a second consumer exists' rule for packages/."
    depends_on: [REQ-012]

  - id: REQ-014
    title: /start entry point, first-contact User creation with consent gate, and chapter assignment
    owner: BACKEND-DEV
    status: done
    description: >
      Final slice of PRD 14 build-order step 1, and the first requirement that handles
      a real person. Implements PRD FR-1's /start entry and story A4 (Land in the right
      city). Deep-link PAYLOAD handling for `e_<event_id>` is deferred to REQ-016, which
      is where an event card exists to open; this requirement establishes the /start
      handler, the User row, and chapter assignment.

      Derives from PRD FR-1, PRD 8, USER-STORIES A4, STORY-DETAILS A4, and
      security-invariants.md S1.

      Scope of work:
      - /start creates or resolves the User row by tg_id, ALWAYS working in terms of
        User.id thereafter (PRD 5: never key business logic on tg_id). A user
        pre-created by an organizer with NULL tg_id links on first /start by whatever
        matching rule the invitation flow establishes — that matching is a Release 2
        requirement and out of scope here; this requirement must simply not make the
        later linking impossible by, for example, making tg_id NOT NULL or treating it
        as the primary key.
      - Chapter assignment per STORY-DETAILS A4: exactly one active chapter → assigned
        silently, never asked. More than one active chapter and no context → asked once,
        briefly. Arrived via an event link → taken from that event silently (the event
        link path itself lands in REQ-016; this requirement implements the
        "one active chapter" and "asked once" branches and exposes the assignment
        function REQ-016 calls).
      - Chapter is changeable later via /profile (REQ-019's scope) — this requirement
        only must not hard-code it as immutable.
      - CONSENT (security-invariants.md S1, PRD 10): the personal-data consent prompt
        and its wording version. A User row created at /start holds only what Telegram
        supplies (tg_id, tg_username, lang) — no Profile row and no phone/email may be
        written before consent_pd_at is set. The consent WORDING itself is copy that
        USER-STORIES B1 says "needs Viktor's wording and a version number"; since there
        is no human in this pipeline, the implementing agent uses a plain factual
        placeholder wording carrying an explicit version identifier, and records in the
        handoff result that the wording is provisional pending the product owner — it
        does not invent legal-sounding terms.
      - /help per PRD 8: contacts and the community link.
    acceptance_criteria:
      - "Sending /start from a Telegram account the bot has never seen creates exactly one users row with that tg_id and NO profiles row, verified by querying both tables before and after against a live bot instance (security-invariants.md S1 — consent precedes storage)."
      - "With exactly one chapter row marked active, /start assigns that chapter to the new user WITHOUT prompting; with two active chapters and no arrival context, /start asks once and persists the answer to users.chapter_id — both branches verified by constructing each chapter-table state and running /start, with the captured conversation pasted into the report (a run with only one chapter present does not exercise the second branch and is not evidence for it)."
      - "The personal-data consent prompt is shown, and until it is accepted no profiles row and no phone/email value exists for that user; accepting sets users.consent_pd_at to a non-null timestamp and records the consent wording version, verified by reading the row back (PRD 10, S1)."
      - "The consent wording stored is a plain factual placeholder carrying an explicit version identifier, and the handoff result states it is provisional pending the product owner — verified by reading the committed wording and the handoff's result.issues entry."
      - "`git grep` over apps/bot finds no query or branch that uses tg_id as a foreign key or as a join key between domain tables — every relationship resolves to users.id (PRD 5)."
      - "/help responds with the community contact information in both ru and en per REQ-013's catalog mechanism, with no hardcoded string literals in the handler (verified by grepping the handler for literal user-facing text)."
    depends_on: [REQ-013]

  - id: REQ-015
    title: Venue CRUD for organizers, chapter-scoped
    owner: BACKEND-DEV
    status: done
    description: >
      First slice of PRD 14 build-order step 2 ("Venues + Events CRUD + public event
      card"). Implements USER-STORIES F2 / STORY-DETAILS F2 (Reuse the places we run at)
      and the venue half of PRD FR-12.

      Scope of work:
      - Organizer-only creation, listing and editing of Venues within THEIR OWN chapter
        (PRD 3: organizer = "everything in their chapter"). Fields per PRD 5: name,
        address, lat, lon, yandex_url, google_url, capacity, notes (optional).
      - Both map URLs are required at creation — PRD FR-2 and story A3 both state
        "both map links (Yandex and Google)" as a hard requirement of the event card,
        and a venue missing one produces a broken card downstream.
      - A venue without coordinates is permitted (STORY-DETAILS A3: "Venue without
        coordinates -> address text only, and the organizer is nudged to complete it"),
        so lat/lon are not creation blockers, but the nudge must exist.
      - Refusal per STORY-DETAILS F2: deleting a venue attached to an upcoming event is
        refused with the reason.
      - Editing a venue affects future events; past events keep what they had
        (STORY-DETAILS F2). The design artefact must state which mechanism achieves
        this rather than leaving it implicit.
      - AUTHORIZATION (security-invariants.md S2): the role check lives on the HANDLER
        that performs the action, not only on the menu that renders the button. Every
        venue mutation writes an AuditLog row (S8, PRD 12.7).
    acceptance_criteria:
      - "A user with role 'member' invoking the venue-create handler DIRECTLY (by sending the callback data / command the organizer menu would produce, not by tapping a rendered button) is refused, and the venue is not created — verified by constructing exactly that call against a live instance and querying the venues table (security-invariants.md S2: the negative path must be proven on the handler, not the menu)."
      - "An organizer of chapter A attempting to create or edit a venue in chapter B is refused, verified by constructing two chapters and one organizer and attempting the cross-chapter action (security-invariants.md S2)."
      - "Creating a venue without yandex_url or without google_url is refused with a message naming the missing field; creating one without lat/lon succeeds and produces the completion nudge (PRD FR-2, STORY-DETAILS A3) — all three cases run and captured."
      - "Attempting to delete a venue referenced by an event whose starts_at is in the future is refused with the reason stated (STORY-DETAILS F2), verified by constructing that exact state."
      - "Each successful venue create/edit/delete writes exactly one audit_log row naming the actor, action, entity and entity id — verified by counting rows before and after each of the three operations (PRD 12.7, security-invariants.md S8); zero rows or two rows both fail."
    depends_on: [REQ-014]

  - id: REQ-016
    title: Event CRUD with draft/published/cancelled transitions, publish validation and e_ deep links
    owner: BACKEND-DEV
    status: done
    description: >
      Second slice of PRD 14 build-order step 2. Implements USER-STORIES F1 /
      STORY-DETAILS F1 (Put an event out into the world) and the event half of
      PRD FR-12. F1 is the head of PRD 11a's five-story critical path.

      Scope of work:
      - Organizer creates an Event as `draft` — invisible to members (STORY-DETAILS A1:
        "Draft and cancelled events never appear to a member"; STORY-DETAILS A2: "A
        draft event's link resolves to nothing — drafts are not addressable").
      - Editing every PRD 5 Event field: title, description, format, venue_id,
        starts_at, ends_at, registration_closes_at, capacity, requires_invite,
        requires_approval, cover_file_id, agenda[] (NON-TALK items only — doors,
        networking, close; PRD 5 states the talk lineup is the accepted Talks and is
        never duplicated into agenda).
      - Publish transition draft -> published, refused with the MISSING FIELDS NAMED
        EXACTLY (STORY-DETAILS F1) and refused for an offline event with no venue.
      - CAPACITY FLOOR (STORY-DETAILS F1, an explicit refusal): capacity can never be
        set below the number already admitted. Reducing capacity governs future seats;
        it never removes someone holding one.
      - Cancel transition published -> cancelled. NOTIFYING registrants on cancellation
        (PRD 6: "Cancelling notifies every non-withdrawn registrant") requires the
        send-once notification ledger, which is REQ-025 — so this requirement
        implements the STATE TRANSITION and its audit row, and the notification is
        REQ-027's scope. This split is stated here so the gap is deliberate and visible
        rather than silently dropped.
      - Deep link `?start=e_<event_id>` resolution (PRD FR-1, story A2) — with the
        channel suffix (`e_<id>__linkedin`) held against the user until they register,
        at which point REQ-020 writes it to Registration.source. A draft, cancelled or
        finished event's link yields a plain explanation plus the upcoming list
        (STORY-DETAILS A2), never a silent dead end.
      - Chapter-scoped authorization on the handler (security-invariants.md S2); every
        status change writes exactly one AuditLog row (S8, PRD 12.7).
    acceptance_criteria:
      - "Publishing an event missing a required field is refused with a message NAMING each missing field (STORY-DETAILS F1); verified by attempting publication with title, starts_at and capacity each individually absent and confirming each refusal names the specific field, not a generic error."
      - "Publishing an offline event whose venue_id is null is refused (STORY-DETAILS F1, A3), verified by constructing that state."
      - "With N registrations at admission='admitted', setting capacity to N-1 is refused and no admitted registration is altered — verified by constructing exactly that state (at least 2 admitted rows), attempting the reduction, and re-querying the registrations table to confirm all N rows still read 'admitted' (STORY-DETAILS F1's explicit refusal)."
      - "A draft event is invisible to a member: it does not appear in the member-facing event list, and opening `?start=e_<its id>` yields the plain explanation plus the upcoming list rather than the card — both verified against a live instance from a member account (STORY-DETAILS A1, A2)."
      - "Opening `?start=e_<published id>__linkedin` records the channel against the user such that a subsequent registration would carry it as Registration.source; verified by reading whatever store holds the pending source after the deep link and before registration (PRD FR-1)."
      - "A doors item whose time is later than starts_at is refused at edit time with a message naming the offending item, and any agenda item later than ends_at is likewise refused — verified by attempting each and confirming the event is left unchanged. Both bounds are derived from PRD 5's own fields (doors is when the room opens, so it precedes the start; ends_at bounds the event). NO lower bound on how early an agenda item may be is imposed: the spec states none, an all-day workshop may legitimately have an early setup item, and inventing a cutoff would be exactly the unsourced business rule PRD's closing rule forbids. This validation exists because decisions/0007 has REQ-026 send the doors time to every admitted registrant, so a malformed doors item is no longer merely an odd-looking card."
      - "At most one doors item may exist in an event's agenda[]: adding a second is refused, verified by attempting it, since REQ-026 must resolve exactly one doors time and has no rule for choosing among several."
      - "Each of draft-create, publish and cancel writes exactly one audit_log row (counted before and after each), and a member invoking the publish handler directly is refused (security-invariants.md S2, S8)."
    depends_on: [REQ-015]

  - id: REQ-017
    title: Public event card and the /events upcoming list with computed seat counts
    owner: BACKEND-DEV
    status: done
    description: >
      Third slice of PRD 14 build-order step 2, completing "public event card".
      Implements PRD FR-2 (Event card), USER-STORIES A1 (See what's coming up) and A3
      (Know where it is and how to get there).

      Scope of work:
      - `/events` lists published, unfinished events for the user's chapter, soonest
        first, each row showing title, date and time IN THE CHAPTER'S TIMEZONE
        (PRD 5 Chapter.timezone; STORY-DETAILS A1), venue name, and seats left or
        "waitlist open".
      - The event card per PRD FR-2: title, cover, date/time in chapter timezone, venue
        name + address, BOTH map links (Yandex and Google), agenda, seats left or
        "waitlist open", and the CTA. The LINEUP element of FR-2 is Release 3's Talks
        scope and renders as absent in Release 1 — stated here so its omission is
        deliberate, not forgotten.
      - Empty state per STORY-DETAILS A1: no upcoming events -> an invitation to follow
        the city, NOT an apology. The Wishlist entity that backs "follow this city" is
        PRD 5's Wishlist and story G4, which is Release 3 — so in Release 1 this is a
        plain informational message; the implementing agent must not create a Wishlist
        row or table ahead of its requirement.
      - Venue without coordinates renders address text only (STORY-DETAILS A3).

      COMPUTED-NEVER-STORED (PRD 5, and the single most easily violated rule in this
      requirement): seats left is derived at read time as
      capacity - count(admission='admitted'); `registration_open` is derived from
      now < registration_closes_at; `finished` is derived from now > ends_at. NONE of
      the three may be stored, cached into a column, or denormalized onto Event. A
      counter column added "for performance" at this project's stated load (PRD 1:
      peak 0.06 rps, DB < 50MB) is unjustifiable and contradicts PRD 5 directly.
    acceptance_criteria:
      - "The event card renders BOTH the Yandex and the Google map link for a venue that has them, and both resolve to the venue's coordinates (PRD FR-2, story A3) — verified by opening both links from the rendered card and confirming each lands at the venue's lat/lon."
      - "Displayed dates and times match the event's chapter timezone, not the server's or the viewer's — verified by running the check with the process TZ deliberately set to a DIFFERENT zone than the chapter's and confirming the rendered time is unchanged (a run where the two happen to match does not exercise this property and is not evidence)."
      - "Seats left equals capacity minus the live count of admission='admitted' rows: verified by rendering the card, admitting one more registration directly in the database, re-rendering, and confirming the number decreased by exactly one WITHOUT any write to the events table (checked by comparing the events row's updated timestamp before and after) — PRD 5 computed-never-stored."
      - "`git grep` over apps/bot finds no column, cached field or persisted store named for seats_taken, seats_left, registration_open or finished; each is computed at the point of use (PRD 5)."
      - "The event card renders every agenda[] item with its time and label in the chapter timezone (PRD FR-2 lists agenda among the card's elements), verified by rendering a card for an event whose agenda holds a doors item and at least one non-doors item and confirming every item appears with the correct local time."
      - "Draft and cancelled events do not appear in /events for a member (STORY-DETAILS A1), and with zero upcoming events the response is the follow-this-city invitation rather than an apology — both verified by constructing each state; no wishlist row or table is created (that is Release 3's scope)."
    depends_on: [REQ-016]

  - id: REQ-018
    title: EventStaff assignment by organizers and the staff-only check-in surface gate
    owner: BACKEND-DEV
    status: done
    description: >
      Implements USER-STORIES F7 (Put volunteers on the door) and F8 (Know I'm on the
      door), plus PRD 3's EventStaff definition. Placed here — after events exist,
      before check-in is built — because REQ-028 and REQ-029 both gate on EventStaff
      and would otherwise each have to invent it.

      Scope of work:
      - An organizer adds a person as EventStaff for ONE event (PRD 3: "check-in rights
        for that one event, nothing else"). Several volunteers per event is normal
        (STORY-DETAILS F7). Removal is supported and the person is told
        (STORY-DETAILS F8: "Removed -> told, and the screen is gone").
      - F8's assignment notification: which event, what their role is, what happens at
        the door, written so someone who has never done it can run the door unbriefed.
        The idempotent send ledger is REQ-025; until it lands, this notification is a
        direct send at the moment of assignment (a single synchronous action, not a
        scheduled job), which is why it does not need the ledger. The design artefact
        states this reasoning so a later reader does not mistake it for an oversight.
      - THE AUTHORIZATION SURFACE (security-invariants.md S2 — the invariant this
        requirement exists to establish): an EventStaff member sees ONLY check-in
        screens for that one event. Not another event's check-in, not the organizer
        panel, not registration lists, not exports. Rights expire with the event
        (STORY-DETAILS F7: "Staff rights that outlive the event" is an explicit
        refusal). "Speaker is not a role" (PRD 3) — no permission check anywhere may
        read a speaker flag.
      - Every assignment and removal writes an AuditLog row (S8).
    acceptance_criteria:
      - "A user who is EventStaff for event 1 and invokes event 2's check-in handler directly (by constructing the callback/command payload, not by tapping a button) is refused and no check-in is recorded — verified by constructing two events, staffing the user on one, and issuing the call for the other (security-invariants.md S2, STORY-DETAILS F7's 'leak to another one' refusal)."
      - "The same EventStaff user invoking an organizer-only handler (venue create, event publish, registration list) is refused on each, verified by issuing all three calls directly (S2: 'staff see only check-in screens')."
      - "After the event's ends_at has passed, that event's check-in handler refuses the EventStaff user, verified by constructing an event whose ends_at is in the past and issuing the call (STORY-DETAILS F7: rights expire with the event)."
      - "Assigning a volunteer sends them a message naming the event, their role and what happens at the door, in their own language per REQ-013's catalogs; removal sends a message too — both captured from a live instance (STORY-DETAILS F8)."
      - "Each assignment and each removal writes exactly one audit_log row, counted before and after (PRD 12.7, S8)."
      - "`git grep` over apps/bot's permission checks finds no read of any speaker flag or derived speaker status (PRD 3: 'Speaker is not a role')."
    depends_on: [REQ-016]

  - id: REQ-019
    title: Profile capture as a resumable step-by-step form with the consent gate and optional-field rule
    owner: BACKEND-DEV
    status: done
    description: >
      First slice of PRD 14 build-order step 3 ("Profile + registration + capacity +
      waitlist + promotion + withdraw"). That build-order step is five distinct
      deliverables and is split across REQ-019..REQ-024. This one implements
      USER-STORIES B1 / STORY-DETAILS B1 (Introduce myself once) and PRD FR-3, plus the
      /profile view-and-edit surface from PRD 8. B1 is on PRD 11a's critical path.

      Scope of work:
      - Step-by-step collection, REQUIRED FIRST (PRD FR-3): first name, last name,
        company, position, student flag, experience level. Then the OPTIONAL ones, each
        skippable in ONE TAP: phone (Telegram's request_contact button or typed), email
        (format-validated only if given), GitHub, LinkedIn, site.
      - PARTIAL WRITES (PRD FR-3, STORY-DETAILS B1): each answer is written to the
        Profile row AS IT ARRIVES. A bot restart mid-form resumes at the next
        unanswered field with nothing lost — this is PRD 11's restart-safety
        constraint applied to form state, and it means form progress lives in the
        database, not in process memory.
      - THE OPTIONALITY RULE (PRD 5, spec README rule 2): a person can finish
        registering having skipped EVERY optional field. Blocking on an optional field
        is an explicit refusal in STORY-DETAILS B1.
      - CONSENT (security-invariants.md S1, PRD 10, STORY-DETAILS B1's refusal "No
        consent -> no storage and no registration"): consent is requested once, before
        anything is kept, and recorded with its wording version — REQ-014 establishes
        consent_pd_at and the wording version; this requirement enforces that NO Profile
        field is written until it is set.
      - Already has a profile -> the form is skipped entirely (STORY-DETAILS B1).
      - /profile view and edit, including changing chapter (the changeability REQ-014
        deferred here).
      - PII (security-invariants.md S11): phone and email are never written to logs,
        never echoed into an error message, and never included in an audit payload.
    acceptance_criteria:
      - "Answering the first three required fields, KILLING the bot process, restarting it, and resuming the conversation continues at the fourth field with the first three already stored — verified by actually stopping and restarting the process mid-form (a run without a restart does not exercise the property and is not evidence) and by querying the profiles row between the two halves (PRD FR-3, PRD 11 restart-safe)."
      - "Skipping every optional field (phone, email, github, linkedin, site) still completes the profile and permits registration to proceed — verified by walking the whole form choosing skip at each optional step (PRD 5, STORY-DETAILS B1's refusal 'Blocking on an optional field')."
      - "Declining the personal-data consent leaves zero profiles rows for that user and blocks registration with a plain statement rather than an error — verified by querying the profiles table after the decline (security-invariants.md S1)."
      - "A user who already has a complete profile registering for a second event is not asked any profile question — verified by constructing that state and running the registration flow (STORY-DETAILS B1)."
      - "Entering a phone number and an email, then triggering an error path (e.g. an invalid subsequent input) produces log output and any audit_log payload containing NEITHER value — verified by grepping the captured logs and the audit rows for the exact phone and email strings used (security-invariants.md S11); a run that never entered a phone or email does not exercise this and is not evidence."
      - "An email is accepted when absent and format-validated only when supplied — both branches run (PRD FR-3)."
    depends_on: [REQ-014, REQ-018]

  - id: REQ-020
    title: Registration for an open event with atomic capacity enforcement and qr_token issuance
    owner: BACKEND-DEV
    status: done
    description: >
      Second slice of PRD 14 build-order step 3, and PRD 11a critical-path story B2
      (Take a seat at an open event). Implements PRD FR-4's open-event row
      (requires_invite=false, requires_approval=false -> admitted if seats remain, else
      waitlisted) and the qr_token half of PRD FR-14.

      Release-1 scope note: PRD FR-4's other three rows (requires_approval, and either
      requires_invite case) belong to Release 2 and are NOT implemented here — PRD 4
      states Meetup #3 is an open event and "invitations and approvals are not needed
      here". This requirement must nonetheless not make them impossible: the flags exist
      on Event (REQ-011) and this handler reads them, refusing clearly for a
      requires_invite or requires_approval event rather than silently admitting.

      Scope of work:
      - Register -> admission='admitted' when seats remain; the waitlisted branch is
        REQ-021. A confirmation naming the event, date, venue and what happens next
        (STORY-DETAILS B2).
      - PRD 12.1: already registered -> shown their CURRENT STATUS, never a duplicate
        row. The database UNIQUE(event_id, user_id) from REQ-011 is the backstop; the
        handler produces the friendly path.
      - Registration closed, cancelled or finished -> say so AND offer an onward path
        (STORY-DETAILS B2, JOURNEY-AUDIT's refusal-offramp principle), never a dead end.
      - Registration.source written from the channel suffix REQ-016 held against the
        user (PRD FR-1).
      - qr_token: >=128 bits from a cryptographically secure source
        (crypto.randomBytes — NEVER Math.random, never a sequential id, never a hash of
        the user id) generated on admission, encoding `?start=ci_<qr_token>`
        (security-invariants.md S4, PRD FR-14). The QR IMAGE rendering and its T-3h
        re-send are REQ-026; /my's always-available copy is REQ-024.
      - ATOMIC CAPACITY (security-invariants.md S7, PRD 12.2, PRD 13 criterion 3):
        seats_taken = count(admission='admitted') and the check-and-write must be
        ATOMIC, not read-then-write. Two concurrent registrations for the last seat must
        not both be admitted. At PRD 1's stated load a serializable transaction or a
        conditional insert is entirely sufficient; no queue or lock service is needed
        and adding one contradicts PRD 1's "do not add infrastructure".
      - Every admission writes exactly one AuditLog row (S8, PRD 12.7).
    acceptance_criteria:
      - "Two concurrent registrations for the LAST remaining seat result in exactly one admitted and one waitlisted (or one refused, per REQ-021's boundary), never two admitted — verified by an automated test using the REQ-009 test runner that issues both registrations concurrently against a real Postgres with capacity set so exactly one seat remains, repeated at least 20 times with zero over-admissions (security-invariants.md S7, PRD 12.2). A sequential two-call test does not exercise this and is not evidence."
      - "Registering twice for the same event yields the current status and exactly one registrations row for that (event_id, user_id) — verified by querying the row count after the second attempt (PRD 12.1)."
      - "Every issued qr_token carries at least 128 bits from a cryptographically secure source: verified by reading the generation code (it must call crypto.randomBytes or the chosen framework's CSPRNG equivalent, with a byte length of 16 or more) AND by generating 1000 tokens in a test and asserting zero collisions and the expected length (security-invariants.md S4). A `git grep` for Math.random in apps/bot must return no hit in any token path."
      - "Registering after registration_closes_at, for a cancelled event, and for a finished event each produce a stated reason plus an onward path, verified by constructing all three states (STORY-DETAILS B2)."
      - "A registration arriving after `?start=e_<id>__linkedin` carries source='linkedin' (or the agreed encoding, stated in the design artefact), verified by reading the registrations row (PRD FR-1)."
      - "Attempting to register for an event with requires_invite=true or requires_approval=true produces a clear refusal naming the reason rather than an admission — verified by constructing both flags (PRD 4: these are Release 2)."
      - "Each admission writes exactly one audit_log row, counted before and after (PRD 12.7, S8)."
    depends_on: [REQ-019, REQ-017]

  - id: REQ-021
    title: Waitlist placement with computed position display
    owner: BACKEND-DEV
    status: done
    description: >
      Third slice of PRD 14 build-order step 3. Implements USER-STORIES B3 /
      STORY-DETAILS B3 (Join the waitlist when it's full), PRD FR-6's waitlist half and
      PRD 13 acceptance criterion 3.

      Split from REQ-020 deliberately: REQ-020's hard problem is capacity atomicity,
      this one's is position computation, and USER-STORIES section 12's INVEST
      self-check itself sequences B3 -> B5 -> B4 as three separate stories.

      Scope of work:
      - Registering into a full event yields admission='waitlisted' and tells the person
        their position.
      - POSITION IS COMPUTED, NEVER STORED (PRD 5, PRD 13 criterion 8): position is
        the rank by Registration.created_at among rows with admission='waitlisted' for
        that event. It shifts up automatically as people ahead leave, because it is
        recomputed at every read. A position column, a cached rank, or a renumbering
        job would all be defects.
      - The waitlist is unbounded — STORY-DETAILS B3 states it refuses nothing unless
        the organizer closes registration. Waitlist CLOSURE is Release 2 (PRD 4) and
        is not implemented here.
      - The confirmation states the position and what happens next (auto-promotion,
        REQ-023) so the person is not left refreshing — JOURNEY-AUDIT's no-dead-ends
        principle.
    acceptance_criteria:
      - "With capacity fully taken, a new registration is created with admission='waitlisted' and the response states a position, verified against a live instance with a constructed at-capacity event (PRD 13 criterion 3)."
      - "With three waitlisted people, withdrawing the first one causes the second person's displayed position to change from 2 to 1 on their NEXT READ with no write to their registrations row — verified by capturing that row's updated timestamp before and after and confirming it is unchanged while the displayed position changed (PRD 5 computed-never-stored, PRD 13 criterion 8)."
      - "`git grep` over apps/bot finds no column, cache or persisted field holding a waitlist position or rank; the position appears only as a query expression over created_at (PRD 5)."
      - "The waitlist accepts an unbounded number of registrations — verified by adding at least 5 waitlisted registrations past capacity with no refusal (STORY-DETAILS B3)."
    depends_on: [REQ-020]

  - id: REQ-022
    title: Withdraw from a registration and free the seat
    owner: BACKEND-DEV
    status: done
    description: >
      Fourth slice of PRD 14 build-order step 3. Implements USER-STORIES B5 /
      STORY-DETAILS B5 (Change my mind). Sequenced before REQ-023's auto-promotion
      exactly as USER-STORIES section 12's INVEST self-check directs ("sequence
      B3 -> B5 -> B4"), because auto-promotion has no trigger until a withdrawal exists.

      Scope of work:
      - From /my, the person withdraws: admitted | waitlisted | requested -> withdrawn.
      - CONFIRMATION FIRST — this is destructive, and PRD 8 requires every destructive
        action to confirm (STORY-DETAILS B5).
      - Withdrawing from an admitted registration frees the seat IMMEDIATELY (the same
        moment), which is the event REQ-023's auto-promotion consumes. This requirement
        emits/exposes that seat-freed point; REQ-023 acts on it.
      - Withdrawing kills all future notifications for that event (STORY-DETAILS B5) —
        the scheduler requirements REQ-025..REQ-027 each re-check admission at send
        time rather than trusting a list built earlier.
      - REFUSAL (STORY-DETAILS B5): withdrawing after check-in is refused — "they were
        there; history is not editable."
      - A withdrawn person may register again later if seats reopen — the UNIQUE(event,
        user) row is REUSED by transitioning admission, not deleted and recreated, so
        history and created_at (which orders the waitlist) are preserved. The design
        artefact must state this explicitly, since a delete-and-recreate would silently
        move the person to the back of a waitlist queue they had earned a place in.
      - Every transition writes exactly one AuditLog row (PRD 12.7, S8).
    acceptance_criteria:
      - "Withdrawing requires an explicit confirmation step; dismissing the confirmation leaves admission unchanged, verified by running both the confirm and the dismiss path and reading the row back (PRD 8)."
      - "Withdrawing from admitted sets admission='withdrawn' and the event's computed seats-left increases by exactly one at the next read, verified by reading the seat count before and after (STORY-DETAILS B5)."
      - "Attempting to withdraw a registration whose checked_in_at is non-null is refused and the row is unchanged, verified by constructing exactly that state (STORY-DETAILS B5's explicit refusal)."
      - "Re-registering after withdrawing UPDATES the existing registrations row rather than inserting a new one — verified by capturing the row's primary key and created_at before withdrawal and after re-registration and confirming both are identical (preserving waitlist ordering; PRD 12.1)."
      - "Each withdrawal writes exactly one audit_log row, counted before and after (PRD 12.7, S8)."
    depends_on: [REQ-021]

  - id: REQ-023
    title: Waitlist auto-promotion on a freed seat, halting at T-24h
    owner: BACKEND-DEV
    status: done
    description: >
      Fifth slice of PRD 14 build-order step 3, and PRD 13 acceptance criterion 4.
      Implements USER-STORIES B4 / STORY-DETAILS B4 (Get in when a seat frees up) and
      PRD 6's auto-promotion rule. Sequenced after REQ-021 and REQ-022 per
      USER-STORIES section 12's INVEST note ("the value only exists once all three
      land").

      Scope of work:
      - When a registration LEAVES admitted while the event is published and
        now < starts_at, the LONGEST-WAITING waitlisted registration (earliest
        created_at) is promoted to admitted and notified, with their QR (PRD 6,
        STORY-DETAILS B4).
      - THE T-24h HALT (PRD 6, PRD 13 criterion 4, a hard rule, not a tuning knob):
        auto-promotion STOPS at T-24h. Inside that window a freed seat promotes nobody;
        the organizer promotes by hand from the waitlist screen. Manual promotion (story
        F5) is Release 3 per USER-STORIES, so in Release 1 the freed seat inside T-24h
        simply remains free and is VISIBLE to the organizer — the design artefact states
        where it is visible so this is not a silent hole.
      - Empty waitlist -> nothing happens and NO ERROR (STORY-DETAILS B4).
      - REFUSALS (STORY-DETAILS B4): never promote past capacity; never promote into a
        cancelled or finished event. Promotion re-checks capacity atomically at the
        moment of the write, for the same reason REQ-020's registration does
        (security-invariants.md S7) — a promotion racing a fresh registration must not
        over-admit.
      - The promotion notification is transactional (PRD 9) and therefore ignores
        broadcast_opt_in (security-invariants.md S10). It must not double-send if the
        promotion path runs twice — the idempotency ledger is REQ-025; until it lands,
        this requirement guarantees at-most-once WITHOUT a new "send-marker" column: the
        promoted row's own admission='admitted' transition is the guard (a promoted row
        can never again match the waitlisted-row selection filter, so a re-run against an
        already-refilled event structurally finds no capacity and no eligible candidate,
        takes no action, and sends nothing). The design artefact states this mechanism
        explicitly, plus its scope boundary (a crash between commit and the Telegram send
        itself is a separate, still-open at-least-once-delivery gap left for REQ-025's
        persistent ledger to close), so REQ-025 can later replace it rather than
        duplicate it.
      - Each promotion writes exactly one AuditLog row (PRD 12.7, S8).
    acceptance_criteria:
      - "With an event 48h out, capacity full, and three waitlisted registrations created at distinct times, an admitted person withdrawing promotes exactly the EARLIEST-created waitlisted registration to admitted and notifies them — verified by reading all three rows afterwards and confirming the other two are untouched (PRD 6, STORY-DETAILS B4)."
      - "With an event 12h out (inside T-24h), the same withdrawal promotes NOBODY: all waitlisted rows remain waitlisted and the freed seat stays free, verified by constructing exactly that timing and re-querying (PRD 6, PRD 13 criterion 4). A run with the event more than 24h out does not exercise this rule and is not evidence."
      - "With an empty waitlist, a withdrawal completes with no error and no promotion, verified by running it and capturing a clean exit (STORY-DETAILS B4)."
      - "A promotion running concurrently with a fresh registration for the same freed seat never results in admitted count exceeding capacity — verified by an automated concurrency test using the REQ-009 test runner, repeated at least 20 times (security-invariants.md S7)."
      - "Promotion into a cancelled event and into an event whose ends_at has passed are both refused, verified by constructing both states (STORY-DETAILS B4)."
      - "The promoted person receives the notification even with broadcast_opt_in=false, verified by setting that flag false before the promotion (PRD 9, security-invariants.md S10 — promotion is transactional)."
      - "Each promotion writes exactly one audit_log row, and running the promotion path twice for the same freed seat sends exactly one notification, counted from the captured send log (PRD 12.7, 12.8)."
    depends_on: [REQ-022]

  - id: REQ-024
    title: /my registrations view with live status, computed waitlist position and the QR pass
    owner: BACKEND-DEV
    status: done
    description: >
      Closes PRD 14 build-order step 3 by giving the member the surface every preceding
      requirement wrote state into. Implements PRD 8's /my ("my registrations, waitlist
      positions, QR codes, cancel") and STORY-DETAILS C2's requirement that the QR is
      "always retrievable from /my — this message is a convenience, never the only copy."

      Scope of work:
      - /my lists the user's live registrations with, per row: the event, its date/time
        in the chapter timezone, the current admission status, the computed waitlist
        position when waitlisted, and the withdraw action (REQ-022's flow).
      - The QR IMAGE: renders `?start=ci_<qr_token>` as a scannable image for an
        admitted registration (PRD FR-14). This is where the QR image renderer is
        introduced; REQ-026's T-3h message reuses it rather than reimplementing it.
      - PRIVACY (security-invariants.md S3): /my shows the requesting user's OWN
        registrations only. It is a list view, which S3 names as exactly the shape
        through which the own-data-only invariant is most easily lost.
      - A withdrawn or rejected registration shows its state plainly with an onward path
        rather than vanishing (JOURNEY-AUDIT's no-dead-ends principle).
    acceptance_criteria:
      - "/my invoked by user A returns only user A's registrations — verified by constructing two users each registered for the same event and confirming neither sees the other's row, name, company, phone or email anywhere in the response (security-invariants.md S3)."
      - "A waitlisted row shows the position computed live: verified by capturing the displayed position, withdrawing the person ahead, re-invoking /my, and confirming the position decreased with no write to the viewing user's registrations row (PRD 5)."
      - "An admitted registration's /my row yields a QR image which, decoded by an actual QR decoder, contains exactly the deep link `?start=ci_<that registration's qr_token>` — verified by decoding the produced image, not by inspecting the string passed to the encoder (PRD FR-14)."
      - "A waitlisted, withdrawn or rejected registration's /my row shows NO QR image (only admitted registrations carry a usable pass), verified by constructing all three states."
      - "The QR image renderer is a single shared function under apps/bot that REQ-026 can call, verified by reading the module's export — not duplicated inline in the /my handler."
    depends_on: [REQ-023]

  - id: REQ-025
    title: Scheduled job runner and the idempotent send-once notification ledger
    owner: BACKEND-DEV
    status: done
    description: >
      First slice of PRD 14 build-order step 4 ("Scheduler: T-24h 'Still coming?' and
      T-3h route + QR, both idempotent"). Split into REQ-025 (the mechanism),
      REQ-026 (the two reminder jobs) and REQ-027 (cancellation notification), because
      the idempotency mechanism is the enabler USER-STORIES section 11 lists separately
      ("Send-once notification mechanism", "Scheduled job runner") and is where PRD
      12.8's invariant actually lives.

      Derives from PRD FR-7, PRD 9, PRD 12.8 and security-invariants.md S9/S10.

      Scope of work:
      - A scheduled job runner inside the single bot process (PRD 1: "one Postgres and
        one bot process are sufficient. Do not add infrastructure" — no Redis, no worker
        queue; PRD 4's "Later" list defers those explicitly).
      - THE SEND LEDGER (PRD 12.8, security-invariants.md S9): a persisted record keyed
        on (registration_id, kind) that makes every notification send at-most-once
        ACROSS PROCESS RESTARTS. An in-memory set is explicitly insufficient — S9 names
        exactly that as its negative case, and PRD 13 criterion 6 requires "restarting
        the bot sends no duplicates". The ledger row and the send must be ordered so a
        crash between them cannot produce a double send.
      - TRANSACTIONAL vs MARKETING classification enforced at the send API level
        (PRD 9, security-invariants.md S10): transactional sends (admission result,
        waitlist promotion, reminders, feedback request, event cancelled) always send
        and ignore broadcast_opt_in; marketing sends require it. Release 1 sends only
        transactional messages — but the API must make the distinction explicit at the
        call site so a Release 3 broadcast cannot inherit the transactional path by
        default. `blocked` users are skipped in both cases.
      - Telegram rate limiting (<=25 msg/s) with exponential backoff on HTTP 429
        (PRD FR-15). At Release 1's volumes this is defensive, not hot-path, but the
        wrapper belongs here so every later send inherits it.
      - REQ-023's in-transaction promotion send-marker is REPLACED by this ledger rather
        than left alongside it — the design artefact must state the migration path.
    acceptance_criteria:
      - "Sending a notification for (registration R, kind 'reminder_24h'), KILLING the process, restarting it, and running the same job again results in exactly ONE message delivered — verified by counting captured sends across both runs (PRD 12.8, PRD 13 criterion 6, security-invariants.md S9). A single-run test does not exercise restart-safety and is not evidence."
      - "`git grep` over the ledger implementation finds no in-memory Set, Map or module-level variable serving as the sole idempotency record — the key (registration_id, kind) is enforced by a database UNIQUE constraint, verified by attempting a duplicate ledger insert directly and confirming it fails (security-invariants.md S9)."
      - "A user with broadcast_opt_in=false receives a send classified transactional and does NOT receive one classified marketing — both branches run against that same user and captured (PRD 9, security-invariants.md S10)."
      - "A user with blocked=true receives neither a transactional nor a marketing send, verified by running both against that user (security-invariants.md S10)."
      - "The send API requires an explicit transactional/marketing classification argument at every call site — verified by reading the function signature and confirming the parameter has no default value; a default would let a later call inherit the transactional path silently."
      - "An HTTP 429 response from the Telegram API triggers a backoff-and-retry rather than a dropped message, verified with a stubbed API returning 429 then 200 and confirming the message is ultimately delivered exactly once (PRD FR-15)."
    depends_on: [REQ-024]

  - id: REQ-026
    title: T-24h "Still coming?" reconfirmation and T-3h route + QR reminder jobs
    owner: BACKEND-DEV
    status: done
    description: >
      Second slice of PRD 14 build-order step 4, and the show-rate feature the whole
      product's primary metric depends on (PRD 2: raise show-rate from 70% to >=80%;
      PRD 11a lists C1 as "critical for the show-rate goal"). Implements PRD FR-7,
      USER-STORIES C1 and C2, and PRD 13 acceptance criterion 6.

      Scope of work:
      - T-24h job, for admission='admitted' registrations on a still-published event:
        ONE message with two buttons (PRD FR-7, STORY-DETAILS C1).
        "I'll be there" -> sets Registration.reconfirmed_at, nothing else changes.
        "Can't make it" -> withdrawn, seat freed, REQ-023's auto-promotion fires.
      - T-3h job, for still-admitted registrations: ONE message with the venue address,
        BOTH map links, the start time in the chapter timezone, and the QR image —
        rendered by REQ-024's shared renderer, not reimplemented (PRD FR-7, FR-14,
        STORY-DETAILS C2).
      - Both jobs go through REQ-025's ledger, keyed (registration_id, kind), so a
        restart sends nothing twice (PRD 12.8, PRD 13 criterion 6).
      - Both re-check admission AT SEND TIME. Already withdrawn -> nothing sent
        (STORY-DETAILS C1, C2). Cancelled event -> REQ-027's message instead, not this
        one.
      - Both are transactional (PRD 9) and ignore broadcast_opt_in.

      DOORS-OPEN TIME — RESOLVED by docs/agents/decisions/0007-doors-time-in-t3h-reminder.md
      (2026-09-06), which is the AUTHORITATIVE statement of this decision and the place
      to change it; the summary below is a convenience copy. That record is marked
      provisional pending the product owner, who may overturn it — it overrides a
      literal PRD FR-7 instruction, the only decision in this registry that does. The spec's README lists this under "Open questions
      for Viktor": "the brochure says 19:30 doors / 20:00 start; the reminder currently
      quotes the start only." The earlier draft of this requirement framed the options
      as (a) quote starts_at only, or (b) add a doors_at field, and chose (a) on the
      grounds that (b) would mean inventing a data-model field the PRD does not define.

      THAT FRAMING WAS WRONG, and the correction came from the project owner asking why
      doors could not simply be a parameter. It already is one. PRD 5 defines
      Event.agenda[] as "non-talk items only (doors, networking, close)" — doors is the
      FIRST named example of what that field holds — and RE-EVALUATION.md R7 shows this
      was deliberate: agenda[] was cut as a speculative unused field in v1, then
      reinstated with exactly this narrowed non-talk definition. The doors time is
      therefore already modelled, already stored (REQ-011), already editable (REQ-016)
      and already shown on the event card (REQ-017). No new field is needed and none may
      be added.

      What remains is a much smaller question, about one message rather than the data
      model: FR-7 specifies the T-3h reminder as "address, both map links, start time,
      QR code" and does not mention doors. RESOLUTION: the T-3h reminder ALSO quotes the
      doors time WHEN, AND ONLY WHEN, the event's agenda[] contains a doors item;
      otherwise it quotes the start time alone, exactly as it does today. Reading an
      existing field for the purpose the spec assigned it is not inventing a business
      rule, so PRD's closing rule is not engaged. The reminder's job is getting a person
      to the right place at the right time (PRD 2's show-rate goal), and telling someone
      20:00 when the room opens at 19:30 is the failure this fixes.

      NO doors_at COLUMN MAY BE ADDED — the doors time is read from agenda[], never
      duplicated onto the events table. A schema change here would contradict PRD 5 and
      RE-EVALUATION R7's explicit de-duplication.

      The agenda[] item shape (how a doors item is distinguished from networking or
      close) is DATA-DESIGNER's to specify at REQ-011, since that is the requirement
      that models Event and therefore agenda[] — NOT REQ-010, which covers Chapter, User
      and Profile only and contains no agenda at all. This requirement consumes whatever
      shape REQ-011 defines and must not invent a competing convention. If REQ-011's
      shape turns out not to support identifying a doors item, that is a BLOCKER to
      report against REQ-011, not a licence to add a field here.
    acceptance_criteria:
      - "With an event exactly 24h out and one admitted registration, the T-24h job sends exactly one message carrying both an 'I'll be there' and a 'Can't make it' control — verified against a live instance with the event timing constructed to that boundary (PRD FR-7)."
      - "Tapping 'I'll be there' sets registrations.reconfirmed_at to a non-null timestamp and changes admission NOT AT ALL; tapping 'Can't make it' sets admission='withdrawn' and frees the seat — both verified by reading the row back after each (STORY-DETAILS C1)."
      - "Running the T-24h job, killing the process, restarting, and running it again for the same registration delivers exactly ONE message total, counted from the captured sends (PRD 13 criterion 6, PRD 12.8)."
      - "A registration that withdrew BEFORE the job runs receives nothing from either job, verified by constructing that state and running both (STORY-DETAILS C1, C2)."
      - "The T-3h message contains the venue address, BOTH the Yandex and the Google map link, the start time rendered in the chapter's timezone, and a QR image that decodes to `?start=ci_<that registration's qr_token>` — every element verified in the captured message, with the QR decoded by an actual decoder (PRD FR-7, FR-14)."
      - "For an event whose agenda[] contains a doors item, the T-3h message quotes BOTH the doors time and Event.starts_at, each rendered in the chapter timezone (PRD 5 Chapter.timezone), matching how the start time is already rendered."
      - "The doors time the T-3h reminder sends is byte-for-byte the rendering REQ-017's event card already shows for that same event — verified by rendering both for one event and comparing. This check lives here rather than in REQ-017 because REQ-017 is built first (it is a transitive ancestor of this requirement), so only this requirement can compare against an already-built card renderer."
      - "For an event whose agenda[] is NON-EMPTY but contains only non-doors items (networking and close), the T-3h message quotes starts_at alone and contains no doors time and no agenda item time of any kind — an EMPTY agenda does not satisfy this criterion, because it cannot catch a loose match that treats any agenda item as the doors item. Verified by constructing that exact event and reading the actual message sent."
      - "No doors_at (or equivalently-named) column exists on the events table and no migration adds one — the doors time is read from agenda[] only, verified by grepping the schema and every migration file (PRD 5, RE-EVALUATION R7 de-duplication)."
      - "Both reminders reach a user with broadcast_opt_in=false, verified by setting that flag before the runs (PRD 9 — reminders are transactional)."
    depends_on: [REQ-025]

  - id: REQ-027
    title: Event cancellation notifies every non-withdrawn registrant, once
    owner: BACKEND-DEV
    status: done
    description: >
      Closes PRD 14 build-order step 4 by supplying the notification REQ-016
      deliberately deferred. PRD 6 states "Cancelling notifies every non-withdrawn
      registrant"; REQ-016 implemented the published -> cancelled transition but the
      send-once ledger did not exist yet. It exists as of REQ-025.

      Implements PRD 6's cancellation rule and USER-STORIES F6's confirmation "every
      non-withdrawn registrant is notified once" — F6 as a whole (the organizer-facing
      cancel flow) is Release 3 in USER-STORIES, but its notification half is a PRD 6
      invariant that must not be left unsatisfied once cancellation is reachable, which
      it is from REQ-016. That scope boundary is stated here explicitly.

      Scope of work:
      - On published -> cancelled, every registration whose admission is not 'withdrawn'
        receives exactly one notification, through REQ-025's ledger keyed
        (registration_id, 'event_cancelled').
      - Withdrawn registrants receive nothing.
      - The message states plainly what happened and offers an onward path — the
        upcoming events list (JOURNEY-AUDIT's no-dead-ends principle; STORY-DETAILS A2
        applies the same rule to a cancelled event's deep link).
      - Transactional (PRD 9): sent regardless of broadcast_opt_in
        (security-invariants.md S10).
      - A cancelled event's registrations are NOT deleted or mass-withdrawn — the
        historical record and its aggregate counts stay intact (the same principle
        security-invariants.md S13 protects for deletion).
    acceptance_criteria:
      - "Cancelling an event with 3 admitted, 2 waitlisted and 1 withdrawn registration delivers exactly 5 notifications — one to each non-withdrawn registrant and none to the withdrawn one — counted from the captured sends (PRD 6)."
      - "Cancelling the same event twice (or re-running the notification path after a process restart) delivers no additional messages, counted across both runs (PRD 12.8, security-invariants.md S9)."
      - "A registrant with broadcast_opt_in=false receives the cancellation message, verified by setting that flag before cancelling (PRD 9, security-invariants.md S10)."
      - "After cancellation, every registrations row for that event still exists with its admission unchanged, verified by comparing the full row set before and after (S13's aggregate-preservation principle)."
      - "The message offers the upcoming events list as an onward path, verified by reading the captured message text."
    depends_on: [REQ-026]

  - id: REQ-028
    title: Manual check-in list — alphabetical, searchable, toggleable, with a live counter
    owner: BACKEND-DEV
    status: done
    description: >
      First slice of PRD 14 build-order step 5 ("Check-in: manual list first, then QR,
      plus EventStaff and walk-ins"). THE ORDERING IS A REQUIREMENT, NOT A PREFERENCE:
      PRD 14 states it twice — "Build the manual check-in list before the QR scanner.
      It is the fallback the whole door depends on, and it is the simpler of the two —
      so it also proves the data model works before any scanning logic is added" — and
      the spec README repeats it. C4 is also on PRD 11a's five-story critical path,
      while C3 (QR) is only "critical for scale at the door" with C4 as its stated
      fallback. Hence REQ-028 precedes REQ-029 in this chain.

      Implements PRD FR-14a and USER-STORIES C4 / STORY-DETAILS C4.

      NOTED SPEC VARIANCE, recorded rather than resolved: STORY-DETAILS C4's "Also" line
      says the manual list is "Built alongside C3, never after it," while PRD 14 and
      the spec README both say "before the QR scanner." These agree on the substance —
      the manual list must not TRAIL the scanner — and differ only on whether it is
      simultaneous or strictly prior. PRD.md is the authoritative document per the spec
      README's own stated reading order, so this chain implements strictly prior. No
      behaviour depends on the difference.

      Scope of work:
      - EventStaff (or organizer) for THAT event opens check-in and sees admitted
        attendees alphabetically, with a search box (PRD FR-14a).
      - Tapping a name marks them present: sets checked_in_at, checked_in_by and
        check_in_method='manual'. Tapping again UNDOES it, and the undo is LOGGED
        (STORY-DETAILS C4).
      - A live counter of people in the room, computed as count(checked_in_at NOT NULL)
        — never a stored counter (PRD 5's computed-never-stored discipline).
      - S6 (PRD 12.3): checked_in_at may be set ONLY while admission='admitted'. Its
        named negative case is precisely this screen — someone whose admission changed
        between the list being rendered and the toggle being pressed. The check must
        therefore happen at the WRITE, not only at render time.
      - S2/S3: EventStaff see only this event's check-in screen (REQ-018 established
        the gate) and the list must not surface another person's phone, email or
        employer to someone without organizer rights — S3 names a check-in screen as
        exactly this leak's shape. The list shows the name and, per USER-STORIES C3's
        "enough to greet them properly", company; it must NOT show phone or email.
      - Every check-in and every undo writes exactly one AuditLog row (PRD 12.7, S8).
    acceptance_criteria:
      - "Rendering the list, then changing that person's admission to 'withdrawn' directly in the database, then pressing the (now-stale) toggle results in NO check-in being written and a stated refusal — verified by constructing exactly that interleaving and reading the row back (security-invariants.md S6, PRD 12.3; a toggle pressed on a freshly-rendered list does not exercise this and is not evidence)."
      - "Tapping an admitted attendee sets checked_in_at, checked_in_by (to the staff member's user id) and check_in_method='manual'; tapping again clears checked_in_at — both verified by reading the row after each tap, and each writing exactly one audit_log row (counted before and after; STORY-DETAILS C4, PRD 12.7)."
      - "The rendered list contains no phone number and no email address for any attendee — verified by constructing an event where every admitted attendee has both stored, rendering the list as an EventStaff member, and grepping the captured output for each stored value (security-invariants.md S3)."
      - "The live counter equals count(checked_in_at IS NOT NULL) at every read: verified by capturing the counter, setting one more checked_in_at directly in the database, re-rendering and confirming the counter incremented by exactly one with no write to the events table (PRD 5)."
      - "The list shows only admission='admitted' attendees — a waitlisted and a withdrawn registration for the same event do not appear, verified by constructing both (STORY-DETAILS C4's refusal: 'Marking anyone not admitted')."
      - "Search narrows the list by name, verified with at least 10 admitted attendees and a query matching exactly one (PRD FR-14a)."
    depends_on: [REQ-027, REQ-018]

  - id: REQ-029
    title: QR check-in via ci_ deep link with the full refusal table and non-staff audit logging
    owner: BACKEND-DEV
    status: done
    description: >
      Second slice of PRD 14 build-order step 5, built AFTER REQ-028's manual list per
      PRD 14's stated ordering rule. Implements PRD FR-14, USER-STORIES C3 /
      STORY-DETAILS C3, PRD 13 acceptance criterion 7, and security-invariants.md S5.

      Scope of work:
      - A volunteer scans the attendee's QR with a PLAIN PHONE CAMERA. Telegram opens
        and delivers `/start ci_<qr_token>` FROM THE VOLUNTEER'S OWN ACCOUNT (PRD FR-14).
        No Mini App, no scanner hardware — PRD 4's "Later" list defers the Mini App
        continuous scanner explicitly, and PRD 4's non-goals forbid a custom Telegram
        client. A design proposing either contradicts the PRD and decisions/0003.
      - THE REFUSAL TABLE, implemented case by case (PRD FR-14,
        security-invariants.md S5) — each row is a distinct verifiable behaviour:
        (1) valid token + scanner is staff for THAT event + admission='admitted' ->
        set checked_in_at, checked_in_by, check_in_method='qr'; show the attendee's
        name, company and the live counter.
        (2) already checked in -> report WHEN and BY WHOM. NEVER a duplicate write.
        (3) waitlisted / requested / withdrawn -> refuse with the reason; offer an
        organizer override.
        (4) unknown token, or now > event ends_at -> refuse.
        (5) SCANNER IS NOT STAFF -> refuse AND WRITE AN AUDIT LOG ROW. S5 names this as
        the case where the log matters most, and its negative case is precisely a
        refusal that writes no audit row.
      - S6 (PRD 12.3): checked_in_at settable only while admission='admitted', checked
        at the write.
      - S4: a qr_token authorizes exactly ONE thing — identifying one registration at
        check-in. It is not an authentication credential for anything else, and it does
        not remain usable after the event ends.
      - S3: the scan result shows the attendee's name and company to the scanning staff
        member (USER-STORIES C3: "enough to greet them properly"), and NOT their phone
        or email.
      - The organizer override for a refused non-admitted attendee writes an AuditLog
        row (PRD 12.2's logged-override principle, S7/S8).
    acceptance_criteria:
      - "A user who is NOT EventStaff for that event scanning a valid token is refused AND an audit_log row is written naming the actor, the action and the registration — verified by counting audit rows before and after and reading the row's contents (security-invariants.md S5, PRD FR-14). A refusal with zero audit rows is a FAIL of this criterion."
      - "A staff scan of an admitted attendee sets checked_in_at, checked_in_by and check_in_method='qr'; scanning the SAME token again reports the existing check-in time and the checker's name and leaves checked_in_at BYTE-FOR-BYTE unchanged — verified by capturing the timestamp after the first scan and re-reading it after the second (PRD 13 criterion 7)."
      - "Scanning the token of a waitlisted, a requested and a withdrawn registration each produce a refusal STATING THAT SPECIFIC REASON and offering the organizer override — all three constructed and run, and in each case checked_in_at remains NULL (security-invariants.md S5, S6)."
      - "Scanning an unknown token is refused, and scanning a valid admitted token after the event's ends_at has passed is refused — both constructed and run, with the second confirming the token does not outlive the event (security-invariants.md S4, S5)."
      - "The scan-success screen shows the attendee's name, company and the live in-room counter, and contains NEITHER their phone NOR their email — verified by storing both on the attendee and grepping the captured screen output for each value (security-invariants.md S3)."
      - "An organizer override admitting and checking in a previously-refused attendee writes exactly one audit_log row, counted before and after (PRD 12.2, security-invariants.md S7, S8)."
      - "`git grep` over apps/bot finds no Mini App, WebApp scanner or custom-client scanning code path — check-in arrives solely as a `/start ci_<token>` deep link (PRD 4 'Later', PRD FR-14)."
    depends_on: [REQ-028]

  - id: REQ-030
    title: Walk-in registration at the door with in-flow consent and logged capacity override
    owner: BACKEND-DEV
    status: done
    description: >
      Closes PRD 14 build-order step 5. Implements USER-STORIES C5 /
      STORY-DETAILS C5 (Let a good walk-in in) and PRD FR-14a's "walk-in add".

      Scope of work:
      - An ORGANIZER (not plain EventStaff — STORY-DETAILS C5 states organizer rights,
        and security-invariants.md S2 confines EventStaff to check-in screens) adds a
        person at the door with a minimal field set: name, company, phone.
      - CONSENT IS CAPTURED IN THE SAME STEP, BEFORE ANYTHING IS STORED
        (STORY-DETAILS C5's explicit refusal "Storing personal data before consent";
        security-invariants.md S1's negative case names exactly this — "a walk-in path
        that skips the consent step because it is faster at the door"; and the spec
        README's non-negotiable rule 3 says "including walk-ins at the door"). Note
        that phone is one of the minimum door fields here even though PRD 5 marks it
        optional generally — that is not a contradiction, it is the door's own minimum,
        and it is still gated behind consent like every other stored field.
      - A registration is created admitted AND marked present in ONE move, with
        check_in_method='manual'.
      - IF THE PERSON ALREADY HAS A PROFILE, IT IS REUSED, NOT DUPLICATED
        (STORY-DETAILS C5). The match resolves to User.id; tg_id may be NULL for
        someone who has never opened the bot (PRD 5), so tg_id must not be the matching
        key on its own.
      - OVER CAPACITY REQUIRES AN EXPLICIT, CONFIRMED, LOGGED OVERRIDE
        (STORY-DETAILS C5's refusal "Silent over-capacity"; PRD 12.2 and
        security-invariants.md S7: seats_taken exceeds capacity ONLY via an explicit
        organizer override that writes an AuditLog row).
      - S11: the phone collected at the door is never written to a log line or an audit
        payload in plaintext.
    acceptance_criteria:
      - "Abandoning the walk-in flow at the consent step leaves ZERO new users, profiles and registrations rows — verified by capturing all three tables' row counts before and after the abandoned flow (security-invariants.md S1, STORY-DETAILS C5's refusal)."
      - "Completing the walk-in flow with seats remaining creates a registration with admission='admitted' AND a non-null checked_in_at with check_in_method='manual' in one flow, verified by reading the row (STORY-DETAILS C5)."
      - "Adding a walk-in when admitted count already equals capacity requires an explicit confirmation, and confirming writes exactly one audit_log row recording the override — verified by counting audit rows before and after and reading the row's payload; dismissing the confirmation creates no registration (PRD 12.2, security-invariants.md S7)."
      - "Adding a walk-in whose person already exists (matched by the flow's stated matching rule) reuses the existing users and profiles rows rather than creating duplicates — verified by capturing both tables' row counts and the existing user's id before and after (STORY-DETAILS C5)."
      - "The phone number entered at the door appears in NO log line and in NO audit_log payload — verified by grepping the captured process logs and every audit row written during the flow for the exact phone string used (security-invariants.md S11)."
      - "An EventStaff member who is not an organizer invoking the walk-in handler directly is refused, verified by constructing that call (security-invariants.md S2)."
    depends_on: [REQ-029]

  - id: REQ-031
    title: Post-event feedback request with NPS, comments and topic votes
    owner: BACKEND-DEV
    status: done
    description: >
      First slice of PRD 14 build-order step 6 ("Feedback / NPS + no-show reasons"),
      the final step of Release 1. Implements PRD FR-8, USER-STORIES D1 /
      STORY-DETAILS D1, and PRD 13 acceptance criterion 9.

      Scope of work:
      - At T+2h after ends_at, EVERYONE WITH checked_in_at (and only them —
        STORY-DETAILS D1's refusal is "Asking anyone who wasn't present") receives the
        feedback request, through REQ-025's ledger.
      - Content per PRD FR-8: NPS 0-10, what worked (Feedback.liked), what to improve
        (Feedback.improve), topic votes (Feedback.topic_votes). Every question skippable
        EXCEPT NPS (STORY-DETAILS D1). Keep it short — D1's Conversation note says
        length is why response rates die, and PRD 2 targets >=40% response.
      - Feedback is 1:1 with Registration (PRD 5), so this requirement adds the
        Feedback entity's migration — it was deliberately left out of REQ-010/REQ-011
        so its shape lands with the flow that fills it.
      - ONE reminder at T+24h, then silence (PRD FR-8, STORY-DETAILS D1). Both sends go
        through REQ-025's ledger with distinct kinds so neither can double-send.
      - THE BROADCAST OPT-IN ASK (STORY-DETAILS D1): once, at the end — "may we message
        you about future events?" — writing User.broadcast_opt_in. Declining is
        remembered and NEVER ASKED AGAIN (D1's refusal: "Asking about contact more than
        once"). This is security-invariants.md S1's message-me consent, stored in its
        own home and never conflated with consent_pd_at or publish_consent.
      - The "want to speak at a future event?" question (PRD FR-8's final element) is
        story D2, which USER-STORIES marks R3 and which requires the Talk entity —
        Release 3. It is OUT OF SCOPE here and the question is not asked in Release 1.
        Stated explicitly so its absence is a decision, not an omission.
      - The feedback request is transactional (PRD 9) and ignores broadcast_opt_in.
    acceptance_criteria:
      - "At T+2h, a registration with checked_in_at receives the feedback request and a registration that was admitted but never checked in receives NOTHING from this job — both constructed and the captured sends counted (STORY-DETAILS D1's refusal)."
      - "Submitting NPS plus comments plus topic votes writes one feedback row linked 1:1 to that registration; attempting a second feedback row for the same registration fails on a database constraint, verified by attempting the duplicate insert directly (PRD 5)."
      - "Every question except NPS can be skipped and the feedback still saves; skipping NPS does not save a feedback row — both paths run (STORY-DETAILS D1)."
      - "A person who ignores the request receives exactly one reminder at T+24h and nothing thereafter — verified by running the job at T+24h and again at T+48h and counting the captured sends across both (PRD FR-8)."
      - "The broadcast-opt-in question is asked once; after the person declines, re-running the whole feedback flow for a later event does not ask again, and users.broadcast_opt_in remains false — verified by constructing exactly that two-event sequence (STORY-DETAILS D1's refusal, security-invariants.md S1)."
      - "No 'want to speak' question is asked and no talks table or Talk entity is created by this requirement, verified by reading the captured conversation and grepping the migrations (PRD 4 — Talks are Release 3)."
      - "The feedback request reaches a user with broadcast_opt_in=false, verified by setting that flag before the run (PRD 9 — transactional)."
    depends_on: [REQ-030]

  - id: REQ-032
    title: No-show reason capture, closing Release 1
    owner: BACKEND-DEV
    status: done
    description: >
      FINAL REQUIREMENT OF RELEASE 1. Closes PRD 14 build-order step 6. Implements
      USER-STORIES D3 / STORY-DETAILS D3 (Say what got in the way) and PRD 13
      acceptance criterion 8's no_show half.

      Scope of work:
      - After the event ends, a registration that is admission='admitted' with
        checked_in_at NULL — i.e. a computed no_show — receives ONE short, blame-free
        message asking what got in the way.
      - Fixed reasons plus optional free text (STORY-DETAILS D3): work ran over,
        illness, forgot, transport, lost interest. The answer is stored in
        Registration.no_show_reason (PRD 5 lists it there and PRD FR-16 ranks it in
        the factsheet's "Why people missed it" line).
      - ASKED ONCE. Silence is an acceptable answer — there is NO reminder
        (STORY-DETAILS D3's refusal: "Reminding"). This differs deliberately from
        REQ-031's feedback flow, which does send one reminder.
      - WORDING: STORY-DETAILS D3's other refusal is "Any wording implying blame." The
        implementing agent writes plain factual wording and records in its handoff
        result that the exact copy is provisional pending the product owner — the same
        treatment REQ-014 gives the consent wording, since USER-STORIES D3 says "Viktor
        should write it" and there is no human in this pipeline.
      - `no_show` ITSELF IS NEVER STORED (PRD 5, PRD 13 criterion 8). It is derived as
        (admission='admitted' AND checked_in_at IS NULL AND now > ends_at). Only the
        REASON is a stored column. A boolean no_show column, or a job that materializes
        one, is a defect.
      - Transactional (PRD 9), through REQ-025's ledger.

      RELEASE BOUNDARY — READ BEFORE DRAFTING MORE REQUIREMENTS. REQ-007..REQ-032 are
      the monorepo migration plus PRD 4's RELEASE 1 (Meetup #3, September) in PRD 14's
      stated build order. RELEASE 2 AND RELEASE 3 ARE DELIBERATELY NOT DRAFTED IN THIS
      WF-01 RUN — registering ~22 more entries that cannot start until Release 1 lands
      would be registry noise, and their shape may legitimately change once Release 1 is
      real. They are a LATER WF-01 run, and they cover:
      (Release 2 — PRD 4 and PRD 14 step 7, next Fail Stories, Q4, 7 stories) approval
      requests (FR-4's requires_approval rows, stories B6/F3); invite codes (FR-5,
      stories B7/F4); +1 companions (FR-5, story B8); the invitation list with
      invited/opened/registered/attended outreach status (FR-17, story F9); waitlist
      closure notification (story B9).
      (Release 3 — PRD 4 and PRD 14 steps 8-10, Meetup #4 onward, 15 stories) the
      speaker CFP and pipeline (FR-9, FR-10, stories E1/E2/E4); lineup on the event card
      with publish consent (FR-11, stories E3/E5, security-invariants.md S14); speaker
      seats (story E6); segmented broadcast with the programme template and notification
      preferences (FR-15, stories G1a/G2/G3, security-invariants.md S10); chapter
      interest / wishlist (FR-6's wishlist half, story G4); full metrics matching the
      partner factsheet and CSV export (FR-16, stories H1/H2, security-invariants.md
      S12); manual waitlist promotion (story F5); the organizer-facing cancel flow
      (story F6, whose notification half REQ-027 already covers); audit and hardening.
      PRD 4's "Later" list (.ics files, materials archive, analytics dashboard, UZ/KZ
      BOT interface locales, Telegram Mini App scanner, Redis/worker queue) and its
      "Non-goals" list (payments, gamification, full CRM, custom Telegram client, a web
      front-end for the bot, hackathon teams/judging) are NOT to be drafted at all — a
      requirement proposing one contradicts decisions/0003 and PRD 4.
    acceptance_criteria:
      - "After ends_at, a registration that is admitted with checked_in_at NULL receives exactly one message offering the five fixed reasons plus a free-text option; a registration that WAS checked in receives nothing — both constructed and the captured sends counted (STORY-DETAILS D3)."
      - "Selecting a reason writes it to registrations.no_show_reason, verified by reading the row back (PRD 5, FR-16)."
      - "The job is re-run at T+24h and T+48h and delivers NO further message to the same registration — counted across all runs (STORY-DETAILS D3's refusal 'Reminding'); this differs from REQ-031's flow, which does remind once."
      - "No boolean no_show column exists in any migration and no job writes one — verified by grepping every apps/bot migration for 'no_show' and confirming the only match is the no_show_reason column (PRD 5, PRD 13 criterion 8)."
      - "The no_show derivation returns the correct set for a constructed event with one admitted-and-checked-in, one admitted-and-not-checked-in, and one withdrawn registration: exactly one row is a no-show, verified by running the derivation after ends_at has passed (PRD 13 criterion 8)."
      - "The message reaches a user with broadcast_opt_in=false, verified by setting that flag before the run (PRD 9 — transactional)."
      - "The handoff result records that the no-show wording is provisional pending the product owner, per USER-STORIES D3's 'Viktor should write it' (verified by reading the handoff's result.issues)."
    depends_on: [REQ-031]

  - id: REQ-033
    title: InviteCode data model, the registrations.invite_code_id foreign key, and the CSPRNG code generator
    owner: DATA-DESIGNER
    status: done
    description: >
      FIRST REQUIREMENT OF RELEASE 2 (PRD 4's "next Fail Stories, Q4 - 7 stories",
      PRD 14 build-order step 7). Release 2 covers exactly seven stories: B6, B7, B8,
      B9, F3, F4, F9. This requirement is the schema enabler all of B7/B8/F4/F9 need
      and none of them can create for itself without three requirements racing to
      define the same table.

      It follows the REQ-010/REQ-011/REQ-025/REQ-031 precedent exactly: schema-bearing
      work is drafted as its own DATA-DESIGNER-owned requirement producing a design
      artefact under docs/agents/design/ PLUS the migration under apps/bot/, so
      DATA-DESIGNER's step is separable from the BACKEND-DEV requirements that consume
      it. (REQ-010 and REQ-011 are owner: DATA-DESIGNER; REQ-025 and REQ-031 are
      owner: BACKEND-DEV and carry their schema inline because their table exists only
      to serve one flow. InviteCode serves four separate flows, so it takes REQ-010's
      shape, not REQ-025's.)

      VERIFIED CURRENT STATE (read from apps/bot/src/db/schema.ts at drafting time --
      re-verify before changing, per HANDOFF_PROTOCOL.md 1.1, do not trust this
      paragraph): there is NO InviteCode table anywhere in the schema. The
      `registrations` table carries `inviteCodeId: uuid("invite_code_id")` as a PLAIN
      UUID COLUMN WITH NO FOREIGN KEY, and the comment above it reads: "No FK: no
      InviteCode table exists in this requirement's scope (REQ-011.md 11 open question
      3). A future requirement adds the FK." THIS IS THAT REQUIREMENT. Adding the FK
      is not scope creep; it is the deferred half of an explicitly-recorded open
      question being closed at the point the referenced table finally exists.

      Scope of work -- one entity plus one FK plus one generator:
      - InviteCode, per PRD 5: event_id - code(UNIQUE) - issued_to_user_id(nullable) -
        grants_companion_of(user_id, nullable) - max_uses - used_count - expires_at.
        UUID primary key and created/updated timestamps like every other entity
        (PRD 5 preamble).
      - The three code SHAPES PRD FR-5 and story F4 name are COMPOSITIONS of those
        columns, not a fourth `type` enum column: PERSONAL is
        issued_to_user_id non-null with max_uses=1; BULK is issued_to_user_id null
        with max_uses=N; COMPANION is grants_companion_of non-null. The design
        artefact states this composition explicitly and states which combinations are
        legal, because REQ-037 (issuing) and REQ-038/REQ-039 (redeeming) all branch
        on it and must not each invent their own reading. This mirrors
        DESIGN-REVIEW.md's own reasoning for requires_invite/requires_approval being
        two booleans rather than one access enum ("compositions, not special cases").
      - The FK: registrations.invite_code_id becomes a real foreign key to
        invite_codes.id, replacing the plain uuid column, with the same onDelete
        posture as the other person/event references in that table (`restrict` -- a
        redeemed code is history and must not be deletable out from under a
        registration; the design artefact states this).
      - The code VALUE generator: security-invariants.md S4 sets the SAME bar for
        InviteCode values as for qr_token -- cryptographically secure source, never
        Math.random, never a sequential id, never a hash of a user id. It must also be
        human-typeable, because story B7 requires redemption "by typing it" as well as
        by `?start=i_<code>` deep link. These two pull against each other and the
        design artefact must resolve the tension explicitly (an alphabet excluding
        visually ambiguous characters, with a stated length giving the entropy S4
        demands). apps/bot/src/domain/registration.ts's generateQrToken() is the
        existing CSPRNG precedent to follow, not to copy verbatim -- its 64-character
        hex output is not typeable.
      - used_count is a STORED counter and this is NOT a violation of PRD 5's
        computed-never-stored rule. PRD 5 names exactly five computed values (no_show,
        waitlist position, seats taken, registration_open, finished) and lists
        `used_count` as an InviteCode FIELD in the same block. Stated here because a
        reader who has internalized REQ-017/REQ-021's discipline will otherwise flag
        it. It is nonetheless subject to S7-style atomicity at increment time, which
        is REQ-038's problem, not this one's.
      - NO handlers, NO domain logic, NO issuing or redemption flow -- REQ-037 and
        REQ-038 own those. This requirement produces the design artefact and the
        migration only, exactly as REQ-010 and REQ-011 did.

      OPEN QUESTION, flagged rather than silently resolved (docs/agents/decisions/ is
      the place it would be settled if it needs to be): PRD FR-4's row
      `requires_invite=true, requires_approval=false` states "Valid code -> admitted;
      no code -> offer wishlist", and FR-4 additionally says "A user who has
      checked_in_at on any past event satisfies requires_invite without a code
      (eligibility rule, CONFIGURABLE PER EVENT)". "Configurable per event" implies an
      Event-level flag that PRD 5's Event entity does not list. This requirement does
      NOT add such a column -- inventing an unlisted Event field is exactly what PRD's
      closing rule forbids, and REQ-026's doors-time episode is this registry's own
      precedent for reading an existing field rather than adding one. REQ-038 owns the
      eligibility rule and must state how it resolves "configurable per event" (a new
      flag needing a decision record, or the rule applying uniformly to every
      requires_invite event); this requirement records the question so REQ-038 cannot
      inherit it silently.
    acceptance_criteria:
      - "The migration creates an invite_codes table with a UUID primary key, created/updated timestamps, and columns for event_id, code, issued_to_user_id, grants_companion_of, max_uses, used_count and expires_at -- verified by applying the migration to a scratch Postgres database and pasting the resulting schema into the verification report (PRD 5)."
      - "invite_codes.code carries a UNIQUE constraint that is actually enforced: verified by inserting the same code value twice against the scratch database and confirming the second insert fails with a unique-violation error. Reading the schema is not sufficient; the duplicate insert must be attempted."
      - "invite_codes.issued_to_user_id and invite_codes.grants_companion_of are both nullable and both reference users.id, verified by inserting a bulk code supplying neither (must succeed) and a code whose issued_to_user_id names a non-existent user id (must fail on the foreign key) -- both cases run (PRD 5)."
      - "registrations.invite_code_id is a real FOREIGN KEY to invite_codes.id after this migration, verified by attempting to insert a registration whose invite_code_id names a non-existent invite_codes row and confirming it FAILS -- an insert that succeeds proves the FK was not added and is a FAIL of this criterion (REQ-011.md 11 open question 3, closed here)."
      - "Deleting an invite_codes row that a registration references is refused by the database, verified by constructing exactly that pair and attempting the delete (the restrict posture this requirement's design states)."
      - "The code generator draws from a cryptographically secure source: verified by reading the generation code (it must call crypto.randomBytes or an equivalent CSPRNG -- a `git grep` for Math.random in the generator's module must return no hit) AND by generating 10000 codes in a test and asserting zero collisions (security-invariants.md S4)."
      - "The generated code contains only characters from the design artefact's stated typeable alphabet, and the artefact states the resulting entropy in bits with the arithmetic shown -- verified by generating 1000 codes, asserting every character is in the alphabet, and reading the artefact's entropy calculation (S4 plus story B7's 'or by typing it')."
      - "The design artefact under docs/agents/design/ states: how personal, bulk and companion codes are composed from the columns (not a type enum); which column combinations are legal; and the FR-4 'configurable per event' eligibility open question as an unresolved question routed to REQ-038, not a decision made here."
      - "No column named no_show, waitlist_position, seats_taken, registration_open or finished is added by this migration, verified by grepping it for each of the five names (PRD 5)."
    depends_on: [REQ-032]

  - id: REQ-034
    title: Registration into 'requested' for an approval-gated event, with the decision-pending confirmation
    owner: BACKEND-DEV
    status: done
    description: >
      Implements the MEMBER-FACING half of Release 2's approval flow: USER-STORIES B6 /
      STORY-DETAILS B6 (Ask for a seat at a curated event), and PRD FR-4's
      `requires_invite=false, requires_approval=true` row ("requested -> organizer
      decides"). Split from REQ-035 (the organizer's decision surface) because B6 and
      F3 are two separate stories in USER-STORIES, sit on opposite sides of the
      request, and each is independently testable: this one is verified by reading a
      registrations row and a message; REQ-035 is verified by an organizer action and
      an audit row.

      VERIFIED CURRENT STATE (read from apps/bot/src/domain/registration.ts at drafting
      time -- re-verify before changing): decideRegistrationOutcome() already reads
      Event.requires_approval and already returns a distinct
      `{ kind: "requires-approval" }` outcome, and REQ-020's own acceptance criteria
      required that this be "a clear refusal naming the reason rather than an
      admission", because approvals were Release 2. THIS REQUIREMENT REPLACES THAT
      DELIBERATE PLACEHOLDER REFUSAL with the real behaviour. That is not a
      contradiction of done REQ-020 -- REQ-020's description states the refusal exists
      precisely so Release 2 could fill it in ("this requirement must nonetheless not
      make them impossible"). The `requested` value already exists in the `admission`
      pgEnum (apps/bot/src/db/schema.ts) and in the AdmissionState union, so no schema
      change is needed here and none may be added.

      Scope of work:
      - For an event with requires_approval=true and requires_invite=false, registering
        creates the registration with admission='requested' instead of refusing
        (PRD FR-4, PRD 6's state machine: register -> requested -> admitted | rejected).
      - The confirmation TELLS THE PERSON A DECISION WILL FOLLOW AND WHEN BY
        (STORY-DETAILS B6 flow step 3). "When by" is derivable from data the schema
        already holds -- Event.registration_closes_at is the point past which
        REQ-036's auto-decline fires, so it is the honest answer and no new field is
        needed. If registration_closes_at is null for the event, the message states
        the decision timing in terms of the event start instead; the design artefact
        states which, rather than leaving the null case to the handler.
      - THE CAPACITY QUESTION, resolved explicitly: a 'requested' registration does NOT
        occupy a seat. security-invariants.md S7 and PRD 12.2 define
        seats_taken = count(admission='admitted') and nothing else; PRD 6's state
        machine routes an approval-gated registration to `requested` with no capacity
        check on that path at all, and STORY-DETAILS F3's refusal ("Approving beyond
        capacity without an explicit override") places the capacity decision at
        APPROVAL time, which is REQ-035's scope. So requests are accepted regardless
        of seats remaining, and this requirement adds NO capacity check to the
        requested path. Stated explicitly because silently adding one would break
        F3's own refusal, and silently omitting it without saying so would look like
        an oversight.
      - REFUSAL (STORY-DETAILS B6): requesting twice is refused. The existing
        `{ kind: "already-registered" }` outcome plus the UNIQUE(event_id, user_id)
        constraint from REQ-011 already cover this; this requirement must show the
        person their CURRENT pending status rather than a bare error, matching
        REQ-020's treatment of the same case.
      - The event card and /events (REQ-017) and /my (REQ-024) must render a
        `requested` registration's state plainly rather than as a blank or an
        admitted-looking row -- /my already handles rejected and withdrawn per
        REQ-024's no-dead-ends criterion, and `requested` joins that set.
      - NO QR TOKEN is issued at request time. PRD FR-14 issues qr_token "on
        admission", REQ-024's own criteria require that waitlisted/withdrawn/rejected
        rows show no QR, and a pass for a seat nobody has granted yet would be exactly
        the single-purpose-token violation security-invariants.md S4 names. The token
        is issued when REQ-035 approves.
      - Every admission-state write is a status change and writes exactly one AuditLog
        row (PRD 12.7, security-invariants.md S8).
      - The request-received confirmation is transactional (PRD 9) and goes through
        REQ-025's ledger where it is a scheduled/repeatable send; a synchronous
        reply to the person's own tap is a direct send, the same distinction REQ-018's
        description drew for its assignment notification.
    acceptance_criteria:
      - "Registering for an event with requires_approval=true and requires_invite=false creates exactly one registrations row with admission='requested' -- verified by reading the row back against a live instance, replacing the placeholder refusal REQ-020 shipped (PRD FR-4, PRD 6)."
      - "The confirmation message states both that a decision will follow and by when, and the stated time matches the event's registration_closes_at rendered in the chapter's timezone -- verified by reading the captured message and comparing against the events row (STORY-DETAILS B6). Running this check with registration_closes_at NULL exercises the other branch and must produce the design artefact's stated fallback, not an empty or malformed date."
      - "Requesting a second time yields the person's CURRENT pending status and leaves exactly one registrations row for that (event_id, user_id), verified by querying the row count after the second attempt (STORY-DETAILS B6's refusal, PRD 12.1)."
      - "A request succeeds even when the event's admitted count already equals capacity: verified by constructing an event at full capacity with requires_approval=true, requesting, and confirming admission='requested' rather than 'waitlisted' or a refusal -- a run against an event with seats remaining does not exercise this and is not evidence (PRD 6, S7)."
      - "The registrations row created by a request has qr_token NULL, and /my shows that row with its pending state and NO QR image -- both verified by reading the row and rendering /my (PRD FR-14, security-invariants.md S4, REQ-024)."
      - "Creating a request writes exactly one audit_log row naming the actor, action, entity and entity id -- counted before and after; zero rows or two rows both fail (PRD 12.7, security-invariants.md S8)."
      - "An event with requires_approval=false is unaffected: registering for it still admits or waitlists exactly as REQ-020 and REQ-021 do, verified by re-running one admitted and one waitlisted case (no regression)."
    depends_on: [REQ-033]

  - id: REQ-035
    title: Organizer approve/reject surface for pending requests, with reason, notification and logged capacity override
    owner: BACKEND-DEV
    status: done
    description: >
      Implements USER-STORIES F3 / STORY-DETAILS F3 (Decide who comes in) -- the
      organizer-facing half of the approval flow REQ-034 opens -- plus the
      approve/reject part of PRD FR-13 ("approve/reject with reason"). Sequenced after
      REQ-034 because there is nothing to decide on until requests can exist.

      Scope of work:
      - An organizer lists the PENDING requests (admission='requested') for an event in
        their own chapter, each row showing the person's company, position, student flag
        and source (STORY-DETAILS F3 flow step 1, USER-STORIES F3's Confirmation
        "each person's relevant details"). Filter and search for larger rooms
        (STORY-DETAILS F3's "Also").
      - APPROVE: requested -> admitted, the person is notified, and the qr_token is
        issued at this moment (PRD FR-14 "on admission each registration gets a
        qr_token") using the existing generateQrToken() in
        apps/bot/src/domain/registration.ts -- not a second generator.
      - REJECT WITH A REASON: requested -> rejected, and the person is notified
        respectfully and offered the onward path (STORY-DETAILS B6: "Rejected -> told
        respectfully, offered the wishlist"; JOURNEY-AUDIT's no-dead-ends principle).
        See this requirement's WISHLIST OFFRAMP note below for what "offered the
        wishlist" means in Release 2.
      - CAPACITY AT APPROVAL (STORY-DETAILS F3's explicit refusal "Approving beyond
        capacity without an explicit override"; PRD 12.2; security-invariants.md S7):
        approving when admitted count already equals capacity requires an EXPLICIT,
        CONFIRMED override that writes an AuditLog row. This is the same override
        shape REQ-030 already implements for walk-ins and REQ-029 for check-in
        override; the design artefact states whether the existing mechanism is reused
        or why it cannot be. The approval write is ATOMIC against the capacity check
        for the same reason REQ-020's registration is (S7) -- two organizers approving
        the last seat concurrently must not both succeed without an override.
      - AUTHORIZATION (security-invariants.md S2): organizer-only, scoped to their own
        chapter, checked ON THE HANDLER and not only on the menu that renders the
        button. apps/bot/src/domain/eventAuthorization.ts's
        requireOrganizerForChapter() is the existing mechanism. An EventStaff member
        must be refused -- S2 confines staff to check-in screens, and this is a
        registration-decision screen, not one.
      - PRIVACY (security-invariants.md S3): the request list shows company, position,
        student flag and source -- the fields F3 names -- and MUST NOT show phone or
        email. S3 names a list view as exactly the shape through which this leaks, and
        REQ-028's check-in list already carries the identical constraint.
      - Both notifications are transactional (PRD 9, S10): the admission result reaches
        the person regardless of broadcast_opt_in, through REQ-025's ledger with a
        distinct kind per outcome so an approve and a later state change cannot
        collide on one ledger key. The 'admission_result' NotificationKind already
        exists in apps/bot/src/domain/notification.ts.
      - Every approve and every reject writes exactly one AuditLog row (PRD 12.7, S8),
        and USER-STORIES section 11 lists the audit log as the enabler "first needed
        by F3" -- it exists as of REQ-011, so this requirement consumes it.

      WISHLIST OFFRAMP IN RELEASE 2 -- DECIDED HERE, NOT SILENTLY DROPPED AND NOT
      SILENTLY PULLED FORWARD. STORY-DETAILS B6, B7, B8 and B9 all end their refusal
      paths with "offered the wishlist", and JOURNEY-AUDIT's J7/J2 make the offramp a
      stated principle. But the Wishlist entity itself is story G4, which USER-STORIES
      marks R3, PRD 4 places in Release 3 ("chapter interest"), and REQ-032's release
      boundary note assigns to the Release 3 WF-01 run. There is NO wishlist table in
      apps/bot/src/db/schema.ts and REQ-017's own acceptance criteria forbid creating
      one ahead of its requirement. DECISION, applying to REQ-035, REQ-036, REQ-038,
      REQ-039 and REQ-041 alike: every Release 2 refusal path ends with a CONCRETE
      ONWARD PATH the already-built surfaces can deliver -- the upcoming-events list
      from REQ-017, exactly as REQ-027's cancellation message already does -- and NO
      Wishlist row, table, migration or "register interest" capture is created. The
      offramp principle is honoured; the specific G4 mechanism is not pulled forward.
      When Release 3 lands G4, the wishlist offer replaces the events-list offer on
      these same paths, and that replacement is Release 3's scope, stated here so it is
      a known, deliberate substitution rather than a gap someone later discovers.

      NOTE ON WHAT THIS REQUIREMENT DOES NOT COVER: the 48h-urgent flag and the
      auto-decline at registration close (STORY-DETAILS F3's "Also",
      JOURNEY-AUDIT J3) are REQ-036's scope -- they are scheduled-job behaviour, not
      decision-surface behaviour, and mixing a job runner into this requirement would
      push it past one agent turn.
    acceptance_criteria:
      - "Approving a request sets admission='admitted', issues a non-null qr_token, and notifies the person -- verified by reading the row back and reading the captured message; the qr_token must be produced by the existing generateQrToken() in apps/bot/src/domain/registration.ts, confirmed by reading the call site (PRD FR-14, no second generator)."
      - "Rejecting a request sets admission='rejected', notifies the person, and the captured message contains BOTH the organizer's stated reason AND an onward path pointing at the upcoming-events list -- verified by reading the captured message text (STORY-DETAILS F3, B6, and this requirement's wishlist-offramp decision)."
      - "No wishlist table, migration or row is created by this requirement, verified by grepping every apps/bot migration and the schema for 'wishlist' and finding zero matches (PRD 4 -- G4 is Release 3)."
      - "Approving when admitted count already equals capacity requires an explicit confirmation: dismissing it leaves admission='requested' unchanged, and confirming sets 'admitted' AND writes exactly one audit_log row recording the override -- all three facts verified by constructing the at-capacity state, running both branches, and counting audit rows (STORY-DETAILS F3's refusal, PRD 12.2, security-invariants.md S7)."
      - "Two organizers approving the last remaining seat concurrently never produce an admitted count above capacity without an override -- verified by an automated concurrency test using the REQ-009 Vitest runner against a real Postgres, repeated at least 20 times with zero silent over-admissions (security-invariants.md S7). A sequential two-call test does not exercise this and is not evidence."
      - "A member, and separately an EventStaff member for that same event, each invoking the approve handler DIRECTLY (by constructing the callback data the organizer menu would produce, not by tapping a rendered button) are both refused and the registration is unchanged -- both cases run and the row re-read (security-invariants.md S2's named negative case)."
      - "An organizer of chapter A invoking the approve handler for a chapter B event is refused, verified by constructing two chapters, one organizer and one request (security-invariants.md S2)."
      - "The rendered request list contains no phone number and no email address -- verified by constructing requests where every requester has both stored, rendering the list as an organizer, and grepping the captured output for each stored value (security-invariants.md S3)."
      - "The approval and the rejection notification each reach a user with broadcast_opt_in=false, verified by setting that flag before each (PRD 9, security-invariants.md S10 -- admission results are transactional)."
      - "Each approve and each reject writes exactly one audit_log row, counted before and after each (PRD 12.7, security-invariants.md S8)."
    depends_on: [REQ-034]

  - id: REQ-036
    title: Pending-request urgency flag at T-48h and honest auto-decline at registration close
    owner: BACKEND-DEV
    status: done
    description: >
      Closes JOURNEY-AUDIT's J3 ("An approval request can hang forever"), which the
      audit files as acceptance criteria on BOTH B6 and F3 rather than as its own
      story -- which is why it lands as its own requirement between the two flows
      rather than inside either. STORY-DETAILS B6 states it from the member's side
      ("Still undecided when registration closes -> AUTO-DECLINED with an honest
      message; nobody waits past the event") and STORY-DETAILS F3 from the
      organizer's ("Requests still pending 48h before the start are flagged urgent.
      Anything undecided when registration closes is auto-declined honestly").

      Split from REQ-035 because this is scheduled-job work -- it uses REQ-025's job
      runner (apps/bot/src/scheduler/runner.ts) and its send-once ledger, which
      REQ-035's synchronous decision surface does not touch at all.

      Scope of work:
      - A scheduled job registered with the existing startScheduledJobs() runner in
        apps/bot/src/scheduler/runner.ts, alongside the reminder, feedback and no-show
        jobs already registered there -- no new scheduling mechanism (PRD 1: "one
        Postgres and one bot process are sufficient. Do not add infrastructure").
      - URGENCY, at T-48h before starts_at: every event with requests still in
        admission='requested' surfaces those requests to that event's organizers as
        urgent. The design artefact states WHERE they are surfaced -- a notification to
        the organizers, a marker on REQ-035's request list, or both -- and states it
        concretely enough to be checked, rather than leaving "flagged urgent" to the
        implementer's reading.
      - AUTO-DECLINE, at registration_closes_at: every remaining
        admission='requested' registration transitions to 'rejected' and the person is
        told honestly -- the message says the request was not decided in time and the
        event's registration has closed, and offers the onward path (the
        upcoming-events list, per REQ-035's stated wishlist-offramp decision, which
        this requirement inherits unchanged and does not re-decide).
      - HONEST WORDING (STORY-DETAILS B6's "with an honest message"): the message must
        not imply the person was individually judged and found wanting, because they
        were not -- nobody decided. This is copy in the same class as REQ-014's consent
        wording and REQ-032's blame-free no-show wording: the implementing agent
        writes plain factual wording through REQ-013's catalog mechanism (ru and en,
        no hardcoded literals in the handler) and records in its handoff result that
        the exact copy is provisional pending the product owner.
      - An event with registration_closes_at NULL has no close moment for the
        auto-decline to key on. The design artefact must state what happens to a
        pending request on such an event -- the ends_at fallback, or no auto-decline at
        all with the urgency flag as the only backstop -- and state the reasoning. It
        must NOT add a column to make the null case go away; PRD 5 lists
        registration_closes_at as it is, and the schema already has it nullable
        (apps/bot/src/db/schema.ts's events table).
      - IDEMPOTENCY (PRD 12.8, security-invariants.md S9): both sends go through
        REQ-025's ledger with distinct kinds, so a restart mid-batch or a repeated job
        tick sends nothing twice. The auto-decline's state write is itself
        self-guarding the way REQ-023's promotion is -- a row already moved to
        'rejected' can never match the still-requested selection filter again -- and
        the design artefact states that, so the ledger and the state guard are
        understood as two mechanisms and not mistaken for one.
      - Both sends are transactional (PRD 9, S10) and reach a user regardless of
        broadcast_opt_in. `blocked` users are skipped, as REQ-025's send API already
        does for every caller.
      - Each auto-decline is a status change and writes exactly one AuditLog row
        (PRD 12.7, S8), with the actor recorded as the system rather than a person --
        audit_log.actor_user_id is already nullable for exactly this case
        (apps/bot/src/db/schema.ts's comment: "a genuinely system-initiated action
        (e.g. a scheduled job) has no human actor to attribute").
    acceptance_criteria:
      - "With an event exactly 48h from starts_at and two registrations still in admission='requested', the urgency job surfaces both to that event's organizers through the mechanism the design artefact names -- verified by running the job at that constructed boundary and capturing the surfaced result; a run with the event more than 48h out must surface nothing, and both timings are run (STORY-DETAILS F3)."
      - "At registration_closes_at, every remaining admission='requested' registration becomes 'rejected' and each person receives exactly one message -- verified by constructing three pending requests plus one already-approved and one already-rejected registration, running the job, and confirming exactly three transitions and three sends, with the approved and previously-rejected rows untouched (STORY-DETAILS B6, F3)."
      - "The auto-decline message states that no decision was reached in time and contains no wording attributing the outcome to the person's own merits, and it offers the upcoming-events list as an onward path -- verified by reading the captured message text (STORY-DETAILS B6's 'honest message', REQ-035's offramp decision)."
      - "Running the auto-decline job, KILLING the process, restarting it, and running the job again for the same event delivers exactly the original number of messages and performs no further transitions -- verified by counting captured sends and re-reading every row across both runs (PRD 12.8, PRD 13 criterion 6, security-invariants.md S9). A single-run test does not exercise restart-safety and is not evidence."
      - "An event whose registration_closes_at is NULL behaves exactly as the design artefact states for that case, verified by constructing that event with a pending request and running the job -- an unhandled crash, a silent skip the artefact does not describe, or a new column added to avoid the case all fail this criterion."
      - "Each auto-decline writes exactly one audit_log row, counted before and after, with actor_user_id NULL to mark it system-initiated (PRD 12.7, security-invariants.md S8)."
      - "Both the urgency message and the auto-decline message reach a user with broadcast_opt_in=false and reach neither a user with blocked=true, verified by setting each flag and re-running (PRD 9, security-invariants.md S10)."
      - "Every user-facing string added by this requirement resolves through REQ-013's catalog mechanism in both ru and en, verified by grepping the handler and the job for literal user-facing text and by the existing catalog key-set parity check; and the handoff result records that the auto-decline wording is provisional pending the product owner."
    depends_on: [REQ-035]

  - id: REQ-037
    title: Organizer issues personal, bulk and companion invite codes and sees who has used each
    owner: BACKEND-DEV
    status: in_progress
    description: >
      Implements USER-STORIES F4 / STORY-DETAILS F4 (Hand out invitations) -- the
      issuing side of PRD FR-5. Sequenced before REQ-038's redemption because a code
      must exist before it can be redeemed, and STORY-DETAILS F4 says so directly
      ("Moves. Nothing directly; drives B7 and B8").

      Consumes REQ-033's invite_codes table and code generator unchanged; this
      requirement adds NO schema and MUST NOT add a column. If a field turns out to be
      missing, that is a BLOCKER to report against REQ-033, not a licence to add one
      here -- the same rule REQ-026 states for REQ-011's agenda shape.

      Scope of work:
      - An organizer issues a code for an event in THEIR OWN chapter, in the three
        shapes PRD FR-5 and story F4 name, composed from REQ-033's columns:
        PERSONAL -- issued_to_user_id set, max_uses=1, works once and only for that
        event; BULK -- issued_to_user_id null, max_uses=N (STORY-DETAILS F4's example:
        a partner's team); COMPANION -- grants_companion_of set to the host user, which
        is what makes the redeemer's registration carry invited_by_user_id = host
        (PRD FR-5, and DESIGN-REVIEW F10's decision that the +1 mechanic and referral
        reporting are ONE field, not two mechanics).
      - A personal code may be issued to a person WHO HAS NEVER OPENED THE BOT. PRD 5
        and DESIGN-REVIEW both make User.tg_id nullable for exactly this, and
        apps/bot/src/db/schema.ts already has tgId nullable with a unique index (which
        REQ-010's own acceptance criteria proved does not collide across multiple NULL
        rows). Creating that pre-arrival User row is REQ-040's invitation-list scope;
        this requirement must simply accept an issued_to_user_id whose user has
        tg_id NULL and not assume a Telegram account exists.
      - THE SHAREABLE LINK: the code is presented to the organizer as a
        `?start=i_<code>` deep link (PRD FR-5, PRD 8's `i_` deep-link prefix) plus the
        bare code for typing, since story B7 requires both redemption routes. The bot
        does not send it to the invitee -- see the REFUSAL below.
      - EXPIRY DEFAULTS TO THE EVENT START (STORY-DETAILS F4's "Also"), i.e.
        expires_at defaults to Event.starts_at, overridable by the organizer at issue
        time. This is a default, not a constraint.
      - CODES WORK ON ANY EVENT (STORY-DETAILS F4, DESIGN-REVIEW F9): issuing a code
        for an OPEN event is legal and is not an error -- on an open event the code
        simply carries attribution (it sets invite_code_id and, for a companion code,
        invited_by_user_id). This requirement must not gate issuing on
        requires_invite=true.
      - USAGE VISIBILITY (USER-STORIES F4's fourth Confirmation, "Given I look at a
        code, then I can see who has used it"): the organizer sees, per code, its
        used_count and WHO redeemed it -- derived by joining registrations on
        invite_code_id, not by adding a redemption-list column. Personal data shown is
        bounded by security-invariants.md S3: name and company, never phone or email,
        matching what REQ-028's check-in list and REQ-035's request list already show.
      - REFUSALS: codes for finished or cancelled events are refused (STORY-DETAILS
        F4's stated refusal). And per STORY-DETAILS F9's refusal -- stated here too
        because this is where the temptation actually arises -- THE BOT DOES NOT SEND
        THE CODE TO THE INVITEE ON THE ORGANIZER'S BEHALF: Telegram does not permit a
        bot to message someone who has never started it, so the organizer shares the
        link themselves by DM, email or in person. A design proposing an
        outbound-to-a-stranger send is contradicting a platform fact, not choosing a
        product option.
      - AUTHORIZATION (security-invariants.md S2): organizer-only, own-chapter,
        checked on the HANDLER via
        apps/bot/src/domain/eventAuthorization.ts's requireOrganizerForChapter(), with
        EventStaff refused. Every issue and every revoke/edit writes exactly one
        AuditLog row (PRD 12.7, S8) -- an invite code is an access grant, so its
        creation is precisely the kind of action S8 exists to record.
    acceptance_criteria:
      - "Issuing a personal code creates one invite_codes row with issued_to_user_id set to the named user and max_uses=1; issuing a bulk code with N uses creates a row with issued_to_user_id NULL and max_uses=N; issuing a companion code creates a row with grants_companion_of set to the host -- all three verified by reading the rows back (PRD FR-5, story F4)."
      - "Issuing a code without specifying an expiry sets expires_at equal to that event's starts_at, and supplying an explicit expiry overrides it -- both verified by reading the rows (STORY-DETAILS F4)."
      - "Issuing a personal code to a user whose tg_id is NULL succeeds, verified by constructing exactly that user row first (PRD 5, DESIGN-REVIEW F11) -- a run against a user who has opened the bot does not exercise this and is not evidence."
      - "Issuing a code for an OPEN event (requires_invite=false, requires_approval=false) succeeds rather than being refused, verified by constructing that event and issuing (STORY-DETAILS F4, DESIGN-REVIEW F9)."
      - "Issuing a code for a cancelled event and for an event whose ends_at has passed are each refused with the reason stated, and no invite_codes row is created -- both constructed and the table re-counted (STORY-DETAILS F4's refusal)."
      - "The organizer's view of a code shows its used_count and the name and company of each person who redeemed it, and contains NO phone number and NO email -- verified by constructing redeemers with both stored and grepping the captured output for each stored value (USER-STORIES F4, security-invariants.md S3)."
      - "The redeemer list is derived by querying registrations on invite_code_id: verified by inserting a redeeming registration directly in the database and confirming the organizer's view reflects it on the next read with no write to the invite_codes row (checked by comparing that row's updated timestamp before and after)."
      - "A member, and separately an EventStaff member, each invoking the issue-code handler directly are refused and no invite_codes row is created -- both cases run and the table re-counted (security-invariants.md S2); an organizer of chapter A issuing for a chapter B event is likewise refused."
      - "`git grep` over apps/bot finds no code path that sends an invite code to the issued_to_user, and the design artefact states that the organizer shares it themselves because a bot cannot message a person who has never started it (STORY-DETAILS F9's refusal)."
      - "Each code issue writes exactly one audit_log row naming the actor, action, entity and entity id, counted before and after (PRD 12.7, security-invariants.md S8)."
    depends_on: [REQ-033]

  - id: REQ-038
    title: Invite code redemption via i_ deep link or typed code, with the full validation table and past-attendee eligibility
    owner: BACKEND-DEV
    status: pending
    description: >
      Implements USER-STORIES B7 / STORY-DETAILS B7 (Use my invitation) and PRD FR-4's
      two requires_invite rows: `requires_invite=true, requires_approval=false` (valid
      code -> admitted; no code -> onward path) and `requires_invite=true,
      requires_approval=true` (valid code -> requested -> organizer decides). It is the
      redemption counterpart to REQ-037's issuing, and it replaces the placeholder
      `{ kind: "requires-invite" }` refusal REQ-020 shipped in
      apps/bot/src/domain/registration.ts -- deliberately, exactly as REQ-034 replaces
      the requires-approval one, and for the reason REQ-020's own description gives.

      Scope of work:
      - REDEMPTION BY BOTH ROUTES (story B7): the `?start=i_<code>` deep link (PRD 8
        lists `i_` alongside the already-implemented `e_` and `ci_` prefixes in
        apps/bot/src/handlers/start.ts) AND by typing the code. Both resolve to one
        validation path -- two entry points, one decision function, following the
        framework-free-domain-logic rule decisions/0004 binds all bot work to.
      - THE VALIDATION TABLE, implemented case by case, each a distinct verifiable
        behaviour (STORY-DETAILS B7 flow step 2, security-invariants.md S4):
        (1) the code EXISTS; (2) it is NOT EXPIRED (now < expires_at); (3) USES REMAIN
        (used_count < max_uses); (4) it BELONGS TO THIS EVENT; (5) if PERSONAL
        (issued_to_user_id non-null) it was ISSUED TO THIS REDEEMER.
      - THE TWO NAMED REFUSALS (STORY-DETAILS B7): a code for a DIFFERENT event, and a
        PERSONAL CODE REDEEMED BY SOMEONE ELSE. The second is the security-sensitive
        one -- a personal code is a named grant, and honouring it for whoever holds the
        string would turn every forwarded message into a transferable ticket. It is
        security-invariants.md S4's negative case ("a code accepted past expires_at or
        beyond max_uses") extended to identity, and SECURITY-REVIEWER gates it.
      - OUTCOME: a valid code admits (seats permitting) or, when the event ALSO has
        requires_approval=true, produces admission='requested' routed into REQ-035's
        organizer decision surface -- PRD FR-4's fourth row, and STORY-DETAILS B7's
        "(or `requested` if approval is also on)". A valid code on a FULL event
        waitlists like any other registration; a code buys past the invite gate, not
        past capacity (PRD 12.2, security-invariants.md S7 -- capacity holds).
      - used_count INCREMENTS ATOMICALLY WITH THE REGISTRATION WRITE (story B7 step 4).
        Read-then-write is the defect: two people redeeming the last use of a bulk code
        concurrently must not both succeed. This is the same atomicity property
        REQ-020's capacity check has and security-invariants.md S7 states, applied to a
        different counter. The registration and the increment are one transaction -- a
        registration created without its increment, or an increment without its
        registration, are both defects.
      - PAST-ATTENDEE ELIGIBILITY (PRD FR-4, story B7's third Confirmation): a user who
        has checked_in_at on any past event satisfies requires_invite WITHOUT a code.
        The derivation is a query over registrations, never a stored "is_returning"
        flag (PRD 5's computed-not-stored discipline; FR-16's "Returning" factsheet
        line is likewise computed). THE OPEN QUESTION REQ-033 ROUTED HERE MUST BE
        RESOLVED IN THIS REQUIREMENT'S DESIGN ARTEFACT AND STATED, NOT SILENTLY
        DECIDED IN CODE: FR-4 calls this rule "configurable per event", but PRD 5's
        Event entity lists no such flag and inventing an unlisted Event column is what
        PRD's closing rule forbids. The implementing chain must either (a) apply the
        rule uniformly to every requires_invite event and state that FR-4's
        "configurable" is deferred until a real need for per-event variation appears,
        or (b) treat the per-event flag as an architecturally significant addition
        needing a docs/agents/decisions/ record before any column is added. It must
        not add the column silently under either reading. Whichever is chosen, the
        artefact states it and the reasoning.
      - REFUSALS OFFER AN ONWARD PATH (STORY-DETAILS B7: "Expired, spent or unknown ->
        said plainly, wishlist offered"): expired, spent, unknown and wrong-event codes
        each produce their own stated reason plus the upcoming-events list, per
        REQ-035's wishlist-offramp decision, which this requirement inherits unchanged
        -- no Wishlist row or table is created here either.
      - CONSENT AND PROFILE ORDER (security-invariants.md S1): redeeming a code does
        not bypass REQ-019's profile-and-consent gate. A redeemer without
        consent_pd_at set is taken through consent and profile capture exactly as
        REQ-019 defines, and nothing about them is stored before consent. A code is an
        access grant, never a consent substitute.
      - Every admission-state write writes exactly one AuditLog row (PRD 12.7, S8).
    acceptance_criteria:
      - "Redeeming a valid code for a requires_invite event with seats remaining, BOTH via `?start=i_<code>` and by typing the code, each set admission='admitted' and registrations.invite_code_id to that code's id and increment invite_codes.used_count by exactly one -- both entry points run and the rows read back (story B7, PRD FR-5)."
      - "A PERSONAL code (issued_to_user_id set) redeemed by a DIFFERENT user is refused, no registration is created, and used_count is unchanged -- verified by constructing the code for user A, redeeming as user B, and re-reading both tables (STORY-DETAILS B7's explicit refusal, security-invariants.md S4). A run where the redeemer is the issuee does not exercise this and is not evidence."
      - "An expired code (expires_at in the past), a spent code (used_count = max_uses), an unknown code string, and a code whose event_id is a DIFFERENT event are each refused with their own stated reason plus the upcoming-events list as an onward path, and none creates a registration or changes used_count -- all four constructed and run (STORY-DETAILS B7, security-invariants.md S4)."
      - "Two concurrent redemptions of the LAST remaining use of a bulk code result in exactly one successful registration and used_count ending at max_uses, never above it -- verified by an automated concurrency test using the REQ-009 Vitest runner against a real Postgres, repeated at least 20 times (security-invariants.md S4, S7). A sequential test does not exercise this and is not evidence."
      - "Redeeming a valid code for an event that is BOTH requires_invite and requires_approval produces admission='requested' (not 'admitted') and the request appears in REQ-035's organizer list -- verified by constructing both flags and reading the row (PRD FR-4's fourth row)."
      - "Redeeming a valid code for a requires_invite event that is at full capacity produces admission='waitlisted', not 'admitted' -- verified by constructing the at-capacity state (PRD 12.2, security-invariants.md S7: a code does not buy past capacity)."
      - "A user with checked_in_at on a past event registering for a requires_invite event WITHOUT any code is admitted, and a user with no past check-in is refused with the onward path -- both constructed and run (PRD FR-4, story B7). The eligibility derivation is a query: `git grep` over apps/bot finds no stored column, cache or flag holding returning/attended-before status."
      - "The design artefact states which resolution it takes for FR-4's 'configurable per event' eligibility question and the reasoning, and no new column is added to the events table by this requirement -- verified by reading the artefact and grepping every apps/bot migration for a new events column."
      - "A redeemer who has not yet given personal-data consent is taken through REQ-019's consent and profile flow, and declining consent leaves zero profiles rows and no registration for that user despite the valid code -- verified by querying both tables after the decline (security-invariants.md S1)."
      - "No wishlist table, migration or row is created by this requirement, verified by grepping every apps/bot migration and the schema for 'wishlist' (PRD 4 -- G4 is Release 3)."
      - "Each successful redemption writes exactly one audit_log row, counted before and after (PRD 12.7, security-invariants.md S8)."
    depends_on: [REQ-037, REQ-035]

  - id: REQ-039
    title: Companion (+1) registration through a companion code, with consent before storage and invited_by_user_id attribution
    owner: BACKEND-DEV
    status: pending
    description: >
      Implements USER-STORIES B8 / STORY-DETAILS B8 (Bring someone with me) -- the `+1`
      half of PRD FR-5. USER-STORIES B8 states "Depends on B7" outright, so this
      requirement is sequenced after REQ-038 and reuses its validation path rather than
      forking a second one.

      Scope of work:
      - A host holding a COMPANION code (invite_codes.grants_companion_of = host user
        id, issued by REQ-037) FORWARDS THE LINK to their guest. The guest opens it and
        redeems through REQ-038's validation table -- same five checks, no parallel
        implementation.
      - THE ATTRIBUTION: a code with grants_companion_of = X sets
        Registration.invited_by_user_id = X on the resulting registration (PRD FR-5).
        DESIGN-REVIEW F10 is explicit that this ONE field is both the `+1` mechanic and
        referral reporting -- "the `+1` mechanic and referral analytics are now the same
        feature". No companion-specific column, no separate referral table, no second
        mechanic may be introduced. registrations.invited_by_user_id already exists in
        apps/bot/src/db/schema.ts, so this requirement adds no schema.
      - THE SHORT PROFILE (STORY-DETAILS B8 step 2, USER-STORIES B8's Conversation):
        the companion completes NAME, PHONE and COMPANY -- not the full REQ-019 form.
        This is the same reduced field set REQ-030's walk-in flow already uses at the
        door, and the design artefact states whether REQ-030's collection path is
        reused or why it cannot be, rather than writing a third profile-capture flow.
        Note that phone is required here even though PRD 5 marks it optional generally
        -- that is not a contradiction, it is this flow's own minimum, exactly as
        REQ-030's description already reasons for the door.
      - CONSENT BEFORE STORAGE -- THE SECURITY-CRITICAL PROPERTY OF THIS REQUIREMENT.
        STORY-DETAILS B8's second explicit refusal is "Storing anything before
        consent", and security-invariants.md S1's negative case names precisely this
        shape of failure. The companion is a person the bot has never met, arriving
        through someone else's link, and the temptation to record the forwarding
        relationship or a partial name before the consent step is exactly the failure
        mode. NOTHING -- not a User row carrying their name, not a Profile row, not the
        invited_by relationship, not a partial-form draft -- is written before
        consent_pd_at is set. This differs from REQ-019's resumable partial-write form,
        where consent is already established BEFORE the first partial write; here
        consent comes first in the flow and there is no legitimate pre-consent write at
        all. The design artefact states that distinction explicitly so an implementer
        does not reach for REQ-019's write-as-you-go pattern by analogy.
      - CAPACITY: companions occupy a NORMAL seat (PRD FR-5, STORY-DETAILS B8's
        "Also"). A full event waitlists the companion like anyone else -- story B8's
        second Confirmation states this directly. There is no reserved-seat mechanic
        and none may be invented.
      - ONE USE UNLESS THE ORGANIZER SAID OTHERWISE (STORY-DETAILS B8) -- which is just
        max_uses on REQ-033's row, defaulting to 1 for a companion code at REQ-037's
        issue time. Reusing a spent code is B8's first stated refusal and is already
        REQ-038's spent-code case; this requirement must not implement a second
        spent-code check with different behaviour.
      - BOTH ARE TOLD (STORY-DETAILS B8 step 4): the guest gets their own admission
        result, and the HOST is told their guest is coming. Both are transactional
        (PRD 9, S10) and go through REQ-025's ledger. The host notification carries the
        guest's name and company only -- security-invariants.md S3 bounds what one
        person is shown about another, and the host is not an organizer.
      - The guest is a person who may never have opened the bot before, so /start's
        existing REQ-014 first-contact path and REQ-019's consent gate are the entry,
        not a bypass around them.
    acceptance_criteria:
      - "A guest redeeming a companion code whose grants_companion_of is host H gets a registration with invited_by_user_id = H's user id and invite_code_id set to that code -- verified by reading the row (PRD FR-5, DESIGN-REVIEW F10)."
      - "`git grep` over apps/bot finds no companion-specific column, no referral table and no second attribution field: invited_by_user_id is the only mechanism, and no migration adds another (DESIGN-REVIEW F10)."
      - "Abandoning the companion flow AT OR BEFORE the consent step leaves ZERO new users rows, ZERO new profiles rows and ZERO new registrations rows for that guest -- verified by capturing all three tables' row counts before and after the abandoned flow, run against a guest the bot has never seen (security-invariants.md S1, STORY-DETAILS B8's refusal). A run that reaches consent before abandoning does not exercise this and is not evidence."
      - "Completing the flow collects name, phone and company and nothing further -- verified by walking the whole flow and confirming no experience-level, student-flag or links question is asked (STORY-DETAILS B8, USER-STORIES B8)."
      - "A companion redeeming against a FULL event is waitlisted, not admitted, and not given a seat outside capacity -- verified by constructing the at-capacity state and reading the row (story B8's second Confirmation, PRD 12.2)."
      - "A second person attempting to redeem a single-use companion code is refused and no registration is created, verified by constructing max_uses=1, redeeming once, then attempting again (story B8's third Confirmation, STORY-DETAILS B8's refusal)."
      - "Both the guest and the host receive exactly one message on a successful companion registration, counted from the captured sends; the host's message contains the guest's name and company and contains NEITHER the guest's phone NOR their email -- verified by storing both on the guest and grepping the host's captured message for each value (STORY-DETAILS B8, security-invariants.md S3)."
      - "The guest's phone appears in NO log line and in NO audit_log payload -- verified by grepping the captured process logs and every audit row written during the flow for the exact phone string used (security-invariants.md S11)."
      - "Each companion registration writes exactly one audit_log row, counted before and after (PRD 12.7, security-invariants.md S8)."
    depends_on: [REQ-038]

  - id: REQ-040
    title: Named invitation list with derived invited/opened/registered/attended outreach status and account linking on first contact
    owner: BACKEND-DEV
    status: pending
    description: >
      Implements USER-STORIES F9 / STORY-DETAILS F9 (Run an invitation list) and
      PRD FR-17. RE-EVALUATION R5 records why this story exists at all: the team had
      "no way to run a VIP invitation list", and the clearest ask in the team chat was
      "I need a list of the VIPs we're inviting" -- Uzcard, the fintech association,
      SAP, EPAM, Andersen, none of whom have opened the bot. It replaces the VIP
      spreadsheet.

      Sequenced last among Release 2's build requirements because it composes
      everything before it: it creates pre-arrival Users (REQ-010's nullable tg_id),
      issues personal codes (REQ-037), and reads registration and check-in state
      (REQ-020, REQ-028/REQ-029) to derive its status column.

      Scope of work:
      - An organizer builds a NAMED list for a curated event in their own chapter, and
        adds entries INCLUDING PEOPLE WHO HAVE NEVER OPENED THE BOT. PRD FR-17 and
        DESIGN-REVIEW F11 both make this the whole point of User.tg_id being nullable:
        "a person can exist before they arrive". apps/bot/src/db/schema.ts already has
        users.tgId nullable under a unique index, and REQ-010's acceptance criteria
        already proved two NULL-tg_id rows can coexist -- so the mechanism is built and
        this requirement uses it rather than inventing a parallel "guest" concept,
        which DESIGN-REVIEW F11 explicitly warns against ("which invites a parallel
        guest concept and duplicate identity. One identity, always").
      - Each entry can be issued a PERSONAL CODE through REQ-037's issuing path -- not a
        second code generator and not a second invite_codes-shaped table.
      - THE OUTREACH STATUS -- invited -> opened -> registered -> attended (PRD FR-17,
        story F9's second Confirmation) -- AND THE COMPUTED-NOT-STORED BOUNDARY, which
        this requirement's handoff singles out and which is decided here explicitly
        rather than left to the implementer:
        * REGISTERED is DERIVED: a registration exists for that user and event with a
          live admission. No column.
        * ATTENDED is DERIVED: that registration's checked_in_at is non-null. No
          column. This is the same derivation REQ-028's live counter and REQ-032's
          no-show rule already use.
        * INVITED is a genuinely STORED fact and is justified here as the handoff
          requires: it is the organizer's own act of adding the person to the list,
          which nothing else in the database records. It cannot be derived from the
          existence of an invite code either, because STORY-DETAILS F9 step 2 makes
          issuing a code a SEPARATE step from adding the entry ("Builds a named list
          ... Issues each a personal code"), so an entry can legitimately exist before
          any code does. The list entry row's own existence IS the invited state -- no
          separate boolean.
        * OPENED is the one genuinely open question and MUST NOT be silently resolved.
          "Opened" plausibly means the person started the bot at all, or that they
          opened THIS invitation (the `?start=i_<code>` deep link for their personal
          code). These differ observably: a VIP who has used the bot before is
          permanently "opened" under the first reading before ever seeing this
          invitation. The second reading is the one that carries information for an
          outreach list, and it requires storing a first-open timestamp per entry,
          because a deep-link open that does not lead to registration leaves no other
          trace. RESOLUTION REQUIRED FROM THE DESIGN STEP, stated in the artefact with
          its reasoning: either (a) store an opened_at on the list entry, written the
          first time that entry's personal code deep link is resolved, and justify it
          as a genuinely unrecordable-otherwise event, or (b) derive opened from
          users.tg_id having become non-null (the person has linked an account), and
          state plainly that this is the weaker signal. Whichever is chosen, the
          artefact states the choice, and any stored column is justified against PRD 5
          in the artefact's own text.
      - ACCOUNT LINKING ON FIRST CONTACT (PRD FR-17: "Entries link to a real User on
        first /start, so nobody is duplicated"; story F9's third Confirmation): when a
        person redeems their personal code, the pre-created User row (tg_id NULL) is
        LINKED to their Telegram account -- its tg_id is set -- rather than a second User
        row being created. The match is BY THE CODE (STORY-DETAILS F9: "matched by the
        code"), which is exactly why REQ-037 issues personal codes with
        issued_to_user_id pointing at the pre-created row. REQ-014's description
        already anticipated this: "A user pre-created by an organizer with NULL tg_id
        links on first /start by whatever matching rule the invitation flow
        establishes -- that matching is a Release 2 requirement". THIS IS THAT
        REQUIREMENT, and the rule it establishes is code-based matching. The design
        artefact must state what happens when the redeemer ALREADY has their own User
        row (they have used the bot before under a different identity than the
        pre-created one) -- a merge, a refusal, or linking the registration to the
        existing row and leaving the placeholder -- because that case is reachable the
        moment an organizer pre-creates someone who is already a member, and silently
        creating a duplicate would break FR-17's "so nobody is duplicated" guarantee.
      - THE REFUSAL (STORY-DETAILS F9, restated from REQ-037 because this is the
        surface where an organizer would most naturally expect it): THE BOT CANNOT
        MESSAGE A GUEST WHO HAS NEVER STARTED IT. Telegram does not permit it. The list
        shows the organizer the code and link to share themselves -- by DM, email or in
        person -- and offers no "send invitation" action. This is a platform fact, not a
        product choice, and a design proposing an outbound send to a stranger is
        wrong regardless of how the request is phrased.
      - AUTHORIZATION (security-invariants.md S2): organizer-only, own-chapter, checked
        on the HANDLER via requireOrganizerForChapter(), EventStaff refused. The list
        surfaces other people's personal data, so security-invariants.md S3 bounds it:
        name, company, position and the outreach status -- never phone or email. Every
        entry added and removed writes an AuditLog row (PRD 12.7, S8); creating a User
        row for a real named person on someone else's say-so is an act worth having a
        record of.
      - "Active in the Telegram group" IS NOT COMPUTED AND MUST NOT BE APPROXIMATED.
        PRD FR-4 and RE-EVALUATION R4 are emphatic: a bot has no access to group
        history, "active in the group stays a human judgement, supported by the
        invitation list, not replaced by it", and "Do not fake this with a proxy
        metric". Any engagement score, activity heuristic or inferred-activity column
        contradicts the PRD directly.
    acceptance_criteria:
      - "An organizer adds a named guest who has never used the bot: exactly one users row is created with tg_id NULL, and a personal code can then be issued to that row through REQ-037's path -- both verified by reading the users and invite_codes tables (PRD FR-17, story F9's first Confirmation)."
      - "Adding two different never-seen guests both succeed, each producing a users row with tg_id NULL -- verified by adding both and confirming the unique index on tg_id does not collide across the two NULL rows (PRD 5, REQ-010's proven nullability)."
      - "The list renders each entry's outreach status across all four values: verified by constructing four entries in the four states (added only; opened per the design artefact's chosen definition; registered; checked in) and confirming each renders its correct status (PRD FR-17, story F9's second Confirmation)."
      - "The registered and attended statuses are DERIVED, not stored: verified by flipping a registration's admission and separately setting checked_in_at directly in the database, then re-rendering the list and confirming both statuses changed with NO write to the list entry row (compared by that row's updated timestamp before and after) -- PRD 5 computed-never-stored."
      - "`git grep` over apps/bot finds no column, cache or persisted field holding a registered or attended status for a list entry; the design artefact states the chosen 'opened' definition with its reasoning, and justifies against PRD 5 any column it does store."
      - "A guest redeeming their personal code LINKS the pre-created users row -- that row's tg_id becomes non-null and its id is unchanged -- rather than creating a second users row: verified by capturing the pre-created row's id and the users table count before and after redemption (PRD FR-17, STORY-DETAILS F9's third Confirmation). A run where the redeemer had no pre-created row does not exercise this and is not evidence."
      - "The case where the redeemer ALREADY has their own users row is handled exactly as the design artefact states, verified by constructing that state (a pre-created entry plus a separate existing account for the same person) and running the redemption -- an outcome leaving two live users rows for one person with no stated resolution fails this criterion (PRD FR-17 'so nobody is duplicated')."
      - "The rendered list contains no phone number and no email address for any entry -- verified by constructing entries whose users have both stored, rendering as an organizer, and grepping the captured output for each stored value (security-invariants.md S3)."
      - "The list surface offers NO action that sends a message to an entry, and `git grep` over apps/bot finds no send path targeting a user whose tg_id is NULL -- verified by reading the rendered surface's actions and the grep result (STORY-DETAILS F9's refusal; a bot cannot message a person who has never started it)."
      - "`git grep` over apps/bot finds no engagement score, activity heuristic, group-activity column or any field approximating 'active in the Telegram group' (PRD FR-4, RE-EVALUATION R4: 'Do not fake this with a proxy metric')."
      - "A member, and separately an EventStaff member, each invoking the list handlers directly are refused; an organizer of chapter A is refused for a chapter B event -- all three cases constructed and run (security-invariants.md S2)."
      - "Adding and removing a list entry each write exactly one audit_log row, counted before and after each (PRD 12.7, security-invariants.md S8)."
    depends_on: [REQ-037, REQ-014]

  - id: REQ-041
    title: Waitlist closure notification when registration closes, sent once, closing Release 2
    owner: BACKEND-DEV
    status: pending
    description: >
      FINAL REQUIREMENT OF RELEASE 2. Implements USER-STORIES B9 / STORY-DETAILS B9
      (Know when I didn't get in) and closes JOURNEY-AUDIT's J2 ("The waitlist has no
      ending"), which the audit rates the worst experience in the product: "A
      waitlisted member is told their position and then hears nothing, ever ... the
      most engaged people (they tried, and it was full) get the worst experience."
      USER-STORIES B9's Conversation says the same: "Silence is the worst possible
      answer."

      REQ-021 (done) deliberately left this hole and said so: "Waitlist CLOSURE is
      Release 2 (PRD 4) and is not implemented here." This requirement fills it.

      Placed last in the chain because it is the smallest of the seven stories
      (USER-STORIES sizes B9 `S`, every other Release 2 story `M`) and depends on
      nothing Release 2 builds -- it is sequenced here for chain clarity, not
      technical necessity.

      Scope of work:
      - A scheduled job on REQ-025's runner (apps/bot/src/scheduler/runner.ts),
        alongside the reminder, feedback, no-show and REQ-036 auto-decline jobs -- no
        new scheduling mechanism (PRD 1's "do not add infrastructure").
      - AT registration_closes_at, every registration still at admission='waitlisted'
        for that event receives ONE message telling them plainly that it did not work
        out this time, plus the onward path (the upcoming-events list, per REQ-035's
        stated wishlist-offramp decision, inherited unchanged -- no Wishlist row or
        table is created here either; Release 3's G4 replaces this substitution).
      - IT CHANGES NO STATE. STORY-DETAILS B9 is explicit: "Moves. Nothing -- being told
        is not a state." The person stays 'waitlisted'. They are NOT transitioned to
        'rejected', which PRD 6's vocabulary rule reserves for an organizer's active
        refusal ("organizer refuses -> rejected"), and nobody refused them. This is a
        deliberate contrast with REQ-036's auto-decline, which DOES transition
        'requested' -> 'rejected' because an approval decision is exactly what was
        owed and never given. The design artefact states the contrast so the two jobs
        are not later "harmonized" into one behaviour.
      - SENT ONCE, AND ONLY TO THE STILL-WAITLISTED (STORY-DETAILS B9's refusal:
        "Sending twice"; its "Also": "Promoted before closing -> never sent. Sent once;
        the event ending adds nothing further"). Two mechanisms, both needed and both
        stated: admission is re-checked AT SEND TIME so someone promoted before closure
        is never selected (the same at-send-time re-check REQ-026's reminders already
        make), and the send goes through REQ-025's ledger keyed
        (registration_id, kind) so a restart mid-batch or a repeated tick cannot
        repeat it. Notably the event's own ending must trigger nothing further -- a
        second message at ends_at would violate B9's "the event ending adds nothing
        further" even though the person is still waitlisted then.
      - An event with registration_closes_at NULL has no close moment to key on, the
        same gap REQ-036 confronts. The design artefact states the behaviour and the
        reasoning, consistently with whatever REQ-036 resolved -- and if the two
        requirements' resolutions differ, the artefact states why, rather than the two
        jobs silently disagreeing about when registration closes. NO column may be
        added to make the null case go away (PRD 5).
      - Transactional (PRD 9, security-invariants.md S10): reaches the person
        regardless of broadcast_opt_in; `blocked` users are skipped, as REQ-025's send
        API already does for every caller.
      - WORDING: STORY-DETAILS B9 says "told plainly that it didn't work out this
        time" and JOURNEY-AUDIT J2 frames these as the most motivated people in the
        room. The implementing agent writes plain factual wording through REQ-013's
        catalog mechanism (ru and en, no hardcoded literals in the handler) and records
        in its handoff result that the exact copy is provisional pending the product
        owner -- the same treatment REQ-014, REQ-032 and REQ-036 give their copy.
      - No AuditLog row is required by PRD 12.7 for this job, because it changes no
        status -- PRD 12.7 is "every STATUS CHANGE writes one AuditLog row" and there is
        no status change here. Stated explicitly so its absence reads as a decision
        rather than an omission, and so nobody adds an audit row that would make this
        the only non-status-change action in the system to write one.

      RELEASE BOUNDARY -- READ BEFORE DRAFTING MORE REQUIREMENTS. REQ-033..REQ-041 are
      PRD 4's RELEASE 2 (next Fail Stories, Q4) in PRD 14's build order step 7,
      covering exactly its seven stories: B6 (REQ-034, with REQ-036's deadline half),
      B7 (REQ-038), B8 (REQ-039), B9 (this requirement), F3 (REQ-035, with REQ-036),
      F4 (REQ-037), F9 (REQ-040), on REQ-033's InviteCode schema enabler.
      RELEASE 3 IS DELIBERATELY NOT DRAFTED IN THIS WF-01 RUN, for the same reason
      REQ-032 gave for deferring this one: entries that cannot start until Release 2
      lands would be registry noise, and their shape may legitimately change once
      Release 2 is real. Release 3 is a LATER WF-01 run, and it covers (PRD 4 and
      PRD 14 steps 8-10, Meetup #4 onward, 15 stories): the speaker CFP and pipeline
      (FR-9, FR-10, stories E1/E2/E4); lineup on the event card with publish consent
      (FR-11, stories E3/E5, security-invariants.md S14); speaker seats outside
      capacity (story E6); the D1 "want to speak" question REQ-031 deferred, which
      becomes story D2 once Talk exists; segmented broadcast with the programme
      template and notification preferences (FR-15, stories G1a/G1b/G1c/G2/G3,
      security-invariants.md S10); the chapter-interest WISHLIST (FR-6's wishlist
      half, story G4) -- which Release 2 deliberately did NOT build, substituting the
      upcoming-events list as the onward path on every refusal per REQ-035's stated
      offramp decision, so Release 3's G4 requirement must REPLACE that substitution
      on REQ-035's, REQ-036's, REQ-038's and this requirement's refusal paths, not
      merely add a new surface; full metrics matching the partner factsheet and CSV
      export (FR-16, stories H1/H2, security-invariants.md S12); manual waitlist
      promotion (story F5, which REQ-023's T-24h halt leaves as a stated hole); the
      organizer-facing cancel flow (story F6, whose notification half REQ-027 already
      covers); audit and hardening. PRD 4's "Later" list (.ics files, materials
      archive, analytics dashboard, UZ/KZ BOT interface locales, Telegram Mini App
      scanner, Redis/worker queue) and its "Non-goals" list (payments, gamification,
      full CRM, custom Telegram client, a web front-end for the bot, hackathon
      teams/judging) are NOT to be drafted at all -- a requirement proposing one
      contradicts decisions/0003 and PRD 4.
    acceptance_criteria:
      - "At registration_closes_at, every registration still at admission='waitlisted' receives exactly one message and every non-waitlisted registration for that event receives nothing -- verified by constructing three waitlisted, one admitted, one withdrawn and one rejected registration, running the job, and counting the captured sends (exactly three) (STORY-DETAILS B9)."
      - "No registration's admission changes: verified by capturing every registrations row for the event before and after the job and confirming all are byte-for-byte identical, with the three waitlisted rows still 'waitlisted' (STORY-DETAILS B9's 'being told is not a state', PRD 6's vocabulary rule)."
      - "A person promoted from waitlisted to admitted BEFORE registration closes receives nothing from this job -- verified by constructing that promotion first, then running the job, and confirming zero sends to them (STORY-DETAILS B9's 'Promoted before closing -> never sent'). A run where nobody was promoted does not exercise this and is not evidence."
      - "Running the job, KILLING the process, restarting it, and running the job again for the same event delivers no additional messages -- counted across both runs (PRD 12.8, PRD 13 criterion 6, security-invariants.md S9). A single-run test does not exercise restart-safety and is not evidence."
      - "Running the job again after the event's ends_at has passed delivers no further message to a still-waitlisted registration, verified by advancing past ends_at and re-running (STORY-DETAILS B9's 'the event ending adds nothing further')."
      - "The message states plainly that a seat did not come free and offers the upcoming-events list as an onward path, and contains no wording implying the person was refused or judged -- verified by reading the captured message text (STORY-DETAILS B9, REQ-035's offramp decision)."
      - "No wishlist table, migration or row is created by this requirement, verified by grepping every apps/bot migration and the schema for 'wishlist' (PRD 4 -- G4 is Release 3)."
      - "An event whose registration_closes_at is NULL behaves exactly as the design artefact states, verified by constructing that event with a waitlisted registration and running the job -- an unhandled crash, an undescribed silent skip, or a new column added to avoid the case all fail this criterion."
      - "The message reaches a user with broadcast_opt_in=false and reaches no user with blocked=true, verified by setting each flag and re-running (PRD 9, security-invariants.md S10)."
      - "No audit_log row is written by this job, verified by counting audit rows before and after a run that sends three messages (PRD 12.7 -- no status change occurs)."
      - "Every user-facing string added by this requirement resolves through REQ-013's catalog mechanism in both ru and en, verified by grepping the handler and the job for literal user-facing text and by the existing catalog key-set parity check; and the handoff result records that the wording is provisional pending the product owner."
    depends_on: [REQ-036, REQ-021]
