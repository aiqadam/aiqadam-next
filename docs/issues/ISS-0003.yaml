id: ISS-0003
title: REQ-026 is the registry's largest requirement at 10 acceptance criteria — sizing watch item
discovered_by: REQ-VALIDATOR
discovered_in_run: WF01-EVENTS-BOT-SPEC
discovered_at: "2026-09-06T06:29:29Z"
severity: MINOR
description: >
  REQ-026 (the T-24h "Still coming?" and T-3h route/QR reminder jobs) carries 10
  acceptance criteria, the most of any entry in the registry — mean is 5.8, median 6,
  and the next largest is REQ-016 at 8. It grew from 8 to 10 during the doors-open
  rework (WF01-EVENTS-BOT-SPEC steps 04-06).

  REQ-VALIDATOR judged it WITHIN one agent turn at the step-06 gate and this is
  explicitly not a FAIL: all ten criteria serve the single FR-7 reminder-chain
  deliverable, four are narrow single-field assertions about one message rather than
  separate builds, and PRD FR-7 specifies the T-24h and T-3h jobs as one table — one
  job family. Splitting on criteria count alone would sever the ledger-idempotency
  criterion from the jobs it governs, which is worse than carrying the size.

  Recorded so WF-02 has the split line pre-identified if implementation reality
  disagrees with that judgment: T-24h criteria 1-3 versus T-3h criteria 5-9. If the
  implementing run finds it does not fit one turn, split there rather than
  re-deriving the boundary under time pressure.
affected_files:
  - docs/agents/requirements.yaml
status: open
