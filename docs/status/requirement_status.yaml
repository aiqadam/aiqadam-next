    note: "RELEASE-VALIDATOR PASSed REQ-019 (profile capture as a resumable step-by-step form, consent gate, optional-field rule; GitHub issue #22) -- the FIRST requirement of Phase 4 (not a phase-closer; REQ-020..REQ-024 remain). Verified directly against the real shipped files, not from memory. Schema: apps/bot/drizzle/0004_fancy_zombie.sql (confirmed by reading the file) drops NOT NULL on 6 profiles columns (first_name, last_name, company, position, is_student, experience_level) and adds 5 new boolean columns, each DEFAULT false NOT NULL: phone_skipped, email_skipped, links_github_skipped, links_linkedin_skipped, links_site_skipped -- exactly 11 statements, matching the design doc's predicted list. Domain: apps/bot/src/domain/profile.ts defines REQUIRED_PROFILE_FIELDS/OPTIONAL_PROFILE_FIELDS, determineNextProfileField()/isProfileComplete() (the resumability engine -- given a ProfileRecord-or-null, returns the next unanswered field or 'complete'), plus field-level validators (isValidEmailFormat, isValidStudentAnswer, isValidExperienceLevelAnswer) and /profile-edit helpers (parseProfileEditFields, validateProfileEditInput, formatProfileDump). apps/bot/src/domain/onboarding.ts adds determineOnboardingStep()/advanceOnboarding(), unifying the consent-then-chapter-then-profile progression into one function so /start and /profile share one source of truth for 'what's next' rather than each re-deriving it. Handlers: apps/bot/src/handlers/profile.ts implements /profile, /profile_edit, /profile_chapter and the step handlers using a derive-then-gate discipline (recompute the current step fresh on every incoming update rather than trusting stored conversation state) that closes an S1 consent-ordering gap CODE-DESIGN-VALIDATOR caught and CODE-DESIGNER fixed at Step 1b (commit 2dadd9f, '§4.6 derive-then-gate discipline for callback handlers') before any code was written. apps/bot/src/handlers/start.ts was modified to route through advanceOnboarding(), fixing a zero-active-chap