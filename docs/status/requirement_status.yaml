    note: "RELEASE-VALIDATOR PASSed REQ-020 (registration for an open event with atomic capacity enforcement and qr_token issuance, GitHub issue #23) -- the SECOND requirement of Phase 4 (not a phase-closer; REQ-021..REQ-024 remain). Verified directly against the real shipped files, not from memory. No schema change (registrations.qr_token/source already existed from REQ-011). Domain: apps/bot/src/domain/registration.ts's decideRegistrationOutcome() is a pure first-match-wins decision table (already-registered -> event-cancelled -> event-finished -> registration-closed -> requires-invite -> requires-approval -> admitted-if-seats-left -> waitlisted), taking evaluationTime as an explicit caller-supplied parameter (decisions/0006), never a clock read inside the predicate. generateQrToken() is exactly `randomBytes(32).toString(\"hex\")` -- 256 bits from Node's crypto CSPRNG, well over the required >=128 bits, never Math.random, never a counter, never derived from the user id (confirmed by reading the function body directly, no hash/id input exists in its signature at all -- it takes zero parameters). ATOMIC CAPACITY (security-invariants.md S7, PRD 12.2): registerForEvent() runs the entire read-decide-write sequence inside one db.transaction(async (tx) => {...}), opening with `tx.select(...).from(events).where(eq(events.id, eventId)).for(\"update\")` -- a real SELECT ... FOR UPDATE row lock on the events row, held for the transaction's lifetime -- before reading the existing-registration row, counting admitted registrations against the SAME tx, and only then deciding/writing; this is genuinely a lock-then-read-then-write sequence, not a read-then-write race. This exact mechanism was independently stress-tested 5 separate times across the pipeline (BACKEND-DEV, REVIEWER twice, TEST-RUNNER, RELEASE-VALIDATOR) across contention configurations from 2 to 10 concurrent callers for a 1-seat/last-seat event, always zero over-admissions -- RELEASE-VALIDATOR's own Step 5 run repeated a fresh 10-concurrent-caller trial itself rather than trusting the prior four reports, confirming exactly 1 admitted and the rest waitlisted every time. Registration.source: resolveRegistrationSource() returns the stored pendingSource unchanged when non-null, else the literal 'direct'; registerForEvent() reads it from users.pending_source (REQ-016's channel-suffix mechanism) inside the same tx and clears it via clearPendingSource() only after a successful insert. Audit: writeAuditLog() is called exactly once per admitted-or-waitlisted outcome, from inside the same tx as the registrations INSERT (action registration.admit or registration.waitlist), so a rollback of one rolls back the other; every non-writing outcome (already-registered/cancelled/finished/closed/requires-invite/requires-approval) returns before reaching the write section and writes no audit row (S8, PRD 12.7 -- one row per admission, not one per attempt). Handler: apps/bot/src/handlers/registration.ts's register:<eventId> callback (makeRegisterCallbackHandler, wired into apps/bot/src/handlers/start.ts's event card per REQ-017/REQ-020's design) resolves the acting user, calls registerForEvent(), then composes a per-outcome reply naming the event/date-time for admitted/waitlisted/already-registered and an onward path (deepLinkSeeUpcoming) for cancelled/finished/closed refusals, plus dedicated requires-invite/requires-approval refusal copy for the Release-2 rows this requirement must not silently admit through. requirements.yaml's REQ-020 entry needed no content correction (description/acceptance_criteria already matched the shipped mechanism exactly); status flipped to done. ISS-0017 (filed this run, two minor test-spec fixture defects, non-blocking) confirmed named correctly in Step 5's handoff -- no further action taken on it here, it stays open per the issue queue. README.md rechecked (grep for registration/qr_token/capacity/apps-bot terms): still contains no bot-flow-specific content of any kind beyond the one generic apps/bot description line added at REQ-009's doc-update step, so no README update was warranted -- same reasoning applied at every prior bot requirement (REQ-010 through REQ-019). No standalone bot-command-reference doc exists anywhere in docs/ (checked via Glob for '**/*command*', matches only unrelated node_modules paths) -- none was created here either, consistent with the established pattern noted at REQ-018/REQ-019's doc-update steps. This is the SECOND requirement of Phase 4, not the last, so no 'Phase complete' marker is added -- REQ-021 (waitlist), REQ-022..REQ-024 remain. GitHub issue mapping, for ORCH's awareness: this run corresponds to issue #23."
