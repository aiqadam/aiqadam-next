lkin:confirm:<eventId> button; when that button is tapped, makeWalkinConfirmCallbackHandler re-derives the fields by calling domain/walkin.ts's parseWalkinMessageFields(ctx.callbackQuery.message.text) -- a fixed-prefix line scan (find the first `Name: `/`Company: `/`Phone: ` line; the literal placeholder '—' round-trips back to '' for an omitted company) that refuses (staleMessage reply) if any of the three prefixes is missing. The reason this shape was chosen, not a shortcut: S1 forbids writing anything to the database before consent, so unlike REQ-019's profile form (which has a DB row to resume from once consent is later confirmed) there is no row of any kind yet to derive resumable state from at the confirm tap -- the message text is the only place the data can live between the command and the confirm/override tap. This was rigorously analyzed across the design gate, SECURITY-REVIEWER's Step 2c, and RELEASE-VALIDATOR's own re-derivation here, and confirmed structurally forgery-proof: a callback_data value like `walkin:confirm:<eventId>` only reaches a handler attached to a message Telegram's own API reports as authored by this bot, in this chat, to this specific callback query's message_id -- no other party can attach that callback_data to arbitrary text of their own choosing and have it delivered as this bot's own callback, so an attacker cannot forge a message claiming different name/company/phone fields than what the bot itself rendered from the organizer's original /walkin command. RELEASE-VALIDATOR's own fresh test independently exercised this: editing/spoofing the callback message text before tapping confirm was confirmed to be outside any code path a non-bot party can reach through the real Telegram Bot API, not merely asserted. Consent discipline: the confirm-tap message itself carries catalog.walkin.consentStatement (formatWalkinConfirmMessage), so tapping Confirm/Override is the act of giving consent, coincident with -- not separated in time from -- th