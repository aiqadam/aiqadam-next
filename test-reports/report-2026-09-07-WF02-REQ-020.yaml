issues_found:
  - severity: MINOR
    title: "REQ-020.md's AC5 and AC-card live-dispatch cases omit the mandatory 'e_' deep-link prefix in their literal /start dispatch text"
    description: >
      docs/agents/test-specs/REQ-020.md's AC5 case specifies
      `/start e0002000-0000-0000-0000-000000000a50__linkedin` and
      `/start e0002000-0000-0000-0000-000000000a50`, and AC-card specifies
      `/start e0002000-0000-0000-0000-000000000ac0` -- all three omit the "e_"
      prefix that apps/bot/src/domain/event.ts's parseStartPayload requires
      (`if (!trimmed.startsWith("e_")) return { kind: "none" }`). Every prior
      spec that dispatches a /start deep link (docs/agents/test-specs/REQ-016.md,
      REQ-017.md) always includes the "e_" prefix. As literally written, AC5's
      /start dispatch is silently treated as a payload-less /start (kind: "none")
      -- the case still happens to reach the correct end state because AC5's
      subsequent consent:agree callback_data carries its own explicit "e_"
      prefix independent of the /start payload -- but AC-card has no such
      callback step, so running AC-card exactly as literally specified makes
      the user fall into the ordinary profile-onboarding flow ("What's your
      first name?") instead of ever reaching the event card, which would have
      produced a false FAIL entirely due to the spec's own typo, not a product
      defect. TEST-RUNNER corrected the harness to use "e_"-prefixed dispatch
      text for both AC5 and AC-card and confirmed both pass with the real
      deep-link path genuinely exercised.
    affected_files:
      - docs/agents/test-specs/REQ-020.md
  - severity: MINOR
    title: "REQ-020.md's AC-card fixture uses an invalid (non-hex) UUID literal for the venue id"
    description: >
      The AC-card fixture's venue INSERT statement uses id
      'c0002000-0000-0000-0000-00000000ac0v' -- the trailing 'v' is not a valid
      hex digit, so Postgres rejects it with "invalid input syntax for type
      uuid". TEST-RUNNER substituted a valid uuid
      ('c0002000-0000-0000-0000-00000000ac0a') with no other change to the
      fixture and confirmed AC-card passes.
    affected_files:
      - docs/agents/test-specs/REQ-020.md
