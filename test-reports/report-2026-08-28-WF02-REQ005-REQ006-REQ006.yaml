cases:
  - acceptance_criterion: AC1
    result: pass
    notes: >
      Ran the spec's exact Node script. Output: total_keys: 177,
      empty_kk_values: [], identical_value_pairs matches the spec's expected
      list of exactly 34 keys, in the same order. No empty values, no
      unexpected identical-value pairs (i.e. no untranslated Russian
      leftover). Ran the CFP verbatim-domain-term check: Event_count=0,
      Chapter_count=0, Talk_count=0, Speaker_count=0, CFP_count=2 — matches
      spec exactly, confirming zero regression of the domain-vocabulary
      defect class REVIEWER's step-08 review previously caught.

      Ran the брэнд/код loanword sub-check script exactly as written in the
      spec. Actual output: brend_keys=["Metadata.description","Hero.subtitle",
      "Creed.lede","MapSection.lede","Team.lede","Footer.about"],
      kod_keys=["Streams.foundationBody"]. This differs from the spec's
      stated "Expected" sample (which additionally lists Footer.licenseBrand
      in brend_keys and Footer.licenseCode in kod_keys) — root-caused: the
      spec's script checks only lowercase 'бренд'/'Бренд' and 'код'/'Код'
      substrings, but the actual Footer.licenseBrand/Footer.licenseCode
      values are ALL-CAPS ("БРЕНД · AI QADAM BUP", "КОД · MIT"), which the
      script's exact substring checks do not match (confirmed directly:
      "БРЕНД · AI QADAM BUP".includes('бренд') === false,
      .includes('БРЕНД') === true). This is a defect in the test spec's
      sample output, not in the implementation — verified this is not
      environment drift by checking git log, which confirms HEAD is still
      commit 357d1c2, the exact commit the spec states it was authored
      against. Applying the AC's actual stated PASS condition (brend/kod must
      each appear in at least one *other* key besides the license line, which
      both do here — 6 and 1 other keys respectively) rather than the
      mismatched sample text, this sub-check PASSes on its merits. Reporting
      as a MINOR spec-accuracy issue per core-directives.md's "Never resolve
      a conflict silently" — filed to ORCH, not corrected here.

