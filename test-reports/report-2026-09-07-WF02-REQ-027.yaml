issues:
  - severity: MINOR
    description: >
      The new test file's seedOrganizer helper required a fix during this run:
      resolveOrCreateUser leaves users.role at its schema default ("member")
      with no chapter_id, so an organizer fixture dispatching through the real
      bot must also directly db.update the user's role to "organizer" and set
      chapterId -- this was not called out explicitly in the spec's shared
      setup section (which only describes makeTestBot()/commandUpdate()), and
      no prior committed dispatch test in this repo (withdraw.test.ts included)
      needed to construct an organizer fixture this way, since REQ-027's
      event.dispatch.test.ts is the first dispatch test whose command requires
      organizer authorization. Filed as a TEST-DESIGNER spec-clarity note for a
      future revision, not a blocker -- the fixture now correctly authorizes
      and every case passes.

