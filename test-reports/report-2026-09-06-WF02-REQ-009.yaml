new_blocking_issue_filed_to_orch:
  title: "package-lock.json out of sync with package.json blocks npm ci / all CI past Install"
  description: >
    `npm ci` fails at the repo root with npm error code EUSAGE ("lock file's
    esbuild@0.25.12 does not satisfy esbuild@0.28.2", plus ~28 "Missing:
    @esbuild/<platform>@0.25.12 from lock file" lines) on
    feature/WF02-REQ-009. Reproduced identically: (1) locally via a clean
    `npm ci` after removing node_modules, with config.test.ts in its correct
    committed state; (2) on real GitHub Actions, run
    https://github.com/aiqadam/aiqadam-next/actions/runs/34025692089
    (commit 6a06cf5) and run
    https://github.com/aiqadam/aiqadam-next/actions/runs/34026192432
    (commit f3b2677, config.test.ts already reverted to correct content) --
    both failed at the `build` job's "Install dependencies" step, before
    Lint/Test/Build ever ran. `package-lock.json` is part of this branch's
    diff (introduced/modified in commit 0938d38, the REQ-009 apps/bot
    skeleton commit) so it is this branch's responsibility, not
    pre-existing on master. A local attempt to regenerate the lockfile
    (full node_modules + package-lock.json wipe, `npm install`) produced a
    working local state once, but a second `npm ci` against that same fresh
    lockfile failed again non-deterministically with a different missing
    optional esbuild platform package, and separately triggered a known
    Windows-local npm optional-dependencies bug (npm/cli#4828) requiring
    another full wipe to clear -- this needs a developer to properly pin/
    resolve the conflicting esbuild version requirement (likely between the
    root's vitest 5.0.0 devDependency chain and something else demanding
    esbuild 0.28.2) and verify the fix is stable across repeated `npm ci`
    runs, ideally confirmed on the actual Linux CI runner, not just one
    local Windows machine.
  severity: blocker
  affected_files:
    - package-lock.json
    - package.json
    - apps/bot/package.json
    - .github/workflows/ci-cd.yml (blocked by, not caused by)

