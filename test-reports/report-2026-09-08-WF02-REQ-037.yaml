    as real." Treated as real -- root cause below.
root_cause_analysis:
  finding: >
    All 3 AC10 cases open with `const auditBefore = ...; expect(auditBefore).toBe(0); //
    beforeEach truncates audit_log`. beforeEach DOES truncate audit_log correctly (TRUNCATE
    ... audit_log ... CASCADE) -- the comment is accurate about the truncate itself, but
    wrong about what happens between the truncate and the assertion. Each of these 3 `it`
    blocks calls `seedEvent(chapterId, ...)` AFTER beforeEach's truncate, and seedEvent
    (this same spec's own helper, transcribed verbatim) internally calls
    domain/event.ts's `createEvent` and `publishEvent` -- both of which call
    `writeAuditLog` (confirmed: apps/bot/src/domain/event.ts lines 594 and 622 each
    contain a writeAuditLog call reachable from createEvent/publishEvent respectively).
    So by the time `auditBefore` is read, 2 audit_log rows already exist (one for the
    event's own create, one for its publish), not 0. This is not a race or a leak from a
    prior test -- it reproduces identically and immediately in an isolated single-file
    run, and is fully explained by seedEvent's own two internal domain calls.
  attribution: >
    This is a defect in the test spec (docs/agents/test-specs/REQ-037.md), not in
    apps/bot/src/domain/inviteCode.ts or handlers/inviteCodes.ts. The 3 failing
    assertions check a precondition (`auditBefore === 0`) the spec's own seedEvent helper
    cannot satisfy, given how event.ts's createEvent/publishEvent are actually
    implemented. It also is not an implementation defect: the AC10 assertions that
    matter for the actual acceptance criterion -- `countAuditRows(row.id)` (scoped by
    entityId = the invite code's own id, never the event's) and the row's `action` field
    -- are structurally unaffected by the 2 pre-existing event-scoped audit rows, and
    would pass if the `auditBefore === 0` sanity line were removed or corrected to expect
    2.
  per_task_instruction: >
    Per this run's own instructions ("If any test fails because the spec described
    something that doesn't match actual code behavior, STOP and report precisely rather
    than silently altering the test to force a pass"), the test file is committed
    UNMODIFIED from the approved spec -- no edit was made to force these 3 cases green.
