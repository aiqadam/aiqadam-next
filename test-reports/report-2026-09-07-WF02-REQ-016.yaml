issues_found:
  - id: pre-existing-env-rolldown-binding
    severity: BLOCKER (environment, not this branch)
    description: >
      Root `npm test` and `apps/bot`'s `npx vitest run` initially failed at
      startup with "Cannot find native binding" / "Cannot find module
      '@rolldown/binding-wasm32-wasi'" -- the win32-x64 native binding for
      rolldown (a vitest/vite transitive dependency) was missing from
      node_modules (npm optional-dependencies bug, npm/cli#4828). Attribution:
      structurally pre-existing -- node_modules is gitignored (not tracked),
      and `git diff --name-only master...HEAD` shows no package.json or
      package-lock.json changes in this branch, so this branch cannot have
      caused it. Fixed for this run (Unblock-Everything) via
      `npm install --no-save @rolldown/binding-win32-x64-msvc@1.2.7`, which
      resolved it without touching package-lock.json (confirmed via `git status
      --porcelain` showing no diff after). This is a local-machine dependency
      install state issue, not a code defect -- filed for ORCH awareness in case
      it recurs on another machine/CI runner, though CI's own green `build` run
      confirms this does not affect the CI environment.
  - id: test-spec-cleanup-gap-venues-not-deleted
    severity: MINOR
    description: >
      The verification spec's (docs/agents/test-specs/REQ-016.md) cleanup
      statements before AC2/AC3/etc. only `DELETE FROM audit_log; ... DELETE FROM
      events; DELETE FROM users; DELETE FROM chapters;` -- they omit `DELETE FROM
      venues`, so a prior case's venue row (which FK-references a chapter) causes
      the `DELETE FROM chapters` statement to fail with a foreign-key violation
      (chapters from earlier cases survive). This did not affect any case's
      pass/fail outcome in this run (each case uses distinct chapter/event UUIDs
      per its own -0000000X- prefix, so leftover rows from prior cases never
      collided), but it left stray chapter/venue rows accumulating across cases
      until manually corrected (added `DELETE FROM venues;` to this run's own
      cleanup statements from AC3 onward). Recommend TEST-DESIGNER add `DELETE
      FROM venues;` to the shared cleanup statement for future runs of this spec.
