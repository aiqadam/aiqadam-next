migration_apply:
  result: pass
  actual_output: |
    CREATE TABLE
    CREATE TABLE
    CREATE TABLE
    ALTER TABLE
    ALTER TABLE
    CREATE INDEX
    CREATE INDEX
    CREATE INDEX
  notes: >
    Spec's "Expected" section listed the last three lines as "CREATE UNIQUE INDEX".
    Actual psql command-tag output is "CREATE INDEX" for all three -- this is
    correct, unmodified Postgres behavior: the command tag for a `CREATE UNIQUE
    INDEX` statement is always "CREATE INDEX" (Postgres does not emit a distinct
    tag for the UNIQUE modifier). Verified substance directly: grepped the applied
    migration file and confirmed all three statements are literally
    "CREATE UNIQUE INDEX ..." (chapters_code_unique, profiles_user_id_unique,
    users_tg_id_unique). This matches the spec's own documented caveat ("if actual
    output differs in shape (not substance) ... that is expected tool-version
    drift, not a spec defect") -- treated as pass, not a discrepancy.

cases:
  - acceptance_criterion: AC1
    description: UUID primary keys and created/updated timestamps on all three tables
    result: pass
    notes: >
      \d+ chapters / users / profiles all show id (uuid, not null, default
      gen_random_uuid(), "<table>_pkey" PRIMARY KEY btree(id)), created_at
      (timestamp with time zone, not null, default now()), and updated_at (same)
      exactly as specified.

  - acceptance_criterion: AC2
    description: users.tg_id is nullable AND unique
    result: pass
    notes: >
      Two INSERT INTO users (tg_id) VALUES (NULL) both returned "INSERT 0 1" (no
      collision between the two NULLs). First INSERT ... (123456789) returned
      "INSERT 0 1". Second INSERT ... (123456789) failed with exactly:
      "ERROR:  duplicate key value violates unique constraint "users_tg_id_unique""
      / "DETAIL:  Key (tg_id)=(123456789) already exists." -- matches spec verbatim.

  - acceptance_criterion: AC3
    description: profiles' optional columns are nullable at the database level
    result: pass
    notes: >
      INSERT supplying only first_name, last_name, company, position, is_student,
      experience_level (plus user_id FK) returned "INSERT 0 1" -- no NOT NULL
      violation on any omitted column. Follow-up SELECT of phone, email,
      public_bio, photo_file_id, links_github, links_linkedin, links_site returned
      exactly one row with all 7 fields blank/NULL.

  - acceptance_criterion: AC4
    description: >
      Three consent columns (users.consent_pd_at, users.broadcast_opt_in,
      profiles.publish_consent) exist, broadcast_opt_in/publish_consent DEFAULT FALSE
    result: pass
    notes: >
      INSERT INTO users (tg_id) VALUES (999999999) RETURNING broadcast_opt_in,
      consent_pd_at -> broadcast_opt_in = f, consent_pd_at = NULL (empty), neither
      column was named in the INSERT. SELECT publish_consent FROM profiles WHERE
      first_name = 'Test' -> f, also never named in its INSERT.

  - acceptance_criterion: AC5
    description: No column exists for a PRD 5 computed-never-stored value
    result: pass
    notes: >
      grep -inE "no_show|waitlist_position|seats_taken|registration_open|finished"
      apps/bot/drizzle/0000_tough_lilith.sql produced no output and exited 1 (no
      match), as required.

  - acceptance_criterion: AC6
    description: Design artefact states tg_id is never a business key
    result: pass
    notes: >
      docs/agents/design/REQ-010.md:158 reads verbatim "**`tg_id` is never a
      business key; every later lookup resolves to `User.id`.**" under heading
      "5.1 `tg_id` is never a business key" (line 156). Both greps matched, inside
      the section explicitly about tg_id, unambiguous (not hedged).

