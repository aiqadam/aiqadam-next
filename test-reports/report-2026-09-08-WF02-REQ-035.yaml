root_cause:
  summary: >
    Every failure is the identical off-by-one bug: the test spec's countAuditRows()
    baseline assumption ("no audit_log row exists for a fresh pending registration")
    is false. apps/bot/src/domain/registration.ts lines 242-254 (registerForEvent,
    pre-existing code, not new to REQ-035) unconditionally writes an audit_log row
    for EVERY registration outcome including "requested" (action:
    "registration.request", entityId: the new registration's id). This means every
    registration produced by the shared seedPendingRequest() helper already carries
    one audit_log row before any approve/reject call is made.
  evidence: |
    apps/bot/src/domain/registration.ts:242-254
      await writeAuditLog(tx, {
        actorUserId: userId,
        action: outcome.kind === "admitted" ? "registration.admit"
              : outcome.kind === "waitlisted" ? "registration.waitlist"
              : "registration.request",
        entity: "registration",
        entityId: insertedRow.id,
        payload: { eventId },
        at: evaluationTime,
      });
  affected_assertions:
    - file: apps/bot/src/domain/registrationApproval.db.test.ts
      case: "AC10 > approveRequest (plain) ... registration.approve"
      line: 339
      expected: 0
      actual: 1
      note: "before-count check right after seedPendingRequest"
    - file: apps/bot/src/domain/registrationApproval.db.test.ts
      case: "AC10 > approveRequest (override) ... registration.approve_override"
      line: 373
      expected: 0
      actual: 1
    - file: apps/bot/src/domain/registrationApproval.db.test.ts
      case: "AC10 > rejectRequest ... registration.reject"
      line: 400
      expected: 0
      actual: 1
    - file: apps/bot/src/handlers/organizerRequests.db.test.ts
      case: "AC2 > organizer taps Reject ..."
      line: 331
      expected: 1
      actual: 2
      note: "after-count check; off by the same +1 pre-existing 'registration.request' row"
    - file: apps/bot/src/handlers/organizerRequests.db.test.ts
      case: "AC4 > dismissing the override prompt ..."
      line: 363
      expected: 0
      actual: 1
    - file: apps/bot/src/handlers/organizerRequests.db.test.ts
      case: "AC6 > a plain member ..."
      line: 435
      expected: 0
      actual: 1
    - file: apps/bot/src/handlers/organizerRequests.db.test.ts
      case: "AC6 > an EventStaff member ..."
      line: 463 (approx, second AC6 case)
      expected: 0
      actual: 1
    - file: apps/bot/src/handlers/organizerRequests.db.test.ts
      case: "AC7 > organizer scoped to chapter A ..."
      line: 463
      expected: 0
      actual: 1
  attribution: >
    This is a TEST-DESIGNER spec defect, not a BACKEND-DEV code defect. The
    "registration.request" audit row on every requested registration is pre-existing,
    correct, intentional behavior (writeAuditLog call is unconditional across all three
    outcome kinds, and this code path predates REQ-035 -- REQ-035 added no changes to
    registerForEvent). The test spec's countAuditRows() before/after baselines simply
    did not account for this pre-existing row. Per this run's explicit instruction, the
    test files were NOT silently altered to force a pass -- reporting precisely instead.
