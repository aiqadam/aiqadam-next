notes_for_test_designer: >
  Recommended spec fix (not applied by TEST-RUNNER per this run's explicit
  instruction to stop rather than silently alter tests): adjust every
  countAuditRows() baseline in both files to expect 1 (not 0) immediately after
  seedPendingRequest(), and adjust every "after approve/reject" total by the same
  +1 offset. Alternatively, seedPendingRequest() could itself assert/consume the
  known pre-existing row so downstream assertions read as deltas rather than raw
  totals.
