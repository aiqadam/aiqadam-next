issues_found:
  - severity: MINOR
    title: "REQ-022.md's AC-security fixture contains an invalid-hex UUID literal that cannot be inserted into a uuid column"
    description: >
      docs/agents/test-specs/REQ-022.md's AC-security fixture INSERTs a user
      row with id 'c0002200-0000-0000-0000-00000000a5o1' -- the last group
      contains the character 'o', which is not valid hex (0-9a-f), so the
      INSERT fails with Postgres error 22P02 (invalid input syntax for type
      uuid). TEST-RUNNER substituted the semantically-identical valid-hex id
      'c0002200-0000-0000-0000-00000000a501' in its own scratch harness to
      unblock verification (a like-for-like fixture-literal fix, not a change
      to the case's logic or expected outcomes) and confirmed the case passes
      with that substitution. Flagging so REQ-022.md's AC-security fixture can
      be corrected at the source before a future re-run copies the broken
      literal verbatim.
    affected_files:
      - docs/agents/test-specs/REQ-022.md
  - severity: MINOR
    title: "REQ-022.md's AC-catalog grep count of 27 does not account for a pre-existing checkin-catalog key sharing the name usageNoId"
    description: >
      AC-catalog's grep pattern includes "usageNoId", which is also the name
      of a pre-existing key in the checkin catalog section (apps/bot/src/i18n/
      {types,ru,en}.ts) unrelated to withdraw. The literal grep therefore
      returns 30 matches (9 withdraw keys x 3 files = 27, plus 3 incidental
      checkin usageNoId hits), not the spec's stated 27. TEST-RUNNER
      independently confirmed all 9 withdraw keys are genuinely present in
      all 3 files at the withdraw section's own line ranges (27/27
      withdraw-specific matches), so this is a spec wording imprecision, not
      a real coverage gap. Flagging so REQ-022.md's AC-catalog can either
      scope the grep to the withdraw block or state the expected total as 30
      with the extra 3 named.
    affected_files:
      - docs/agents/test-specs/REQ-022.md
