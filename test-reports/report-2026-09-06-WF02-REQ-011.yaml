issues_found:
  - severity: minor
    title: "REQ-011 test spec's literal migration-apply expected output undercounts ALTER TABLE and mislabels unique-index command tags"
    description: >
      docs/agents/test-specs/REQ-011.md's "Shared setup" section lists an exact expected
      psql command-tag sequence for applying 0001_tired_annihilus.sql: 9x ALTER TABLE,
      3x CREATE UNIQUE INDEX, 1x CREATE INDEX. The real migration file
      (apps/bot/drizzle/0001_tired_annihilus.sql) contains 10 ALTER TABLE statements
      (lines 79-88, one per FK constraint) and Postgres's actual psql command tag for
      any CREATE INDEX statement — unique or not — is always "CREATE INDEX" (there is no
      separate "CREATE UNIQUE INDEX" tag in real Postgres output). Actual observed output
      when applying the migration against a real Postgres 16 instance: 10x ALTER TABLE,
      4x CREATE INDEX. Not a migration defect — the migration itself applies cleanly
      with zero errors, and every downstream AC (AC1-AC7, S6) independently re-verifies
      the resulting schema shape and all pass. Recommend TEST-DESIGNER correct the
      expected-output block in the spec's Shared Setup section.
    affected_files:
      - docs/agents/test-specs/REQ-011.md
    reported_to: ORCH
