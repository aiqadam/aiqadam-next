issues:
  - severity: MINOR
    description: >
      AC-schema's spec wording ("this migration should contain no ALTER TABLE
      statements whatsoever, only the one CREATE TABLE") does not account for
      drizzle-kit's standard pattern of emitting an ALTER TABLE ADD CONSTRAINT
      for a new table's own FK, which every migration in this repo (0000-0005)
      does. Recommend TEST-DESIGNER tighten the wording on a future spec
      revision to "no ALTER TABLE targeting any table other than the new one"
      or similar, matching the actual property (no existing table altered)
      rather than a literal statement-type count that drizzle-kit's own output
      can never satisfy for any FK-bearing new table.
