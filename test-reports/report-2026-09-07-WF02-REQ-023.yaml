  AC7:
    status: PASS
    description: "Exactly one audit row per promotion; running the promotion path twice for a genuinely-freed-then-refilled seat sends exactly one notification."
    evidence: |
      Domain-level re-run (genuine-promotion audit-count case + never-freed capacity-full case):
      exit 0.
      This spec's own case: seat genuinely freed via real /withdraw + confirm dispatch.
      beforeAuditCount=2 (the 2 original registration.admit rows) -> afterAuditCount=4 (+2:
      withdraw + promote). Exactly 1 sendMessage to the promoted candidate's chat
      (chat_id "1000000671") plus 1 to the withdrawer. Promoted candidate's admission='admitted'.
      Second run: promoteFromWaitlistIfEligible(db, eventId, new Date()) called directly a second
      time against the SAME now-refilled event -> returned { kind: "capacity-full" }. audit_log
      count unchanged at 4 (zero new rows). Structural argument (per design's single
      sendPromotionNotification call site gated on outcome.promotion.kind === "promoted") confirmed
      against the actual source at apps/bot/src/handlers/withdraw.ts line 140-148: the second run's
      capacity-full outcome cannot reach that call site even if routed through the full handler.

  AC8:
    status: PASS
    description: "Blocked promoted user: promotion completes at the DB level (admitted, audit row, fresh qr_token), but sends no notification; does not misroute to a substitute candidate."
    evidence: |
      Existing dispatch-level S10 test re-run: 1 passed, exit 0.
      This spec's own multi-candidate case (capacity=2, blocked candidate earliest-created,
      non-blocked candidate later): withdrew one of two admitted seats. Result: exactly 1
      sendMessage after confirm (the withdrawer's own confirmedReply only) -- zero sends to the
      blocked candidate's chat (1000000682) and zero to the non-blocked candidate's chat (1000000683).
      Read-back: blocked candidate admission='admitted' with fresh 64-hex qr_token
      (62f24eaf...e56f2), exactly 1 registration.promote audit row for their own registration.
      Non-blocked candidate still admission='waitlisted' (correctly not promoted -- only one seat
      freed, blocked candidate legitimately won the created_at ordering).

