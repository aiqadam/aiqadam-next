acceptance_criteria:
  AC1:
    status: PASS
    description: "Earliest-created waitlisted registration promoted; other two provably untouched."
    evidence: |
      Domain-level re-run: exit 0.
      Live-dispatch case (scratch-verify-req023.ts): 4 users registered via real register: callbacks
      (capacity=1, event 48h out) -- 1 admitted (tg 1000000610), 3 waitlisted (A=1000000611,
      B=1000000612, C=1000000613). created_at forced to A < B < C. Admitted user withdrew via a
      real /withdraw + withdraw:confirm dispatch.
      Result: exactly 2 sendMessage calls after confirm -- one to chat_id "1000000611" (A, the
      promotion notification, text starting "A seat opened up -- you're in!") and one to the
      withdrawer's own chat (confirmedReply). No third send to B's or C's chat.
      Read-back: A admission='admitted' with fresh 64-hex qr_token
      (337cbf71...a220f82). B and C: admission='waitlisted', qr_token=null, updated_at
      byte-identical to their pre-withdrawal captured values (2026-09-07 07:50:51.577083+00 and
      .588225+00 respectively) -- both provably untouched.

  AC2_and_boundary:
    status: PASS
    description: "T-24h halt (12h-out re-run) plus the exact T-24h boundary instant, both pure-function and live-dispatch."
    evidence: |
      Domain-level 12h-out re-run: exit 0 (covered by the req023_registration_db_test run above).
      AC2-boundary pure-function test (scratch-verify-req023-boundary.ts, npx tsx, no DB):
        isAutoPromotionHalted(exactly T-24h, eval) -> true (expected true)
        isAutoPromotionHalted(T-24h+1s remaining, eval) -> false (expected false)
        isAutoPromotionHalted(23h59m59s remaining, eval) -> true (expected true)
      All three match the design's `<=` boundary rule exactly -- no off-by-one.
      Live-dispatch corroboration: event's starts_at set to exactly capturedNow + 24h; withdrawal
      dispatched a few ms later (still <= 24h before starts_at, i.e. still halted). Result: exactly
      1 sendMessage after confirm (the withdrawer's own confirmedReply only -- no promotion
      notification). Waitlisted candidate's admission still 'waitlisted'; admitted count for the
      event = 0 (freed seat stayed free).

  AC3:
    status: PASS
    description: "Empty waitlist -> withdrawal completes with no error, no promotion."
    evidence: |
      Domain-level re-run: exit 0.
      Live-dispatch case: register then /withdraw + confirm for a lone admitted user, no waitlist.
      bot.handleUpdate resolved without throwing. Exactly 1 sendMessage (confirmedReply, exact
      text "You've withdrawn. Your seat has been freed."). audit_log: exactly 1
      registration.withdraw row for the registration, 0 registration.promote rows globally.

  AC4:
    status: PASS
    description: "Promotion racing a fresh registration for the same freed seat never over-admits (this spec's own 5-iteration, capacity=3, dual-withdrawal/dual-registration, full-dispatch configuration)."
    evidence: |
      Domain-level 20-iteration single-race re-run: exit 0 (covered above).
      This spec's own concurrency case (scratch-verify-req023-ac4.ts): 5 iterations, each with a
      fresh chapter/event (capacity=3), 3 admitted seat-holders (seatA/B/C), 2 waitlisted
      candidates (W1 < W2 by created_at), then 4 concurrent bot.handleUpdate dispatches via
      Promise.all: withdraw:confirm for seatA, withdraw:confirm for seatB, and register: for two
      brand-new users -- 4 contenders for 2 freed seats.
      Result, every one of the 5 iterations: admitted count for the event = exactly 3 (never 4,
      never <3). Full per-iteration tgId results:
        iter 0: admitted=[...703,704,705] (seatC + W1 + W2)
        iter 1: admitted=[...713,714,715] (seatC + W1 + W2)
        iter 2: admitted=[...723,724,725] (seatC + W1 + W2)
        iter 3: admitted=[...733,734,735] (seatC + W1 + W2)
        iter 4: admitted=[...743,744,745] (seatC + W1 + W2)
      SECONDARY OBSERVATION (per spec's own instruction to report this): in all 5 iterations the
      waitlisted candidates (W1, W2) won both freed seats and neither of the two fresh registrants
      ever won a seat -- an identical winner pattern every time. Per the spec's own text this is
      "a possible sign the race isn't being genuinely exercised" but "not automatic grounds for a
      FAIL if the admitted-count invariant itself holds every time," which it does, all 5/5. Likely
      cause: in this in-process mock-Telegram harness (no real network latency), the withdraw
      handler's promotion path and the register handler's capacity check both execute fast
      in-process, but Promise.all's array order (withdraws listed before registers) combined with
      Postgres's FOR UPDATE row-lock ordering on the events row appears to consistently let the two
      withdraw-triggered promotion transactions acquire the lock first every time. The admitted-count
      invariant (the actual acceptance criterion) is not weakened by this -- flagging per spec's own
      instruction, not as a FAIL.

  AC5:
    status: PASS
    description: "Promotion into a cancelled event refused; withdrawer's own reply unaffected."
    evidence: |
      Domain-level re-run: exit 0.
      Live-dispatch case: event cancelled via direct SQL (simulating /event_cancel) after a seat
