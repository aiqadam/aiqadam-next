own_defect_found_and_fixed:
  - description: >
      handlers/feedback.db.test.ts's AC2 raw duplicate-INSERT assertion
      originally asserted `.rejects.toMatchObject({ code: "23505" })`
      directly against the thrown error. Drizzle (drizzle-orm's node-postgres
      driver) wraps the raw pg error one level deep as
      `DrizzleQueryError.cause` -- the same shape
      domain/notification.ts's own `pgErrorCode()` helper explicitly unwraps
      (see domain/notification.ts lines 86-90). Fixed to
      `.rejects.toMatchObject({ cause: { code: "23505" } })`. This was this
      test file's own bug, not a spec or implementation defect -- fixed
      before the final run above.
spec_defect_flagged_not_silently_worked_around:
  - acceptance_criterion: AC6
    description: >
      test-specs/REQ-031.md's AC6 static check instructs
      `git grep -in "talk|speaker|want to speak"` across a file list that
      includes apps/bot/src/db/schema.ts in full, expecting zero matches.
      Run exactly as specified, this produces ONE match:
      schema.ts:240's pre-existing comment "// Array of { kind, at, label }
      objects — non-talk agenda items only" (git blame: commit 584707f9,
      2026-09-06, REQ-011 -- predates this branch entirely, confirmed via
      `git log -S"non-talk agenda items"`). This is a false-positive
      substring match on "non-talk" containing "talk", documenting that
      agenda items explicitly EXCLUDE talks -- the opposite of the feature
      AC6 is guarding against, not a talk/speaker feature.
      Re-running the identical grep restricted to only the files this
      requirement actually introduced/touched (domain/feedback.ts,
      handlers/feedback.ts, scheduler/feedbackJobs.ts, i18n/types.ts,
      i18n/ru.ts, i18n/en.ts -- i.e. every file in the list except the
      pre-existing schema.ts comment) produces zero matches (exit code 1).
      Per this run's task instructions ("STOP and report back precisely
      rather than silently altering the test to force a pass"), this is
      reported as-is rather than narrowing the committed grep command.
      Disposition: the SUBSTANCE of AC6 (no talk/speaker feature or entity
      was introduced by REQ-031) is genuinely satisfied; the literal grep
      command as specified is imprecise (schema.ts should either be scoped
      to REQ-031's own new `feedback` table definition, or the pattern
      should exclude "non-talk"). Recommend filing this as a MINOR
      test-spec-precision issue against test-specs/REQ-031.md for
      TEST-DESIGNER, not a blocker on this run.
