issues:
  - severity: MINOR
    description: >
      docs/agents/test-specs/REQ-028.md's AC1 fixture narrative names
      unpadded lastName values "A0".."A11" and claims "A10" sorts to index
      10 (page 1). Verified this claim before building on it: under
      Postgres's default text ordering (byte/lexicographic, same as JS
      string comparison), unpadded "A0".."A11" actually sorts as A0, A1,
      A10, A11, A2, A3, ..., A9 -- "A10" lands at index 2 (page 0), not
      index 10. This run's implementation zero-pads to "A00".."A11" instead,
      which is what the spec's own narrative intent (deterministic order,
      target attendee on page 1 at index 10) actually requires. Scenario,
      assertions, and failure mode are otherwise implemented exactly as
      designed. Recommend TEST-DESIGNER correct the spec's own worked
      example on its next revision.
