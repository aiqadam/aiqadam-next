      (tg_id 700000002). Captured exactly 3 entries: consent prompt+keyboard,
      answerCallbackQuery, then greeting "Это бот AI Qadam Events." -- zero
      chapter-prompt message anywhere in captured array. DB read-back: chapter_id
      non-NULL, equal to the ac2a chapter's id (9989b40d-dd7d-4bcc-8816-0253b2d569e0).
      Silent assignment confirmed.

  - acceptance_criterion: AC2b
    result: pass
    notes: >
      Fixture: 2 active chapters, confirmed alphabetical order via
      "SELECT id,name ... ORDER BY name" -> Almaty then Tashkent. Dispatch /start +
      consent:agree (tg_id 700000003): captured consent prompt, answerCallbackQuery,
      then chapter-prompt "Выберите отделение." with 2 buttons (Almaty ->
      chapter:74bb8863-..., Tashkent -> chapter:f9d695eb-...) matching read-back ids
      exactly; no greeting yet. chapter_id read NULL before the chapter tap. Chapter
      tap (chapter:<almaty-id>) produced answerCallbackQuery + greeting; chapter_id
      afterward equals the tapped Almaty id. All AC2b pass conditions (single prompt,
      exactly 2 buttons matching by name/id, chapter_id NULL-until-tap then correctly
      set) hold.
      OBSERVATION (not a pass-condition failure per AC2b's stated button-count
      criterion, but a real, reproducible deviation from the case's illustrated
      "two rows" payload shape): the actual reply_markup.inline_keyboard array has
      THREE row entries, not two -- [["Almaty" button], ["Tashkent" button], []] --
      a trailing empty array as a third row. Root cause: apps/bot/src/handlers/start.ts
      buildChapterKeyboard() (line ~48) calls `.text(option.name, ...).row()` inside
      the for-loop, so grammY's InlineKeyboard leaves a dangling empty row open after
      the final `.row()` call. This exact extra-empty-row payload also reproduced
      verbatim in AC3's chapter-prompt capture and the ORDERING 2-chapter case (see
      below). Recommend filing as an issue for BACKEND-DEV: drop the trailing
      `.row()` after the loop's last iteration (or call `.row()` between buttons
      only), since Telegram Bot API inline keyboards must consist of button rows and
      a stray empty row is unnecessary payload sent on every 2+-chapter prompt.

