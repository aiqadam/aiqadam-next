cases:
  - acceptance_criterion: AC1
    description: "Kill+restart mid-form resumes at the next unanswered field, first answers preserved"
    result: pass
    notes: >
      Unit re-run (npx vitest run --no-file-parallelism src/domain/profile.test.ts -t
      "AC1's own case"): 1 passed | 19 skipped, exit 0. Genuine two-process live
      integration: seeded a chapter + user past consent/chapter (tg_id 1000000201).
      Phase 1 (apps/bot/scratch-verify-req019-ac1-phase1.ts) launched via
      `npx tsx ... &`, dispatched firstName/lastName/company answers, printed
      "PROCESS_READY_TO_KILL pid=38488" (found after 2 x 1s poll iterations, bounded
      cap 30). Confirmed the PID was a live node.exe via `tasklist /FI "PID eq 38488"`
      before killing. Force-terminated with `taskkill /F /PID 38488` ("SUCCESS: ...
      terminated"), then confirmed it was genuinely gone (not merely that the kill
      command returned) via a bounded tasklist poll -- "No tasks are running which
      match the specified criteria" on the first check. Read-back immediately after
      the kill: first_name='First', last_name='Last', company='Acme Co',
      position/is_student/experience_level all NULL -- the 3 answers survived the hard
      kill as committed rows. Phase 2 (scratch-verify-req019-ac1-phase2.ts), a wholly
      separate `npx tsx` invocation/process with no reference to phase 1, dispatched
      "Some Position" and its own fresh (empty-started) `captured` array showed exactly
      one sendMessage: the isStudent prompt ("Are you a student?" with the student
      keyboard) -- proving phase 2 accepted the dispatch as the `position` answer
      (never re-asking firstName/lastName/company) and correctly advanced to the next
      field. Read-back after phase 2: first_name/last_name/company byte-for-byte
      unchanged, position='Some Position' (newly written), is_student/experience_level
      still NULL.
  - acceptance_criterion: AC1b
    description: "Forged field-mismatch skip and stale-replayed skip never desync from the derived onboarding step"
    result: pass
    notes: >
      Fixture: user with all 6 required fields answered, current derived step is
      `phone` (tg_id 1000000202). Field-mismatch dispatch (forged
      profile:skip:email while real step is phone): captured showed exactly
      answerCallbackQuery + a re-prompt for phone ("Share your phone number (or tap
      Skip).") -- never a github prompt, meaning email was never treated as answered.
      Stale-replay dispatch: real profile:skip:phone (honored, advances to email
      prompt) followed by replaying the same stale profile:skip:phone data again --
      that second call produced only answerCallbackQuery + a re-prompt for email
      (no state change). Final read-back: phone_skipped=true (from the one honored
      call), email_skipped=false (proving the field-mismatch call never wrote either
      flag, and the stale replay was never reinterpreted as answering the
      now-current field).
