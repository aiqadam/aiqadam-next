      "Expected" line ("produces no sendMessage") and its AC-level "Pass conditions"
      paragraph (which explicitly allows "resolved to the consent prompt" as an
      alternative to a silent no-op). The actual implementation
      (handlers/profile.ts's makeProfileSkipCallbackHandler, step 7,
      unconditionally calling advanceAfterWrite) correctly re-sends the consent
      prompt on this path -- this is safe, intended behavior (matches the identical
      re-derive-then-prompt pattern AC1b's cases also exercise), not a product
      defect. Recommend TEST-DESIGNER tighten the per-bullet wording to match the
      AC-level pass condition so a future TEST-RUNNER doesn't have to reconcile the
      two independently. Not blocking -- reported here per the "No Issue Left
      Local-Only" directive for ORCH to file as its own docs/issues/ entry.
