issues_found:
  - severity: minor
    title: "apps/bot startup has no error handling around bot.start()'s rejection — invalid BOT_TOKEN crashes as an uncaught exception rather than a clean named exit"
    description: >
      Observed while running AC2b (dummy DATABASE_URL containing SECRETPW):
      with a syntactically-valid but fake BOT_TOKEN, the process did not
      reach the DB-pool-timeout failure path the REQ-012 test spec's
      commentary anticipated. Instead grammY's `bot.start()` rejected with an
      unhandled GrammyError (404 from Telegram's `deleteWebhook` call), which
      Node printed as an uncaught-exception stack trace and crashed the
      process with a non-zero exit — there is currently no try/catch around
      `bot.start()` in apps/bot's startup path analogous to the one around
      config/DB loading. This does not affect REQ-012's own acceptance
      criteria (SECRETPW still never appears in the output — AC2b passes),
      and it is out of REQ-012's stated scope (which governs DATABASE_URL
      handling and secret redaction, not Telegram token validation). Filing
      as a candidate follow-up for whichever requirement owns bot startup
      error-handling hardening.
    affected_files:
      - apps/bot/src/index.ts
    reported_to: ORCH
