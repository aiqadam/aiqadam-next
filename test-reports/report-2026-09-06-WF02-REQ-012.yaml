    notes: >
      `BOT_TOKEN=dummy-token node apps/bot/dist/index.js` with DATABASE_URL
      unset -> EXIT:1 (non-zero). Captured stdout/stderr is exactly "Missing
      required environment variable(s): DATABASE_URL" — matches
