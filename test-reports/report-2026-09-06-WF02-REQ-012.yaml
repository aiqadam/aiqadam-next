  - acceptance_criterion: AC2b
    description: Dummy DATABASE_URL containing SECRETPW never appears in captured output
    result: pass
    notes: >
      `BOT_TOKEN=dummy-token DATABASE_URL="postgres://baduser:SECRETPW@127.0.0.1:1/nonexistent" node apps/bot/dist/index.js`,
      backgrounded, killed after 8s per spec. `grep -c "SECRETPW"` on the
      captured log -> 0. Observed deviation from the spec's anticipated
      mechanism (informational, not a failure): the process actually crashed
      on an unhandled GrammyError from `bot.start()`'s `deleteWebhook` call
      (404, invalid dummy BOT_TOKEN) before the pg pool's 5000ms
      connectionTimeoutMillis elapsed, rather than surfacing a
      connection-refused error from the DB pool as the spec's commentary
      expected. This does not affect the AC itself, which only requires
      SECRETPW never appear in output (it doesn't, count is 0) — but it is
      worth noting as a candidate follow-up: apps/bot's top-level startup has
      no try/catch around `bot.start()`'s rejection, so an invalid token
      currently produces an uncaught-exception crash rather than a clean
      named-error exit. Reported to ORCH as a MINOR finding (see
      issues_found below), not blocking this run's PASS since it is outside
      REQ-012's stated acceptance criteria (which only govern DATABASE_URL
      handling and secret redaction, not BOT_TOKEN validation).

