root_cause_of_failure:
  test: "apps/bot/src/domain/inviteCodeRedeem.db.test.ts, AC8's first it(), line 470"
  assertion: 'expect(designText).toContain("resolution (a): the rule applies uniformly to every")'
  actual_design_doc_text: >
    docs/agents/design/REQ-038.md lines 606-607 read: "**This design takes resolution (a):
    the rule applies uniformly to\nevery `requires_invite` event**" -- the prose line-wraps
    at 606/607 in the committed markdown source, so the phrase "to every" is split across a
    newline rather than a single space in the raw file text. readFileSync's raw string
    therefore contains "...uniformly to\nevery..." (newline), never "...uniformly to
    every..." (space) as a contiguous substring, so .toContain() cannot match.
  attribution: >
    This is a defect in the test spec's own literal-string assertion (TEST-DESIGNER wrote a
    substring spanning what happens to be a markdown line-wrap boundary in the design doc,
    and TEST-DESIGN-VALIDATOR's Step 3b gate did not catch it), not a defect in BACKEND-DEV's
    design artefact or implementation. The design doc's content is semantically present and
    correct -- AC8's second assertion in the same it() block
    (expect(designText).toContain("No column is added to `events`")) passes, since that
    exact phrase happens to sit on one unbroken line. Per this task's explicit instruction
    ("If any test fails because the spec described something that doesn't match actual code
    behavior, STOP and report precisely rather than silently altering the test to force a
    pass"), the test file was left byte-for-byte as committed in the spec -- neither the
    test nor the design doc was edited to force a green run.
verdict: FAIL
