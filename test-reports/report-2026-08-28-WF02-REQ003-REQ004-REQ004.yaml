issues:
  - id: ISSUE-A
    severity: minor
    description: >
      docs/agents/test-specs/REQ-004.md AC3's "Expected" block states
      Event_count=16 / Chapter_count=17 / Talk_count=22, but running the spec's own
      verbatim script against the actual messages/en.json (on this branch, unchanged
      since the spec was authored per git log) produces Event_count=9 / Chapter_count=3 /
      Talk_count=6. The spec's commit message (631000a) claims "every script command in
      the spec was actually run against the current messages/en.json ... during
      authoring," but messages/en.json was not modified after that commit (verified via
      git log --oneline -- messages/en.json: only 4f64664 wrote the content, before the
      spec commit, with no changes since). The 8 named spot-check string values in the
      same AC3 case are all correct and match the file exactly, so this is isolated to the
      three raw counts, not the substantive vocabulary-correctness check. Root cause not
      determined by TEST-RUNNER (out of role scope to diagnose spec-authoring internals) -
      likely a counting-script discrepancy or a copy/paste error into the spec's Expected
      block during authoring, not a difference in file content.
    recommendation: >
      TEST-DESIGNER should correct AC3's Expected block to the verified actual counts
      (9/3/6) or re-derive and explain the discrepancy; TEST-DESIGN-VALIDATOR's gate
      should re-run spec scripts against the actual repo state rather than trusting an
      authored "was actually run" claim, consistent with core-directives.md's re-derive
      rule. Does not block REQ-004's PASS - the underlying vocabulary-correctness property
      the check exists to verify is confirmed correct by both the spot-check values and
      manual inspection.
  - id: ISSUE-B (recurring, not new)
    severity: minor
    description: >
      Same recurring gap as REQ-003's report ISSUE-1 and REQ-001a's precedent: no browser
      automation tool is available in this execution environment, so AC6c's literal
      viewport-resize and theme-toggle browser steps were not executed as literal browser
      actions. Substituted with server-rendered HTML content-completeness evidence, which
      this requirement's own spec text confirms is theme/viewport-independent for this
      requirement's scope.
    recommendation: "Same as REQ-003's ISSUE-1: provision a browser automation tool for TEST-RUNNER/RELEASE-VALIDATOR at the system level; RELEASE-VALIDATOR should perform an actual browser check if a tool becomes available."
