    verification: "npx vitest run --no-file-parallelism src/handlers/reminder24h.test.ts -t \"AC2\" (existing 3 cases) PLUS the new forgery.test.ts order-of-operations case"
    result: "PASS -- reminder24h.test.ts: 3 passed. reminder24h.forgery.test.ts's own order-of-operations case: passed as part of the full repo-root run (confirm dispatched after a prior decline on the same registrationId is refused with withdraw.refusedNotEligible, reconfirmedAt stays null, zero registration.reconfirm audit rows)."
  - id: AC3
    description: "genuine two-process kill-then-restart -- run, KILL process, restart, run same job again -> exactly ONE message"
    verification: "scratch-verify-req026-p1.ts / -p2.ts, run sequentially via npx tsx against the scratch Postgres, per the spec's exact fixture/kill-point construction"
    result: >-
      PASS. p1: built fixture (chapter Asia/Almaty, event EVENT_KILL startsAt 2026-11-10T20:00:00Z,
      KILL_SUBJECT tg_id 1000000991, registration 639f7881-657a-43b8-a111-1800190c07e8 via a real
      registerForEvent call), called makeReminder24hJob(db, sender, 300000).run(new Date("2026-11-10T00:00:00Z")).then(() => process.exit(0)).
      Observed shell exit code 0. Direct SQL after p1: exactly 1 notification_ledger row for
      (registration_id, kind='reminder_24h'); deliveries file exactly 1 line.
      p2 (npx tsx, a genuinely fresh Pool/drizzle instance via createDbClient, no shared JS heap
      with p1): read registrationId from the sidecar file, called the identical
      makeReminder24hJob(...).run(evaluationTime) again, exit code 0. After p2: deliveries file
      still exactly 1 line (same pid as p1's -- confirms p2 never called sender.send), ledger row
      count still exactly 1, KILL_SUBJECT's registration still admission='admitted'. All 3 pass
      conditions held. Teardown: all 4 scratch files deleted; git status --porcelain confirmed
      clean of any stray AC3 artefact.
  - id: AC4
    description: "withdrawn BEFORE either job runs receives nothing; PLUS this spec's own withdrawn-BETWEEN-selection-and-send (at-send-time recheck) case"
    verification: "npx vitest run --no-file-parallelism src/scheduler/reminderJobs.db.test.ts -t \"AC4\" (from apps/bot) PLUS full repo-root run for the new race case"
    result: >-
      PASS, with one recorded MINOR test-spec deviation (see issues below). The existing
      "withdrawn before either job runs" case: 1 passed as expected. The spec's OWN literal
      construction for the mid-flight-withdraw case ("call withdrawRegistration... before calling
      makeReminder24hJob(...).run(evaluationTime)") was found NOT to reach the property it claims:
      selectRegistrationsForReminder24h (domain/reminders.ts) is a live SQL query filtering
      admission='admitted' at the moment run() executes, so withdrawing the single candidate
      BEFORE run() excludes it from selection entirely (produced 0 ledger rows, 0 sends when run
      literally as specified -- confirmed by direct execution, not conjecture). This is
      indistinguishable from AC4's own already-covered "excluded from selection entirely" case and
      does not exercise composeMessage's own at-send-time recheck at all. Rewrote the case (same
      file, same acceptance intent, own construction) to seed TWO admitted registrations in the
      window and withdraw the second one as a side effect of the first one's own sender.send()
      resolving -- this genuinely lands the withdrawal in the true gap (after
      selectRegistrationsForReminder24h's one read, before the second candidate's own
      composeMessage call). Result: exactly one candidate sent, the other's row is withdrawn while
      its ledger row is still committed (1 row, kind reminder_24h) -- proving step 4's insert
      commits independently of step 5's compose-time skip, exactly as REQ-026.md's own §1.2 rule
      states.
  - id: AC5
    description: "T-3h message has address, both map links, chapter-timezone start time, and a QR decoding to the exact deep link"
    verification: "npx vitest run --no-file-parallelism src/scheduler/reminderJobs.db.test.ts -t \"AC5\" (from apps/bot)"
    result: "PASS -- 1 passed, exit 0"
  - id: AC6
    description: "doors item in agenda -> T-3h quotes BOTH doors time and start time"
    verification: "Subsumed by AC7's own case (both existing BACKEND-DEV AC6/AC7 case and this spec's new AC7 case assert both lines present)"
    result: "PASS"
  - id: AC7
    description: "doors time byte-for-byte identical to REQ-017's card rendering, this spec's own fixture (America/Argentina/Buenos_Aires, en, different doors value/label than BACKEND-DEV's)"
    verification: "New case in reminderJobs.db.test.ts, executed as part of the full repo-root run"
    result: >-
      PASS, with one authoring fix recorded (this run's own responsibility, not a spec defect):
      the first draft reused the shared seedAdmittedRegistration helper, which hardcodes the
      registrant's own lang to \"ru\" -- since resolveLang derives the resolved lang from the
      USER's own lang (not the chapter alone), this silently produced a Russian-language caption
      even with the chapter's defaultLang set to \"en\", and the exact-substring assertion against
      the English-formatted expectedDoorsText failed (caption contained no \"Nov 5, 2026, 18:45\"
      substring at all). Fixed by seeding this case's own registrant directly via
      resolveOrCreateUser(..., lang: \"en\") + registerForEvent, matching the spec's own stated
      intent (\"lang: 'en' instead of 'ru'\"). After the fix: message.caption contains
      expectedDoorsText; buildEventCardContent's own cardDoorsLine.timeText === expectedDoorsText;
      and the exact-substring extracted from the caption's own doors line (split on \"\\n\",
      strip the English catalog.reminder3h.doorsLabel prefix and one space) is byte-for-byte ===
      cardDoorsLine.timeText.
  - id: AC8
    description: "non-doors-only agenda (workshop/afterparty kinds) -> starts_at alone, no leaked agenda time"
    verification: "New case in reminderJobs.db.test.ts, executed as part of the full repo-root run"
    result: "PASS -- caption contains the start-time line, does not contain catalog.reminder3h.doorsLabel, and does not contain either non-doors item's own formatted time."
  - id: AC9
    description: "no doors_at (or equivalent) column exists anywhere"
    verification: "git grep -in \"doors_at\" -- apps/bot ; git grep -in \"doorsAt\" -- apps/bot/src ; git diff master...HEAD --stat -- apps/bot/drizzle"
    result: >-
