issues:
  - severity: MINOR
    description: >-
      docs/agents/test-specs/REQ-026.md's AC4 own-case construction ("call withdrawRegistration...
      before calling makeReminder24hJob(...).run(evaluationTime)") does not actually land the
      withdrawal in the gap it claims to, because selectRegistrationsForReminder24h is a live SQL
      query re-evaluated at run() call time, not a snapshot taken earlier -- withdrawing the sole
      candidate before run() simply excludes it from selection (produces 0 ledger rows), which is
      indistinguishable from AC4's own already-covered "excluded from selection entirely" case and
      never exercises composeMessage's own at-send-time recheck. This run reconstructed the case
      (same acceptance intent, two registrations, second one withdrawn as a side effect of the
      first's own sender.send resolving) to genuinely reach the property, and it passes. Recommend
      TEST-DESIGNER correct the spec's own wording/construction for this case on a future revision
      so a fresh TEST-RUNNER does not need to re-derive the same fix independently.
