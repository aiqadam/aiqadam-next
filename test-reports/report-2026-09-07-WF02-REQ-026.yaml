    verification: "npx vitest run --no-file-parallelism src/scheduler/reminderJobs.db.test.ts -t \"AC10\" (from apps/bot) ; grep -n \"classification:\" apps/bot/src/scheduler/reminderJobs.ts"
    result: "PASS -- 1 passed. grep found exactly 2 matches, both reading classification: \"transactional\", (lines 126 and 152), neither a variable/conditional expression."
  - id: forged-callback-non-authorization
    description: "committed regression coverage for the property SECURITY-REVIEWER verified ad hoc and deleted -- attacker naming a victim's registrationId in a forged reminder24h:confirm/:decline callback"
    verification: "apps/bot/src/handlers/reminder24h.forgery.test.ts, 2 cases, executed as part of the full repo-root run"
    result: >-
      PASS -- both cases pass exactly as specified. Case 1 (no-registration attacker attempts
      confirm): reply is catalog.withdraw.refusedNotFound (non-disclosing), victim row unaffected
      (admission still admitted, reconfirmedAt still null), zero registration.reconfirm audit
      rows for the victim's id. Case 2 (attacker with own separate registration attempts decline):
      reply is refusedNotFound, victim's seat NOT freed (admission still admitted), attacker's OWN
      registration also untouched (rules out a silent-substitution bug), zero
      registration.withdraw audit rows for the victim's id.

overall_verdict: PASS
