      git diff master...HEAD --name-only (schema.ts does not appear in this branch's diff at all).
      Per core-directives.md's Failure Attribution route 1 ("the failing file and its dependencies
      do not appear in git diff --name-only main...HEAD"), this hit is structurally pre-existing
      and not introduced by REQ-026 -- the underlying property (no doors_at COLUMN anywhere) holds.
      Second grep (doorsAt, apps/bot/src): zero matches. Third command: empty output -- no new
      migration file, confirmed REQ-026 ships zero migrations.
  - id: AC10
