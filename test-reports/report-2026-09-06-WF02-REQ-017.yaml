issues_found:
  - severity: minor
    area: docs/agents/test-specs/REQ-017.md
    description: >
      Every fixture's DELETE cleanup statement orders "DELETE FROM chapters; DELETE FROM
      venues;" (parent before child) instead of child-before-parent. venues.chapter_id
      has onDelete: "restrict", so this order raises a foreign-key violation on every
      case after the first (which happened to run against an empty database). Worked
      around by reversing the order (venues before chapters) when seeding AC2 onward --
      a data-setup-mechanics fix only, does not change any assertion or expected result.
      Route to TEST-DESIGNER for a spec correction.
  - severity: minor
    area: docs/agents/test-specs/REQ-017.md (AC4)
    description: >
      AC4's FAIL condition ("any match inside schema.ts is a FAIL") is stated too
      bluntly -- it is triggered by a documentation comment (schema.ts:144-145) that
      explicitly confirms the absence of these columns, not by an actual column
      definition. Recommend narrowing the condition to "a Drizzle column definition or
      migration reference," matching the PASS condition's own wording, which already
      distinguishes this correctly.
  - severity: minor
    area: docs/agents/test-specs/REQ-017.md (AC6d)
    description: >
      AC6d's expected text ("equal to the same events.followCityInvite string as AC6c")
      assumes byte-identical output, but AC6c's chapter has default_lang 'en' while
      AC6d's user has no chapter at all, so resolveLang falls back to the app-wide
      default 'ru' (resolveLang.ts, pre-existing). The underlying behavior (correct
      catalog key, no crash) is right; the spec should say "the same followCityInvite
      catalog key, in whatever language resolveLang selects for this user" rather than
      asserting literal text equality.
